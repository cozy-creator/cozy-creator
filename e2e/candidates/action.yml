name: candidates
description: >
  The candidate set on this runner, named for e2e/lib.sh in $CANDIDATES: TensorD (the dev cozy, <version>+dev.g<sha8>),
  the TensorFS wheel and the cozy-runtime wheel, the change's repo at its commit and the other two at `stack_ref` /
  `runtime_ref` (master), so a mismatch between them fails here and not on PyPI, plus packages master
  ($PACKAGES_MASTER) unless the change is the packages'. With `from: artifacts` (Linux) the set is this run's
  candidate-* artifacts, which e2e.yaml's `candidate` jobs built (build.sh). `from: native-artifact` takes the exact
  native_artifact built once for this runner's OS; otherwise it is built here. No candidate leg tests a released binary:
  a released Runtime before CPU mode cannot run a model on these
  runners, and a released cozy carries the bugs master fixed. `tensord`, `tensorfs` and `runtime` take a release
  candidate instead of a build: its exact version, a prerelease's too, which `cozy machine update` fetches and
  verifies. The change's repo is at .src (with artifacts, the packages' only). Where the OS runs no models itself
  (macOS, Windows: platform::Os::local_inference) the set is cozy alone: there is no machine to take the wheels.
inputs:
  repo:
    description: The repo whose change this is
    required: true
  ref:
    description: Its change's commit
    required: true
  build:
    description: Space-separated build tokens (ci/affected's build:<artifact>); `package` runs the change's packages
    default: ''
  from:
    description: "`artifacts`: this run's Linux candidate-* set; `native-artifact`: the exact native_artifact; empty: build here"
    default: ''
  native_artifact:
    description: "Exact same-run native cozy artifact name, used with `from: native-artifact`"
    default: ''
  stack_ref:
    description: The cozy-creator commit TensorD and TensorFS come from, unless the change is cozy-creator's
    default: master
  runtime_ref:
    description: The cozy-runtime commit the Runtime comes from, unless the change is cozy-runtime's
    default: master
  packages_ref:
    description: The packages commit beside a change that isn't the packages' (empty, its master)
    default: ''
  tensord:
    description: TensorD (cozy) to take instead of building it, an exact release version
    default: ''
  tensorfs:
    description: TensorFS to take instead of building it, an exact release version
    default: ''
  runtime:
    description: The Runtime to take instead of building it, an exact release version
    default: ''
  release:
    description: A cozy-publish.yaml run (a dry run's too) whose own installer installs its cozy, the candidate, in place of a build
    default: ''
outputs:
  cozy_artifact:
    description: The built or reused cozy artifact's input-derived name
    value: ${{ steps.reuse.outputs.name || steps.cozy.outputs.name }}
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
    # e2e/hubcheck, which the suites put between cozy and the Hub (lib.sh).
    - uses: actions/setup-go@v5
      with:
        go-version-file: ${{ github.action_path }}/../hubcheck/go.mod
        cache-dependency-path: ${{ github.action_path }}/../hubcheck/go.sum
    - if: inputs.from == '' || inputs.repo == 'packages'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: .src
    - if: inputs.repo != 'packages'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/packages
        ref: ${{ inputs.packages_ref }}
        path: .pkgs
    - if: inputs.repo != 'packages'
      shell: bash
      run: echo "PACKAGES_MASTER=.pkgs" >> "$GITHUB_ENV"
    - if: inputs.from == 'artifacts'
      uses: actions/download-artifact@v4
      with:
        pattern: candidate-*
        merge-multiple: true
        path: ${{ runner.temp }}/candidates
    - if: inputs.from == 'native-artifact' && inputs.tensord == '' && inputs.release == ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.native_artifact }}
        path: ${{ runner.temp }}/candidates
    - if: inputs.from == '' && inputs.repo != 'cozy-creator'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-creator
        ref: ${{ inputs.stack_ref }}
        path: .stack
    - if: inputs.from == '' && inputs.repo != 'cozy-runtime'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-runtime
        ref: ${{ inputs.runtime_ref }}
        path: .rt
    # cozy as an earlier merge-group or dispatched run built it for this OS from the same build inputs (a PR's own
    # dispatch, for its queue entry), else built here and kept for the next (build.sh).
    - id: reuse
      if: inputs.from == '' && inputs.tensord == '' && inputs.release == ''
      shell: bash
      env:
        REUSE: "1"
        GH_TOKEN: ${{ github.token }}
        CREATOR: ${{ inputs.repo == 'cozy-creator' && '.src' || '.stack' }}
      run: bash "${{ github.action_path }}/build.sh" cozy "$CREATOR" "$RUNNER_TEMP/candidates" > /dev/null
    - if: inputs.from == '' && (steps.reuse.outputs.name == '' || runner.os == 'Linux')
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.repo == 'cozy-creator' && '.src' || '.stack' }} -> target
        save-if: ${{ github.ref == 'refs/heads/master' }}
    # The page cozy embeds; build.sh builds it. A ref from before web/app has none.
    - if: inputs.from == '' && inputs.tensord == '' && inputs.release == '' && steps.reuse.outputs.name == '' && hashFiles(format('{0}/web/app/package.json', inputs.repo == 'cozy-creator' && '.src' || '.stack')) != ''
      uses: actions/setup-node@v4
      with:
        node-version: 24
    - if: inputs.from == '' && inputs.tensord == '' && inputs.release == '' && steps.reuse.outputs.name == '' && hashFiles(format('{0}/web/app/package.json', inputs.repo == 'cozy-creator' && '.src' || '.stack')) != ''
      uses: pnpm/setup@v1
      with:
        package-json-file: ${{ inputs.repo == 'cozy-creator' && '.src' || '.stack' }}/web/app/package.json
        install: false
    - id: cozy
      if: inputs.from == '' && inputs.tensord == '' && inputs.release == '' && steps.reuse.outputs.name == ''
      shell: bash
      env:
        CARGO_INCREMENTAL: "0"
        CREATOR: ${{ inputs.repo == 'cozy-creator' && '.src' || '.stack' }}
      run: bash "${{ github.action_path }}/build.sh" cozy "$CREATOR" "$RUNNER_TEMP/candidates" > /dev/null
    - if: steps.cozy.outputs.name != '' && runner.os != 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.cozy.outputs.name }}
        path: ${{ runner.temp }}/candidates
        if-no-files-found: error
        retention-days: 14
        # cli-os and mps (or cli-release) on one OS in one run build the same cozy.
        overwrite: true
    # Where this OS runs no models, its rental (e2e/release) takes this run's Linux TensorD: the candidate job's build.
    - if: runner.os != 'Linux' && inputs.from != 'native-artifact' && inputs.tensord == '' && inputs.release == ''
      continue-on-error: true
      uses: actions/download-artifact@v4
      with:
        pattern: candidate-cozy-*
        merge-multiple: true
        path: ${{ runner.temp }}/pod
    # The run's files in one directory, as its release would hold them (e2e/lib.sh --release).
    - if: inputs.release != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN: ${{ inputs.release }}
      run: |
        gh run download "$RUN" -R cozy-creator/cozy-creator -p 'artifacts-*' -D "$RUNNER_TEMP/release-artifacts"
        mkdir -p "$RUNNER_TEMP/release"
        find "$RUNNER_TEMP/release-artifacts" -type f -exec mv {} "$RUNNER_TEMP/release/" \;
        ls "$RUNNER_TEMP/release"
    - shell: bash
      env:
        REPO: ${{ inputs.repo }}
        BUILD: ${{ inputs.build }}
        FROM: ${{ inputs.from }}
        TENSORD: ${{ inputs.tensord }}
        RELEASE: ${{ inputs.release }}
        TENSORFS: ${{ inputs.tensorfs }}
        RUNTIME: ${{ inputs.runtime }}
        BUILD_SH: ${{ github.action_path }}/build.sh
        GH_TOKEN: ${{ github.token }}
        CARGO_INCREMENTAL: "0"
      run: |
        set -euo pipefail
        out=$RUNNER_TEMP/candidates exe=''
        [ "$RUNNER_OS" != Windows ] || exe=.exe
        machine=1
        [ "$RUNNER_OS" = Linux ] || machine=''
        if [ -z "$FROM" ]; then
          creator=.stack runtime=.rt
          [ "$REPO" != cozy-creator ] || creator=.src
          [ "$REPO" != cozy-runtime ] || runtime=.src
          [ -n "$TENSORFS" ] || [ -z "$machine" ] || bash "$BUILD_SH" tensorfs "$creator" "$out" > /dev/null
          [ -n "$RUNTIME" ] || [ -z "$machine" ] || bash "$BUILD_SH" runtime "$runtime" "$out" > /dev/null
        fi
        # The TensorD a rental takes, as the release's image will carry it: the version taken, else the Linux build.
        pod=$TENSORD
        [ -n "$pod$RELEASE" ] || pod=$out/cozy
        [ -n "$machine$TENSORD" ] || pod=$(ls "$RUNNER_TEMP/pod/cozy" 2> /dev/null || true)
        # A taken candidate stays its version; a built one is its file (an artifact keeps no file mode); a release
        # run's is what its installer installs.
        if [ -n "$RELEASE" ]; then args=(--release "$RUNNER_TEMP/release")
        else
          [ -n "$TENSORD" ] || { TENSORD=$out/cozy$exe; chmod +x "$TENSORD"; echo "TensorD: $("$TENSORD" --version)"; }
          args=(--tensord "$TENSORD")
        fi
        [ -z "$machine" ] || args+=(--tensorfs "${TENSORFS:-$(ls "$out"/tensorfs-*.whl)}" --runtime "${RUNTIME:-$(ls "$out"/cozy_runtime-*.whl)}")
        [[ " $BUILD " != *" package "* ]] || args+=(--packages .src)
        [ -z "$pod" ] || args+=(--pod-tensord "$pod")
        echo "CANDIDATES=${args[*]}" >> "$GITHUB_ENV"
        echo "candidates: ${args[*]}"
