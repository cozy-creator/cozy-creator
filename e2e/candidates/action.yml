name: candidates
description: >
  The candidate set on this runner, named for e2e/lib.sh in $CANDIDATES: TensorD (the dev cozy, <version>+dev.g<sha8>),
  the TensorFS wheel and the cozy-runtime wheel, the change's repo at its commit and the other two at `stack_ref` /
  `runtime_ref` (master), so a mismatch between them fails here and not on PyPI, plus packages master
  ($PACKAGES_MASTER) unless the change is the packages'. With `from: artifacts` (Linux) the set is this run's
  candidate-* artifacts, which e2e.yaml's `candidate` jobs built (build.sh); otherwise it is built here, for this
  runner's OS. No candidate leg tests a released binary: a released Runtime before CPU mode cannot run a model on these
  runners, and a released cozy carries the bugs master fixed. `tensord`, `tensorfs` and `runtime` take a built
  candidate instead of a build (build.sh's TAKE). The change's repo is at .src (with artifacts, the packages' only).
inputs:
  repo:
    description: The repo whose change this is
    required: true
  ref:
    description: Its change's commit
    required: true
  build:
    description: Space-separated build tokens (ci/affected's build:<artifact>); `package` runs the change's packages
    default: ''
  from:
    description: "`artifacts`: this run's candidate-* artifacts; empty: build the set here"
    default: ''
  stack_ref:
    description: The cozy-creator commit TensorD and TensorFS come from, unless the change is cozy-creator's
    default: master
  runtime_ref:
    description: The cozy-runtime commit the Runtime comes from, unless the change is cozy-runtime's
    default: master
  tensord:
    description: TensorD (cozy) to take instead of building it, this OS's (a version, a release tag or URL#sha256=)
    default: ''
  tensorfs:
    description: The TensorFS wheel to take instead of building it, this OS's (a PyPI version, a release tag or URL#sha256=)
    default: ''
  runtime:
    description: The cozy-runtime wheel to take instead of building it, this OS's (a PyPI version, a release tag or URL#sha256=)
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
    - if: inputs.from != 'artifacts' || inputs.repo == 'packages'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: .src
    - if: inputs.repo != 'packages'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/packages
        path: .pkgs
    - if: inputs.repo != 'packages'
      shell: bash
      run: echo "PACKAGES_MASTER=.pkgs" >> "$GITHUB_ENV"
    - if: inputs.from == 'artifacts'
      uses: actions/download-artifact@v4
      with:
        pattern: candidate-*
        merge-multiple: true
        path: ${{ runner.temp }}/candidates
    - if: inputs.from != 'artifacts' && inputs.repo != 'cozy-creator'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-creator
        ref: ${{ inputs.stack_ref }}
        path: .stack
    - if: inputs.from != 'artifacts' && inputs.repo != 'cozy-runtime'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-runtime
        ref: ${{ inputs.runtime_ref }}
        path: .rt
    - if: inputs.from != 'artifacts'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.repo == 'cozy-creator' && '.src' || '.stack' }} -> target
        save-if: ${{ github.ref == 'refs/heads/master' }}
    - shell: bash
      env:
        REPO: ${{ inputs.repo }}
        BUILD: ${{ inputs.build }}
        FROM: ${{ inputs.from }}
        TENSORD: ${{ inputs.tensord }}
        TENSORFS: ${{ inputs.tensorfs }}
        RUNTIME: ${{ inputs.runtime }}
        BUILD_SH: ${{ github.action_path }}/build.sh
        GH_TOKEN: ${{ github.token }}
        CARGO_PROFILE_RELEASE_LTO: "off"
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        CARGO_INCREMENTAL: "0"
      run: |
        set -euo pipefail
        out=$RUNNER_TEMP/candidates exe=''
        [ "$RUNNER_OS" != Windows ] || exe=.exe
        if [ "$FROM" != artifacts ]; then
          creator=.stack runtime=.rt
          [ "$REPO" != cozy-creator ] || creator=.src
          [ "$REPO" != cozy-runtime ] || runtime=.src
          TAKE=$TENSORD bash "$BUILD_SH" cozy "$creator" "$out" > /dev/null
          TAKE=$TENSORFS bash "$BUILD_SH" tensorfs "$creator" "$out" > /dev/null
          TAKE=$RUNTIME bash "$BUILD_SH" runtime "$runtime" "$out" > /dev/null
        fi
        # (An artifact keeps no file mode.)
        chmod +x "$out/cozy$exe"
        args=(--cozy-bin "$out/cozy$exe" --tensorfs-wheel "$(ls "$out"/tensorfs-*.whl)" --runtime-wheel "$(ls "$out"/cozy_runtime-*.whl)")
        echo "TensorD: $("$out/cozy$exe" --version)"
        [[ " $BUILD " != *" package "* ]] || args+=(--packages .src)
        echo "CANDIDATES=${args[*]}" >> "$GITHUB_ENV"
        echo "candidates: ${args[*]}"
