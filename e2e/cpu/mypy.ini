# e2e/cpu is strictly typed: `mypy --config-file e2e/cpu/mypy.ini e2e/cpu` in a package's environment (run.sh).
[mypy]
strict = True
python_version = 3.12
mypy_path = $MYPY_CONFIG_FILE_DIR
explicit_package_bases = True
warn_unreachable = True

# A fixture builds third-party models: Diffusers' and Transformers' decorated constructors are untyped.
[mypy-tiny.*]
disallow_untyped_calls = False

# Packages ship no py.typed marker; their own annotations are read.
[mypy-minimax_h3.*,h3,gates,story]
follow_untyped_imports = True

[mypy-birefnet.*]
follow_untyped_imports = True

[mypy-moss_image.*]
follow_untyped_imports = True

[mypy-hidream_o1.*]
follow_untyped_imports = True

[mypy-seedvr2.*]
follow_untyped_imports = True

[mypy-relayvsr.*]
follow_untyped_imports = True

[mypy-p_h3_image.*]
follow_untyped_imports = True

[mypy-hunyuan_image_3.*]
follow_untyped_imports = True

# Libraries the driver and cell.py import where they are used (Transformers for Qwen's tokenizer, PyAV and Pillow to
# decode outputs), which a package without them (seedvr2) never reaches.
[mypy-transformers.*,av.*,PIL.*]
ignore_missing_imports = True

# Hugging Face tokenizers ships its stubs without a py.typed marker in some releases a package locks.
[mypy-tokenizers.*]
follow_untyped_imports = True
