# e2e/cpu is strictly typed: `mypy --config-file e2e/cpu/mypy.ini e2e/cpu` in a package's environment (run.sh), with
# the creator gate's strictness (mypy.ini at the root, which skips e2e/cpu for this check).
[mypy]
strict = True
python_version = 3.12
mypy_path = $MYPY_CONFIG_FILE_DIR
explicit_package_bases = True
warn_unreachable = True
disallow_any_generics = True
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True
implicit_reexport = False
enable_error_code = ignore-without-code,possibly-undefined,truthy-bool
# A fixture builds third-party models with untyped constructors: Transformers' models, Diffusers' names from its top
# level (the import path stable across the 0.40-0.42 releases packages lock), which mypy reads as its dummy stand-ins,
# and BiRefNet's vendored upstream code (which the packages' own check skips). Torch leaves torch.cuda.Stream(),
# Event() and _sleep() unannotated.
untyped_calls_exclude = torch,diffusers,transformers,birefnet.upstream

# Packages ship no py.typed marker; their own annotations are read.
[mypy-minimax_h3.*,h3,h3_tables.*,gates,story]
follow_untyped_imports = True

[mypy-birefnet.*]
follow_untyped_imports = True

[mypy-moss_image.*]
follow_untyped_imports = True

[mypy-hidream_o1.*]
follow_untyped_imports = True

[mypy-seedvr2.*]
follow_untyped_imports = True

[mypy-hunyuan_image_3.*]
follow_untyped_imports = True

# Libraries the driver and cell.py import where they are used (Transformers for Qwen's tokenizer, PyAV and Pillow to
# decode outputs), which a package without them (seedvr2, minimax-h3-tools) never reaches.
[mypy-transformers.*,av.*,PIL.*]
ignore_missing_imports = True

# Hugging Face tokenizers ships its stubs without a py.typed marker in some releases a package locks.
[mypy-tokenizers.*]
follow_untyped_imports = True
