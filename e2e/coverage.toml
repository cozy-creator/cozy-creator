# Every cozy command and flag, and the e2e step that tests it (e2e/coverage.py checks both ways against the
# binary under test, and that every entry of the run's tiers was exercised). `test` is the command itself.
#   pr       every PR's cli suite (e2e/cli/run.sh, e2e/cli/commands.sh): a fresh GitHub runner, CPU, signed out
#   release  the release's cli-release suite (e2e/release/run.sh): signed in with the CI key, one cheap rental,
#            a throwaway fidika/ci-e2e-<run> package and model
#   gate     the release gate's GPU pod (release-gate/cells/cli.sh, the stress cells)
#   manual   a person does it, on a path named here      none   not tested: why
#   pending  its tier's test exists or is planned, but no run requires it yet: why
# A new command or flag fails `coverage.py check` until it has a line here and its test runs.

[global]
"--full" = "pr: entrypoints, complete project records"
"--yes" = "pr: entrypoints, noninteractive confirmation"
"--json" = "pr: every step reads the JSON answer"

[completion]
test = "pr: completion, each shell's script loads and completes cozy's verbs"

[doctor]
test = "pr: doctor, healthy, then a stuck Calcifer it restarts"
"--on" = "pr: doctor --on local"

[login]
test = "pr: rental_end, with the code the isolated Hub logs (by hand: the emailed code, release-gate/enroll-ci-key.sh)"
"--export" = "pr: rental_end, a pod's own key (release-gate/enroll-ci-key.sh mints the CI key with it)"
"--key" = "pr: rental_end, the exported key and a copy of this computer's (release: the runner loads the CI key)"
[logout]
test = "pr: signed out, logout says so; rental_end: an enrolled key revoked, an installed one only forgotten"
"--everywhere" = "none: revokes every other key of the account (Paul's own); needs a separate test account"
[whoami]
test = "pr: signed out, whoami says so (release: signed in as fidika, its balance and the buy page)"

[new]
test = "pr: entrypoints, explicit creation in the current directory or a named directory"

[status]
test = "pr: entrypoints, current-project health counts and warnings with an expanded full record"

[update]
test = "pr: update, the candidate to the newest release"

["machine ls"]
test = "pr: machines"
"--history" = "release: the rental in its history, ended, with its cost"
"--since" = "release: the rental in its history (--since 1h, alone and with --history)"
["machine show"]
test = "pr: machines"
["machine logs"]
test = "pr: machine logs, the machine's and Calcifer's"
"--follow" = "pr: machine logs, it keeps printing"
"--lines" = "pr: machine logs"
"--since" = "pr: machine logs"
["machine update"]
test = "pr: candidates"
"--runtime" = "pr: candidates"
"--tensorfs" = "pr: candidates"
"--tensord" = "pr: candidates"
"--gpu-memory-limit" = "gate: stress, the 8/6/3 GiB caps"
"--mode" = "gate: varena/machine-mode/prove.py, shared/dedicated update, live status, native Start and restore"
["machine add"]
test = "pr: this runner's own machine by its address, refused (release-gate session multi-machine: one pod adds another, runs on it, removes it)"
"--fingerprint" = "pr: this runner's own machine, refused"
["machine authorize"]
test = "pr: a new controller's key, then where to add the machine (session multi-machine: another pod adds it, and a removed key is refused)"
"--remove" = "pr: the key taken back (session multi-machine: its next call refused)"
["machine end"]
test = "pr: local, refused (release: a rental; session multi-machine: an added pod removed)"
"--force" = "pr: rental_end, the isolated Hub's docker rental refused signed out and with a revoked key, then ended (release: a rental ended with a run still going)"
["machine rent"]
test = "pr: rental_end, the isolated Hub's docker cpu (release: a GPU rental)"
"--disk-gb" = "release: rental, its disk"
"--gpus" = "release: rental, more GPUs than the SKU has is refused before buying"
"--ssh" = "pr: renting, signed out, a private key file refused before any ask; rental_end: no path, the default key (release-gate session multi-machine rents and logs in with it)"
["machine ssh"]
test = "pr: local, refused as no rental; rental_end: a rental not ready yet, and signed out (release-gate session multi-machine runs every shell step through it)"
["machine use"]
test = "pr: machine set, a project pinned to local and a stand-in machine, its runs only there, an unknown machine refused, then any again"
["machine keepalive"]
test = "release: rental, keepalive moves its idle deadline"

["package ls"]
test = "pr: packages"
"--limit" = "pr: packages"
"--offset" = "pr: packages"
"--on" = "pr: packages"
["package install"]
test = "pr: packages (gate: tensord unversioned-installed, an installed package moved to its newest)"
"--on" = "pr: packages"
["package uninstall"]
test = "pr: packages"
"--on" = "pr: packages"
["package publish"]
test = "release: throwaway package, published"
"--root" = "manual: first-party releases only (packages' task publish), never a throwaway at the root"
"--yanked" = "release: throwaway package, published yanked"
["package yank"]
test = "release: throwaway package, yanked"
"--undo" = "release: throwaway package, un-yanked"

["package delete"]
test = "release: delete an isolated publication fixture"
["model ls"]
test = "pr: models"
"--family" = "pr: models"
"--tag" = "pr: models, only models tagged nsfw"
"--no-tag" = "pr: models, none tagged nsfw"
"--limit" = "pr: models"
"--offset" = "pr: catalog pagination parser and model list pages"
"--on" = "pr: models"
"--fits" = "pr: slot_choices, Qwen Image's rewriter, Klein's upsampler and H3's base model"
["model install"]
test = "pr: models"
"--lane" = "pr: models"
"--on" = "pr: models"
"--source-format" = "pr: models, the local file no format knows kept as-is"
["lora ls"]
test = "pending: authoritative Hub role metadata"
"--family" = "pending: authoritative Hub role metadata"
"--tag" = "pending: authoritative Hub role metadata"
"--no-tag" = "pending: authoritative Hub role metadata"
"--limit" = "pending: authoritative Hub role metadata"
"--offset" = "pending: authoritative Hub role metadata"
"--on" = "pending: LoRA classification in local inventory"
["lora install"]
test = "pending: same download handler as model install"
"--lane" = "pending: same download handler as model install"
"--on" = "pending: same download handler as model install"
"--source-format" = "pending: same download handler as model install"
["model unpublish"]
test = "release: owner release visibility and scoped private-version install"
["lora unpublish"]
test = "release: retained LoRA release visibility and checkpoint-reference protection"
["model uninstall"]
test = "pending: local model removal backend fixture"
["lora uninstall"]
test = "pending: shared local model removal backend fixture"
["lora edit"]
test = "release: LoRA metadata fixture"
"--family" = "release: LoRA metadata fixture"
"--tag" = "release: LoRA metadata fixture"
"--untag" = "pending: shared model edit handler"
"--trigger" = "release: LoRA metadata fixture"
"--strength" = "release: LoRA metadata fixture"
["lora upload"]
test = "release: adapter weights uploaded without inference"
"--lane" = "release: adapter weights uploaded without inference"
"--source-format" = "release: adapter weights uploaded without inference"
"--on" = "release: adapter weights uploaded without inference"
"--mirror" = "manual: shared model upload handler"
"--trained-on" = "manual: LoRA training metadata"
"--trigger" = "manual: shared LoRA metadata handler"
"--strength" = "manual: shared LoRA metadata handler"
"--base" = "manual: shared model upload handler"
["lora publish"]
test = "pending: shared model publish handler"
["lora delete"]
test = "release: LoRA fixture cleanup through the shared model deletion handler"
["model edit"]
test = "release: throwaway model, family and tags set and cleared"
"--family" = "release: throwaway model, family set and cleared (none)"
"--tag" = "release: throwaway model, tags added"
"--untag" = "release: throwaway model, a tag removed in any case and spacing, one it never had, then each cleared"
["model upload"]
test = "release: throwaway model, uploaded from a file, from a held file, from a run's output, and a commit recorded"
"--on" = "release: throwaway model"
"--lane" = "release: throwaway model, two lanes"
"--source-format" = "release: throwaway model, its files kept as-is"
"--mirror" = "manual: an admin mirrors a real author's model into its parked org (xs-131, proved on the dev Hub); a CI run would park a real author's org on tensorhub.com"
"--base" = "none: a community DiT (66 GB) on a Hub model's header, on a rental; proven by hand"
["model publish"]
test = "release: throwaway model, published with two lanes"
["model delete"]
test = "release: throwaway model, deleted"
["model quantize"]
test = "gate: cli cells, the throwaway model's int8 and fp8 lanes"
"--lane" = "gate: cli cells"
"--package" = "gate: cli cells"
"--on" = "gate: cli cells"

[run]
test = "pr: a weightless request; BiRefNet on the CPU"
"--input" = "pr: a YAML request, then inline inputs over it"
"--file" = "pr: BiRefNet on the CPU"
"--file-fidelity" = "pr: run flags"
"--describe" = "pr: run flags, the contract and no run"
"--on" = "pr: BiRefNet on the CPU; machine set, one machine over the project's and two by `a,b`"
"--lane" = "pr: run flags"
"--model" = "pr: entrypoints rejects malformed model overrides; run flags forwards a model slot"
"--gpus" = "gate: cli cells"
"--attention-kernel" = "gate: cli cells"
"--lora" = "gate: cli cells"
"--output" = "pr: the CLI in a folder Calcifer can't see: a script's still, downloaded by its digest (-o)"
"--previews" = "pr: previews: a denoise loop on the CPU, its previews saved while it runs"
["run watch"]
test = "pr: a run followed, a snapshot, a cancel"
"--once" = "pr: a run followed, a snapshot, a cancel"
"--output" = "pr: a tool: a Latents result stays on its machine, any other file comes down (-o)"
"--previews" = "pr: previews: the run followed again, its previews saved"
["run ls"]
test = "pr: run ls filters"
"--state" = "pr: run ls filters"
"--package" = "pr: run ls filters"
"--all" = "pr: a project's runs, then every run"
"--on" = "pr: run ls filters"
"--limit" = "pr: run ls filters"
["run cancel"]
test = "pr: a run followed, a snapshot, a cancel"

# Hidden (`hide = true`, in no --help): probed in the binary; `coverage.py --source` finds any not listed here.
[hidden]
"machine rent --provider" = "pending: dev-only (`dev = true`, crates/cli/DEV.md); release-gate/suites/hub rents cpu once per provider where the config has it, ended and checked gone"
"run --attention-capture" = "manual: dev-only (`dev = true`, crates/cli/DEV.md); release-gate/suites/attention-corpus captures with it on a rented pod (xs-171 M-B)"
"package publish" = "release: isolated package publication; TensorHub admins only in v1"
"model upload" = "release: isolated model upload; TensorHub admins only in v1"
"model publish" = "release: isolated model publication; TensorHub admins only in v1"
"model quantize" = "manual: package-defined quantization; TensorHub admins only in v1"
"lora upload" = "release: isolated LoRA upload; TensorHub admins only in v1"
