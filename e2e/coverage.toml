# Every cozy command and flag, and the e2e step that tests it (e2e/coverage.py checks both ways against the
# binary under test, and that every entry of the run's tiers was exercised). `test` is the command itself.
#   pr       every PR's cli suite (e2e/cli/run.sh, e2e/cli/commands.sh): a fresh GitHub runner, CPU, signed out
#   release  the release's cli-release suite (e2e/release/run.sh): signed in with the CI key, one cheap rental,
#            a throwaway fidika/ci-e2e-<run> package and model
#   gate     the release gate's GPU pod (release-gate/cells/cli.sh, the stress cells)
#   manual   a person does it, on a path named here      none   not tested: why
#   pending  its tier's test exists or is planned, but no run requires it yet: why
# A new command or flag fails `coverage.py check` until it has a line here and its test runs.

[global]
"--json" = "pr: every step reads the JSON answer"
"--full" = "pr: agent, a run's whole record and the live view's columns"
"--yes" = "pr: candidates (machine update -y)"

[completion]
test = "pr: completion, each shell's script loads and completes cozy's verbs"

[doctor]
test = "pr: doctor, healthy, then a stuck Calcifer it restarts"
"--on" = "pr: doctor --on local"

[login]
test = "manual: a person types the emailed code (release-gate/enroll-ci-key.sh)"
"--export" = "manual: release-gate/enroll-ci-key.sh mints the CI key with it"
"--key" = "release: sign-in, the runner loads the CI key"
[logout]
test = "pr: signed out, logout says so (signed in, it revokes the CI key: none)"
"--everywhere" = "none: revokes every other key of the account (Paul's own); needs a separate test account"
[whoami]
test = "pr: signed out, whoami says so (release: signed in as fidika, its balance and the buy page)"

[status]
test = "pr: status, Calcifer and the local machine"

[update]
test = "pr: update, the candidate to the newest release"

["machine ls"]
test = "pr: machines"
"--history" = "release: the rental in its history, ended, with its cost"
"--since" = "release: the rental in its history (--since 1h, alone and with --history)"
["machine show"]
test = "pr: machines"
["machine logs"]
test = "pr: machine logs, the machine's and Calcifer's"
"--follow" = "pr: machine logs, it keeps printing"
"--lines" = "pr: machine logs"
"--since" = "pr: machine logs"
["machine update"]
test = "pr: candidates"
"--runtime" = "pr: candidates"
"--tensorfs" = "pr: candidates"
"--tensord" = "pr: candidates"
"--gpu-memory-limit" = "gate: stress, the 8/6/3 GiB caps"
"--mode" = "gate: varena/machine-mode/prove.py, shared/dedicated update, live status, native Start and restore"
["machine add"]
test = "pr: this runner's own machine by its address, refused (release-gate session multi-machine: one pod adds another, runs on it, removes it)"
"--fingerprint" = "pr: this runner's own machine, refused"
["machine authorize"]
test = "pr: a new controller's key, then where to add the machine (session multi-machine: another pod adds it, and a removed key is refused)"
"--remove" = "pr: the key taken back (session multi-machine: its next call refused)"
["machine end"]
test = "pr: local, refused (release: a rental; session multi-machine: an added pod removed)"
"--force" = "release: rental, ended with a run still going"
["machine rent"]
test = "release: rental"
"--disk-gb" = "release: rental, its disk"
"--gpus" = "release: rental, more GPUs than the SKU has is refused before buying"
"--ssh" = "pr: renting, signed out, a private key file refused before any ask (release-gate session multi-machine rents and logs in with it)"
["machine ssh"]
test = "pr: local, refused as no rental (release-gate session multi-machine runs every shell step through it)"
["machine keepalive"]
test = "release: rental, keepalive moves its idle deadline"

["package ls"]
test = "pr: packages"
"--limit" = "pr: packages"
"--on" = "pr: packages"
["package info"]
test = "pr: packages"
["package install"]
test = "pr: packages"
"--on" = "pr: packages"
["package update"]
test = "gate: tensord unversioned-installed"
"--on" = "gate: tensord unversioned-installed"
["package remove"]
test = "pr: packages"
"--on" = "pr: packages"
["package lock"]
test = "release: throwaway package, locked"
"--upgrade-package" = "release: throwaway package, locked"
"--root" = "manual: first-party releases only (packages' task publish), never a throwaway at the root"
["package publish"]
test = "release: throwaway package, published"
"--root" = "manual: first-party releases only (packages' task publish), never a throwaway at the root"
"--yanked" = "release: throwaway package, published yanked"
["package yank"]
test = "release: throwaway package, yanked"
"--undo" = "release: throwaway package, un-yanked"
["package delete"]
test = "release: throwaway package, deleted"

["model ls"]
test = "pr: models"
"--family" = "pr: models"
"--tag" = "pr: models, only models tagged nsfw"
"--no-tag" = "pr: models, none tagged nsfw"
"--limit" = "pr: models"
"--on" = "pr: models"
["model info"]
test = "pr: models"
["model download"]
test = "pr: models"
"--lane" = "pr: models"
"--on" = "pr: models"
"--source-format" = "pr: models, the local file no format knows kept as-is"
["model edit"]
test = "release: throwaway model, family, tags, trigger and strength set and cleared"
"--family" = "release: throwaway model, family set and cleared (none)"
"--tag" = "release: throwaway model, a tag added"
"--untag" = "release: throwaway model, a tag removed"
"--tags" = "release: throwaway model, tags set and cleared"
"--trigger" = "release: throwaway model, trigger set and cleared"
"--strength" = "release: throwaway model, strength set and cleared (none)"
["model upload"]
test = "release: throwaway model, uploaded from a file, from a held file, from a run's output, and a commit recorded"
"--on" = "release: throwaway model"
"--lane" = "release: throwaway model, two lanes"
"--source-format" = "release: throwaway model, its files kept as-is"
"--mirror" = "manual: an admin mirrors a real author's model into its parked org (xs-131, proved on the dev Hub); a CI run would park a real author's org on tensorhub.com"
"--trained-on" = "manual: tfs-137 proof, an SDXL LoRA's adapter record on local (the H3 warning run on a 4090)"
"--trigger" = "manual: tfs-137 proof on the dev Hub, set at upload and shown by model info"
"--strength" = "manual: tfs-137 proof on the dev Hub, set at upload and shown by model info"
"--base" = "none: a community DiT (66 GB) on a Hub model's header, on a rental; proven by hand"
["model publish"]
test = "release: throwaway model, published with two lanes"
["model delete"]
test = "release: throwaway model, deleted"
["model quantize"]
test = "gate: cli cells, the throwaway model's int8 and fp8 lanes"
"--lane" = "gate: cli cells"
"--package" = "gate: cli cells"
"--on" = "gate: cli cells"

["org edit"]
test = "manual: a platform admin edits a parked org's name, links and handles on tensorhub.com (xs-131); a CI edit would change a real parked org"
"--name" = "manual: as the command"
"--link" = "manual: as the command"
"--handle" = "manual: as the command"
["org claim"]
test = "manual: the author posts the code on a handle the org lists, then claims (xs-131, proved on the dev Hub); a CI claim needs a parked org and a public handle"

[run]
test = "pr: a weightless request; BiRefNet on the CPU"
"--input" = "pr: a YAML request, then inline inputs over it"
"--file" = "pr: BiRefNet on the CPU"
"--file-fidelity" = "pr: run flags"
"--describe" = "pr: run flags, the contract and no run"
"--warm" = "pr: run flags, each warm level and off"
"--on" = "pr: BiRefNet on the CPU"
"--lane" = "pr: run flags"
"--gpus" = "gate: cli cells"
"--attention-kernel" = "gate: cli cells"
"--lora" = "gate: cli cells"
["run show"]
test = "pr: a run followed, a snapshot, a cancel"
"--once" = "pr: a run followed, a snapshot, a cancel"
["run ls"]
test = "pr: run ls filters"
"--state" = "pr: run ls filters"
"--package" = "pr: run ls filters"
"--all" = "pr: a project's runs, then every run"
"--on" = "pr: run ls filters"
"--limit" = "pr: run ls filters"
["run cancel"]
test = "pr: a run followed, a snapshot, a cancel"
["run play"]
test = "pr: run play, its link serves the output, then expires"
"--output" = "pr: run play"
"--expires" = "pr: run play"

# Hidden (`hide = true`, in no --help): probed in the binary; `coverage.py --source` finds any not listed here.
[hidden]
"machine rent --provider" = "pending: dev builds only (cargo feature `dev`), never in a release; release-gate/suites/hub rents cpu once per provider with a dev-build cozy, ended and checked gone; the Hub decides who may"
"machine rent --image-digest" = "pending: release tier, a Hub admin's gated worker-image bake; waits for the CI key"

[open]
test = "pr: web-serves (e2e/cli/web.sh), every OS: its link, redeemed in Chrome; each refusal; Place and a kill -9 in the page"
"--no-open" = "pr: web-serves; a project's session: its folder, a folder of none, an older format. Opening a browser: manual, a person on a desktop"

["project new"]
test = "pr: projects (e2e/cli/project.sh): a folder holding only project.yaml"

["project ls"]
test = "pr: projects: the index, a moved folder missing, a DELETEd one gone"

["project status"]
test = "pr: projects: by -p from elsewhere; what changed; a rename suggested; orphans with their bytes; by the CLI: one asset"

["project wait"]
test = "pr: agent: nothing going says the project, a render followed to its end, a failure exits 1 (gate: a stall exits 4)"

["project render"]
test = "pr: projects: only what has no state; reverting runs nothing; cuts; a function's inputs; every mention filled; a world-state series"
"--on" = "pr: projects: --on local"
"--approve" = "pr: projects: --approve with -n 2 refused before any run"
"--missing" = "pr: projects: only what has no state; reverting runs nothing"
"--outdated" = "pr: a pin out of date: skipped by the plain run, re-run at its turn, its pin gone, the version it held kept"
"--take" = "pr: projects: keeps: the take reaches the function as continue_from, one it doesn't have refused"
"--in" = "pr: projects: keeps: where it lands, ignored with all"
"--queue" = "pr: projects: three queued, one canceled, the rest land"
"--plain" = "pr: projects: by asset, one line per event on a terminal too"

["project cancel"]
test = "pr: projects: a queued take dropped; alone or not, what it canceled isn't sent again"

["project import"]
test = "pr: projects: a path and a URL as real files and named elements, a type refused, one file for two elements; what the page does: parts, by hash, canvas, thumbs"
"--description" = "pr: web-live: a file lifted out as its own asset, with its words"
"--into" = "pr: projects: a file joins a box as its next version, and makes no asset of its own"

["project add"]
test = "pr: by the CLI: fields, a name, where it sits; web-live: shows on the open canvas within a second"

["project set"]
test = "pr: by the CLI: a value, JSON, clearing, what makes it, where it sits; web-live: on the open canvas, past what's typed"
"--input" = "pr: by the CLI: fields from a file, from stdin, a term over them; web-live: an Edit's clips"

["project delete"]
test = "pr: by the CLI: prints what restores it; web-live: gone from the open canvas"
"--version" = "pr: discards: a take off its box at once, one or several, each printing what restores it"

["project restore"]
test = "pr: by the CLI: the line delete printed, run as printed, its takes kept; web-live: back where it was"
"--version" = "pr: discards: a discarded take back in its place, as delete printed it"
"--approved" = "pr: discards: the approved take back with its approval, as delete printed it"

["project upgrade"]
test = "pr: projects: format 2 to format 3, nothing out of date and nothing run"
"--status" = "pr: projects: what the older cozy said, its measurements and fields kept"

["project approve"]
test = "pr: projects: one line of project.yaml, comments surviving, an edit just before it surviving"

["project unapprove"]
test = "pr: projects: gives the file back, restoring an input the pin was over"

["project rename"]
test = "pr: projects: old renamed new, its versions kept, its reader out of date"

["project reclaim"]
test = "pr: projects: lists, deletes only what nothing else names, refuses while rendering, and with --yes deletes"

["project push"]
test = "manual: release-gate/sessions/project-remote.sh (pod-session, signed in): nothing moves twice, a killed push goes on"

["project pull"]
test = "manual: release-gate/sessions/project-remote.sh: a clone of yaml and lock, signed in as a second home: the same edit.mp4"
