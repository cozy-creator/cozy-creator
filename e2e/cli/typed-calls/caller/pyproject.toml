[project]
name = "xs198-typed-caller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.49.0.dev0,<0.50", "xs198-typed-child"]

[tool.uv.sources]
xs198-typed-child = { path = "../child" }
xs198-typed-leaf = { path = "../leaf" }

[project.entry-points."cozy.application"]
default = "typed_caller:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typed_caller"]
