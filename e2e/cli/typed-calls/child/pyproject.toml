[project]
name = "xs198-typed-child"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.47.0.dev0,<0.48"]

[project.optional-dependencies]
cozy-calls = ["xs198-typed-leaf[cozy-calls]"]

[project.entry-points."cozy.application"]
default = "typed_child:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typed_child"]

[tool.uv.sources]
xs198-typed-leaf = { path = "../leaf" }
