[project]
name = "xs198-typed-leaf"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.48.0.dev0,<0.49", "sympy>=1.14", "xxhash>=3"]

[project.entry-points."cozy.application"]
default = "typed_leaf:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["typed_leaf"]
