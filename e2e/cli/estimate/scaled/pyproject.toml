[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-scaled"
version = "0.1.0"
description = "estimate_scaled's tool: its past renders scale by its rows' exponent (cl-1286)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.49.0.dev0,<0.50", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_scaled:app"

[tool.uv.build-backend]
module-name = "e2e_scaled"
module-root = ""
