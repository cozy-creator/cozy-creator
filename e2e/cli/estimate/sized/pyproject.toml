[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-sized"
version = "0.1.0"
description = "estimate_plan's sized estimate (cl-1286)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.48.0.dev0", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_sized:app"

[tool.uv.build-backend]
module-name = "e2e_sized"
module-root = ""
