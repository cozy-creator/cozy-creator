[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-words"
version = "0.1.0"
description = "E2E Words, an image tool that reads words only, as a third party's may: the web suite's tool that reads no picture (se-175)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.45", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_words:app"

[tool.uv.build-backend]
module-name = "e2e_words"
module-root = ""
