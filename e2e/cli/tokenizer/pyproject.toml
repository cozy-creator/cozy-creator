[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-tokenizer"
version = "0.1.0"
description = "A package carrying a file its model holds too (disk_run_object, cl-1076)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.43.1", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_tokenizer:app"

[tool.uv.build-backend]
module-name = "e2e_tokenizer"
module-root = ""
