[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-badrule"
version = "0.1.0"
description = "A rule that reads a field its request doesn't have (cl-1103): the ondemand_rules cell's"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.47.0.dev0,<0.48", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_badrule:app"

[tool.uv.build-backend]
module-name = "e2e_badrule"
module-root = ""
