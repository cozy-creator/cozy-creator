[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-enhance"
version = "0.1.0"
description = "Two prompt enhancers, each needed by rule (cl-1101, cl-1103): the ondemand_enhancers and ondemand_behind cells'"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.48.0.dev0,<0.49", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_enhance:app"

[tool.uv.build-backend]
module-name = "e2e_enhance"
module-root = ""
