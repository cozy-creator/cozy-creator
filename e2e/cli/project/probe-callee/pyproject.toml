[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-probe-callee"
version = "0.1.0"
description = "The tools cells' second package: a CPU shade a composed tool calls, and a GPU enlarge it calls only when asked"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.43.1", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_probe_callee:app"

[tool.uv.build-backend]
module-name = "e2e_probe_callee"
module-root = ""
