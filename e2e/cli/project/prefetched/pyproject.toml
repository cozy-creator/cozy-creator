[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-prefetched"
version = "0.1.0"
description = "A published tool of two models that share a VAE, for the prefetch cells (cl-1104)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.45", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_prefetched:app"

[tool.uv.build-backend]
module-name = "e2e_prefetched"
module-root = ""
