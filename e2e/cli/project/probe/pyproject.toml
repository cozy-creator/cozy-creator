[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-probe"
version = "0.1.0"
description = "The tools cells' package: a composed tool calling e2e-probe-callee"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.44", "e2e-probe-callee", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_probe:app"

[tool.uv.sources]
e2e-probe-callee = { path = "../probe-callee" }

[tool.uv.build-backend]
module-name = "e2e_probe"
module-root = ""
