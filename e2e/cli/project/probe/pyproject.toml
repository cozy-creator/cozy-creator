[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-probe"
version = "0.1.0"
description = "The tools cells' package: a composed tool calling e2e-probe-callee"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.43", "e2e-probe-callee", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_probe:app"

[tool.uv.sources]
e2e-probe-callee = { path = "../probe-callee" }
# Until cozy-runtime 0.43.0 is on PyPI: rc/tools, the 0.22 line.
cozy-runtime = { git = "https://github.com/cozy-creator/cozy-runtime", rev = "fcf43544c7794e249b570ffc27d0c5bfd0a9c54c" }

[tool.uv.build-backend]
module-name = "e2e_probe"
module-root = ""
