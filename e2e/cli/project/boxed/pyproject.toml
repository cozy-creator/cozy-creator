[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-boxed"
version = "0.1.0"
description = "The web-package-ui cell's package: weightless tools whose boxes it draws itself"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.43,<0.43.1", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_boxed:app"

[tool.uv.build-backend]
module-name = "e2e_boxed"
module-root = ""
