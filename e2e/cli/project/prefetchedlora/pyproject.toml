[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-prefetched-lora"
version = "0.1.0"
description = "A published tool whose one slot is a LoRA with a default, for prefetch_yields' swap (cl-1281)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.45", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_prefetched_lora:app"

[tool.uv.build-backend]
module-name = "e2e_prefetched_lora"
module-root = ""
