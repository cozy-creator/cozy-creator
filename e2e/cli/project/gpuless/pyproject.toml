[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-gpuless"
version = "0.1.0"
description = "Tools that each build a model, some timed without a GPU by benchmarks.json or a formula: prefetch_gpuless's (cl-1279, cl-1286)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.49.0.dev0", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_gpuless:app"

[tool.uv.build-backend]
module-name = "e2e_gpuless"
module-root = ""
