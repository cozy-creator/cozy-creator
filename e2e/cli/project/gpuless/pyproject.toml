[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-gpuless"
version = "0.1.0"
description = "Two tools that each build a model, one timed without a GPU by its benchmarks.json: prefetch_gpuless's (cl-1279)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.45", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_gpuless:app"

[tool.uv.build-backend]
module-name = "e2e_gpuless"
module-root = ""
