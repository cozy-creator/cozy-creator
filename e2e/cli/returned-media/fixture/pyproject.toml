[project]
name = "xs198-images"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.47.0.dev0,<0.48", "pillow>=12", "av>=19"]

[project.entry-points."cozy.application"]
default = "images:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["images"]
