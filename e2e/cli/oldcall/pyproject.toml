[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-oldcall"
version = "0.1.0"
description = "Runtime 0.46's managed call with files, as cozy 0.25.0's packages make it (cl-1160)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.46.0,<0.47", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_oldcall:app"

[tool.uv.build-backend]
module-name = "e2e_oldcall"
module-root = ""
