[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-clip"
version = "0.1.0"
description = "The cli suite's hostile_inputs cell: a video input's length, as the Runtime's decoder reads it"
requires-python = ">=3.12"
dependencies = ["cozy-runtime[media]>=0.37", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_clip:app"

[tool.uv.build-backend]
module-name = "e2e_clip"
module-root = ""
