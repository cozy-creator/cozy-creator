[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-scratch"
version = "0.1.0"
description = "What a call writes by default and prints, and where it went (shared_scratch, cl-984)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.45", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_scratch:app"

[tool.uv.build-backend]
module-name = "e2e_scratch"
module-root = ""
