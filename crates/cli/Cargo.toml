[package]
name = "cli"
description = "The cozy command line: grammar, rendering, and the client of Calcifer and machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anstream.workspace = true
anstyle.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
platform = { workspace = true, features = ["fetch"] }
calcifer.workspace = true
protocol.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
getrandom.workspace = true
hex.workspace = true
jiff = { workspace = true, features = ["serde", "tz-system"] }
indicatif.workspace = true
ratatui.workspace = true
reqwest.workspace = true
self-replace.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
supports-hyperlinks.workspace = true
tempfile.workspace = true
tensorfs = { workspace = true, features = ["store"] }
tokio = { workspace = true, features = ["signal"] }
url.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["termios"] }


[features]
# Dev builds only: the hidden `cozy machine rent --provider`. Never in a release.
dev = []

[lints]
workspace = true
