[package]
name = "cli"
description = "The cozy command line: grammar, rendering, and the client of Calcifer and machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anstream.workspace = true
anstyle.workspace = true
base64.workspace = true
bytes.workspace = true
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
platform = { workspace = true, features = ["fetch"] }
api.workspace = true
futures-util = { workspace = true, features = ["alloc"] }
getrandom.workspace = true
hex.workspace = true
jiff = { workspace = true, features = ["serde", "tz-system"] }
ratatui.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tensorfs = { workspace = true, features = ["net"] }
tokio = { workspace = true, features = ["signal"] }
unicode-width.workspace = true
url.workspace = true
zip.workspace = true
toon-format = { version = "0.7.0", default-features = false }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["termios"] }


[features]
# Dev builds only: the hidden `cozy machine rent --provider`. Never in a release.
dev = []

[lints]
workspace = true
