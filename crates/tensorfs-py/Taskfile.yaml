version: "3"
silent: true

tasks:
  orders:
    desc: Regenerate the constructor-order references (crates/tensorfs/orders/<class>.json) from Diffusers/Transformers
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - uv run --script scripts/orders.py --write
  keeps:
    desc: Regenerate the keep-in-fp32 table (crates/tensorfs/keeps.json) from Diffusers' and Transformers' model classes
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - uv run --script scripts/keeps.py --write
