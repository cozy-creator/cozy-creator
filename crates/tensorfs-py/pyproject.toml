[build-system]
requires = ["maturin>=1.16,<2"]
# maturin, behind a clear refusal when an sdist build finds no Rust (backend/tensorfs_build.py).
build-backend = "tensorfs_build"
backend-path = ["backend"]

[project]
name = "tensorfs"
version = "0.17.16"
description = "Load, store and share model weights: a self-describing tensor format, a deduplicating local store and the tfs CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Cozy Creator" }]
requires-python = ">=3.10"
keywords = ["model weights", "tensors", "safetensors", "quantization", "pytorch", "diffusers"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/cozy-creator/cozy-creator/tree/master/crates/tensorfs"
Documentation = "https://github.com/cozy-creator/cozy-creator/blob/master/crates/tensorfs-py/API.md"
Repository = "https://github.com/cozy-creator/cozy-creator"
Issues = "https://github.com/cozy-creator/cozy-creator/issues"

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "tensorfs._ext"
python-source = "python"
# Dependencies are included explicitly with their canonical SONAME. Automatic repair
# must not rename the process-wide allocator and create a second instance.
auditwheel = "skip"
compatibility = "linux"
# abi3 needs the limited API's buffer protocol, which starts at 3.11: one cp311-abi3 wheel serves
# 3.11 and later, and a cp310 wheel serves 3.10 (`-i python3.10 python3.11` builds both).
features = ["extension-module", "store", { feature = "pyo3/abi3-py311", python-version = ">=3.11" }]
# One artifact, one version (tfs-051): the wheel carries the `tfs` binary at
# .data/scripts/, so `pip install tensorfs==<v>` yields module AND CLI everywhere.
# build.rs supplies the exact shared dependencies to both installation locations.
# The PEP 517 backend stages the CLI; direct maturin CI uses its before-script.
data = "wheel-data"
# Git and the sdist carry the empty data dir through this placeholder, so a source build (a
# git dependency or the sdist) works; it never ships in a wheel. tensorfs carries the
# documents it compiles in itself (crates/tensorfs/vectors/).
include = [{ path = ".native/*", from = "out-dir", to = "tensorfs" }, { path = "wheel-data/scripts/.gitkeep", format = "sdist" }, { path = "backend/*.py", format = "sdist" }, { path = "LICENSE", format = "sdist" }, { path = "shim/*", format = "sdist" }, { path = "python/tensorfs/_varena_torch.so", format = "wheel" }, { path = "python/tensorfs/_varena_torch.json", format = "wheel" }]
exclude = [{ path = "wheel-data/scripts/.gitkeep", format = "wheel" }]
