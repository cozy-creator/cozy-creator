[package]
name = "tensorfs-py"
version = "0.23.1"
edition = "2021"
license.workspace = true
publish.workspace = true

[lib]
name = "_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
executor-api = { workspace = true, features = ["python"] }
varena.workspace = true
varena-ledger.workspace = true
libc.workspace = true
platform = { workspace = true, features = ["seams"] }
tensorfs = { workspace = true, features = ["net", "cuda"] }
pyo3 = "0.29.2"
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Native feature isolation remains available to Rust builds. The published Python
# distribution always enables store; managed executor authority comes from its owner.
default = ["store"]
store = ["tensorfs/quantize"]
extension-module = ["pyo3/extension-module"]
kernel-fork-guard = ["varena/kernel-fork-guard"]
strict-pid-guard = ["varena/strict-pid-guard"]

[lints]
workspace = true
