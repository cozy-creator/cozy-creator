      required: [files]
      properties:
        files: {type: array, items: {$ref: '#/components/schemas/PackageDeclaredFile'}}
    PackageReleaseFinalize:
      type: object
      required: [publication_id]
      properties:
        publication_id: {type: string}
        python_version: {type: string}
    PackageReleaseGrants:
      type: object
      required: [files, publication_id]
      properties:
        files: {type: array, items: {$ref: '#/components/schemas/PackageFileGrant'}}
        publication_id: {type: string}
    PackageReleasePath:
      type: string
      description: |
        Where each file of a release is declared: pyproject.toml and uv.lock at the root,
        Runtime describe's interface at metadata/package-interface.json, and under the three
        directories the project wheel, the source archive (.tar.gz) and each git dependency's
        wheel, by file name.
      enum: [pyproject.toml, uv.lock, metadata/package-interface.json, artifacts/project/, artifacts/source/, artifacts/dependencies/]
    PackageReleaseSummary:
      type: object
      required: [release, package_interface_digest, package_interface_length, created_at]
      properties:
        release: {type: string}
        package_interface_digest: {type: string}
        package_interface_length: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        committed_at: {type: string, format: date-time}
        yanked: {type: boolean}
        yanked_at: {type: string, format: date-time}
    PackageSearch:
      type: object
      required: [packages, search]
      properties:
        packages: {type: array, items: {$ref: '#/components/schemas/PackageSummary'}}
        search: {$ref: '#/components/schemas/SearchMeta'}
    PackageSummary:
      type: object
      required: [org, name, created_at]
      properties:
        org: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        latest_release: {type: string, description: The newest committed release that is not yanked.}
    PackageYank:
      type: object
      required: [changed, release, state, yanked_at]
      properties:
        changed: {type: boolean}
        release: {type: string}
        state: {type: string}
        yanked_at: {type: string, format: date-time}
    PackageUnyank:
      type: object
      required: [changed, release, state]
      properties:
        changed: {type: boolean}
        release: {type: string}
        state: {type: string}
    PresignedUpload:
      type: object
      required: [url, required_headers]
      properties:
        url: {type: string}
        required_headers: {type: object, additionalProperties: {type: string}}
    Rental:
      type: object
      description: One rental. Provider facts are present for an admin only.
      required:
      - rental_id
      - name
      - state
      - requested_accelerator_model
      - accelerator_count
      - creator_public_key
      - base_worker_image_digest
      - hourly_rate_usd_micros
      - spend_usd_micros
      - spend_basis
      - container_disk_gb
      - created_at
      properties:
        placement_note:
          type: string
          description: The rental runs off the continent its request came from, because nothing there fit.
        development: {type: boolean}
        ssh_address: {type: string}
        rental_id: {type: string}
        name: {type: string}
        state: {type: string}
        sku:
          type: string
          description: The product asked for, then the one its latest attempt bought (one of the request's sku and fallbacks).
        requested_accelerator_model:
          type: string
          description: The card asked for, then the one bought; accelerator_count and the hourly rate follow it.
        provider: {type: string}
        provider_machine_id: {type: string}
        machine_name: {type: string}
        provider_resource_id: {type: string}
        accelerator_count: {type: integer, format: int64}
        worker_address: {type: string}
        worker_id: {type: string}
        worker_boot_id: {type: string}
        media_address: {type: string}
        cert_pem: {type: string}
        media_token_sha256: {type: array, items: {type: string}}
        creator_public_key: {type: string}
        base_worker_image_digest: {type: string}
        base_worker_image_tag: {type: string}
        base_worker_profile: {type: string}
        hourly_rate_usd_micros: {type: integer, format: int64}
        compute_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        bandwidth_usd_micros_per_gb: {type: integer, format: int64}
        placement_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
        vcpu_count: {type: integer, format: int64}
        memory_gb: {type: integer, format: int64}
        spend_usd_micros: {type: integer, format: int64}
        spend_basis: {type: string}
        provider_cost_usd_micros: {type: integer, format: int64}
        provider_cost_basis: {type: string}
        container_disk_gb: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        release_cause: {type: string}
        detail: {type: string}
        failure: {$ref: '#/components/schemas/RentalFailure'}
        provider_refusal: {type: string}
        provider_warning:
          type: string
          description: >-
            For an admin, while the rental lives: the prepaid provider account its machine runs on is
            spent, or lasts less than a few hours at its current spend.
        boot: {$ref: '#/components/schemas/RentalBoot'}
        unreachable_since: {type: string, format: date-time}
        webrtc: {$ref: '#/components/schemas/RentalWebRtc'}
    RentalBoot:
      type: object
      description: The current attempt's boot, while it is acquired.
      required: [attempt, state, runtime_observed, observed_at]
      properties:
        pull: {$ref: '#/components/schemas/RentalImagePull'}
        attempt: {type: integer, format: int64}
        state: {type: string}
        datacenter: {type: string}
        container: {type: string}
        runtime_observed: {type: boolean}
        phase: {type: string}
        phase_started_at: {type: string, format: date-time}
        activity: {type: string}
        started_at: {type: string, format: date-time}
        last_progress_at: {type: string, format: date-time}
        boot_log_at: {type: string, format: date-time}
        observed_at: {type: string, format: date-time}
        replanned_from: {$ref: '#/components/schemas/RentalReplannedBoot'}
    RentalDevelopment:
      type: object
      required: [ssh_public_key]
      properties: {ssh_public_key: {type: string, maxLength: 8192}}
    RentalFailure:
      type: object
      required: [code, base_worker_image_digest]
      properties:
        code: {type: string}
        base_worker_image_digest: {type: string}
        provider: {type: string}
        provider_resource_id: {type: string}
        provider_host_id: {type: string}
        provider_state: {type: string}
        container_state: {type: string}
    RentalImagePull:
      type: object
      description: The image pull as the provider's boot log measured it.
      required:
      - observable
      - layers_observed
      - layers_complete
      - layers_failing
      - download_bytes
      - download_total_bytes
      - extract_bytes
      - extract_total_bytes
      - estimate_scope
      properties:
        observable: {type: boolean}
        layers_observed: {type: integer, format: int64}
        layers_complete: {type: integer, format: int64}
        layers_failing: {type: integer, format: int64}
        download_bytes: {type: integer, format: int64}
        download_total_bytes: {type: integer, format: int64}
        download_bytes_per_second: {type: number, format: double}
        extract_bytes: {type: integer, format: int64}
        extract_total_bytes: {type: integer, format: int64}
        extract_bytes_per_second: {type: number, format: double}
        remaining_seconds: {type: number, format: double}
        estimate_scope: {type: string}
        last_measured_at: {type: string, format: date-time}
    RentalListing:
      type: object
      required: [rentals, bindings_revision, credit]
      properties:
        rentals: {type: array, items: {$ref: '#/components/schemas/Rental'}}
        bindings_revision: {type: integer, format: int64}
        credit:
          description: Null for an unmetered account, or when billing cannot be read now.
          nullable: true
          allOf: [{$ref: '#/components/schemas/CreditStatus'}]
    RentalPlacement:
      type: object
      required:
      - package
      - release
      - function
      - gpus
      - accelerator
      - weights
      - weight_bytes
      - machines
      - excluded
      properties:
        package: {type: string}
        release: {type: string}
        function: {type: string}
        gpus: {type: integer, format: int64}
        accelerator:
          type: boolean
          description: False for a function its package runs on a CPU machine.
        weights: {type: array, items: {$ref: '#/components/schemas/RentalPlacementWeights'}}
        weight_bytes: {type: integer, format: int64}
        machines: {type: array, items: {$ref: '#/components/schemas/RentalPlacementMachine'}}
        excluded:
          type: array
          items: {$ref: '#/components/schemas/RentalPlacementExclusion'}
    RentalPlacementExclusion:
      type: object
      required: [name, accelerator_count, code, reason]
      properties:
        name: {type: string}
        accelerator_count: {type: integer, format: int64}
        code:
          type: string
          description: placement.vram_short, placement.width_unavailable, placement.lane_unsupported, placement.python_unsupported or placement.sku_unavailable.
        reason: {type: string}
    RentalPlacementMachine:
      type: object
      required:
      - name
      - accelerator_model
      - compute_capability
      - vram_gb
      - accelerator_count
      - price_usd_micros_per_hour
      - storage_usd_micros_per_hour
      - container_disk_gb
      - expected_price
      properties:
        name: {type: string}
        accelerator_model: {type: string}
        compute_capability: {type: string}
        vram_gb: {type: integer, format: int64}
        accelerator_count: {type: integer, format: int64}
        price_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        container_disk_gb: {type: integer, format: int64}
        expected_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
        lane: {type: string, description: The lane the main model resolves to on this card.}
        weight_bytes: {type: integer, format: int64, description: The weights this card's machine loads.}
        speed:
          type: number
          format: double
          description: Effective dense TOPS at the lane, from the card's spec sheet (memory GB/s for a decode model).
        fast: {type: boolean, description: Whether the speed is fast enough to be picked.}
        run_cost:
          type: number
          format: double
          description: Cost per run against the cheapest machine's (1).
    RentalPlacementRequest:
      type: object
      required: [package, function]
      properties:
        package: {type: string, description: org/name}
        release: {type: string, description: Absent reads the newest release.}
        function: {type: string}
        lane: {type: string, description: "The main model slot's lane label; absent: resolved by each card, as resolve_model does."}
        gpus: {type: integer, format: int64, minimum: 1, description: Absent asks for one or a degree the function declares.}
        sku: {type: string, description: "A product to place on (`--on new:<sku>`): only its GPU counts are ranked."}
    RentalPlacementWeights:
      type: object
      required: [slot, bytes]
      properties:
        slot: {type: string}
        model: {type: string}
        release: {type: string}
        lane: {type: string}
        bytes: {type: integer, format: int64}
        unsized: {type: string, description: Why the slot adds no bytes.}
    RentalPriceEstimate:
      type: object
      description: What a rental is expected to cost at its prices, for the expected hours plus its download.
      required:
      - hours
      - download_gb
      - download_hours
      - gpu_usd_micros
      - disk_usd_micros
      - download_usd_micros
      - total_usd_micros
      properties:
        hours: {type: number, format: double}
        download_gb: {type: integer, format: int64}
        download_mbps: {type: integer, format: int64}
        download_hours: {type: number, format: double}
        gpu_usd_micros: {type: integer, format: int64}
        disk_usd_micros: {type: integer, format: int64}
        download_usd_micros: {type: integer, format: int64}
        total_usd_micros: {type: integer, format: int64}
    RentalPythonInterpreter:
      type: object
      required: [version, abi]
      properties: {version: {type: string}, abi: {type: string}}
    RentalQuote:
      type: object
      description: The product (with every width buyable now) and the one width the request would lock.
      required:
      - name
      - accelerator_model
      - base_worker_profile
      - compute_capability
      - vram_gb
      - widths
      - accelerator_count
      - price_usd_micros_per_hour
      - storage_usd_micros_per_hour
      - container_disk_gb
      - expected_price
      properties:
        excluded_provider_machines:
          type: array
          description: Echoed for an admin's ask only.
          items: {type: string}
        python_provisionable_minors: {type: array, items: {type: string}}
        python_interpreters:
          type: array
          items: {$ref: '#/components/schemas/RentalPythonInterpreter'}
        name: {type: string}
        accelerator_model: {type: string}
        base_worker_profile: {type: string}
        compute_capability: {type: string}
        cpu_arch: {type: string, description: 'The host CPU: amd64 or arm64.'}
        memory_class: {type: string, description: 'How the GPU reaches host memory: discrete, coherent or unified.'}
        vram_gb: {type: integer, format: int64}
        widths: {type: array, items: {$ref: '#/components/schemas/RentalSkuWidth'}}
        accelerator_count: {type: integer, format: int64}
        price_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        bandwidth_usd_micros_per_gb: {type: integer, format: int64}
        container_disk_gb: {type: integer, format: int64}
        vcpu_count: {type: integer, format: int64}
        memory_gb: {type: integer, format: int64}
        expected_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
    RentalReplannedBoot:
      type: object
      description: The failed attempt the current one replaced.
      required: [attempt, started_at, ended_at, failure_code]
      properties:
        attempt: {type: integer, format: int64}
        datacenter: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        failure_code: {type: string}
        limit_ms: {type: integer, format: int64}
        observed_max_ms: {type: integer, format: int64}
    RentalRequest:
      type: object
      description: A rental's product intent; a quote takes the same body.
      required: [name, sku, media_token_sha256, creator_public_key]
      properties:
        development: {$ref: '#/components/schemas/RentalDevelopment'}
        name:
          type: string
          description: 1-32 lowercase letters, digits and hyphens, beginning with a letter.
        sku: {type: string, description: A product name from GET /v1/rental-skus.}
        fallbacks:
          type: array
          maxItems: 16
          description: >-
            Machines the rental may be bought as, in order, when no offer of the asked one is bought (a run's
            other placements). Each is bought only at or below the hourly price accepted for the asked one,
            and only on the same host CPU; a product this Hub does not sell is ignored.
          items: {$ref: '#/components/schemas/RentalFallback'}
        provider:
          type: string
          description: An admin's provider choice; refused from anyone else. Omitted buys from every provider.
        excluded_provider_machines:
          type: array
          description: An admin's excluded provider machines; refused from anyone else.
          items: {type: string}
        image:
          type: string
          maxLength: 512
          description: "An admin's sign-in only: a kind, a tag, either pinned @sha256:<digest>, or a bare sha256:<digest> of the machine kind's tag, in place of the default."
        accelerator_count:
          type: integer
          format: int64
          minimum: 0
          description: GPU count; 0 or omitted is 1.
        media_token_sha256:
          type: string
          description: SHA-256 of the Creator-minted media token, 64 lowercase hex.
        creator_public_key:
          type: string
          description: The rental's Ed25519 public key, unpadded base64url.
        planned_source_bytes: {type: integer, format: int64, minimum: 0}
        serving_models:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/RentalServingModel'}
        container_disk_gb: {type: integer, format: int64, minimum: 0, maximum: 4096}
    RentalFallback:
      type: object
      required: [sku]
      properties:
        sku: {type: string}
        accelerator_count: {type: integer, format: int64, minimum: 0, description: GPU count; 0 or omitted is 1.}
    RentalServingModel:
      type: object
      required: [model]
      properties:
        lane: {type: string}
        manifest: {type: string}
        model: {type: string}
        release: {type: string}
    RentalSku:
      type: object
      description: One product (a GPU card, or the CPU machine) with the widths buyable now.
      required:
      - name
      - accelerator_model
      - base_worker_profile
      - compute_capability
      - vram_gb
      - widths
      properties:
        python_provisionable_minors: {type: array, items: {type: string}}
        python_interpreters:
          type: array
          items: {$ref: '#/components/schemas/RentalPythonInterpreter'}
        name: {type: string}
        accelerator_model: {type: string, description: 'The GPU model, or CPU.'}
        base_worker_profile: {type: string}
        compute_capability: {type: string, description: major.minor; empty for the CPU product.}
        cpu_arch: {type: string, description: 'The host CPU: amd64 or arm64.'}
        memory_class: {type: string, description: 'How the GPU reaches host memory: discrete, coherent or unified.'}
        vram_gb: {type: integer, format: int64}
        widths:
          type: array
          description: The GPU counts buyable now, ascending.
          items: {$ref: '#/components/schemas/RentalSkuWidth'}
    RentalSkuList: {type: array, items: {$ref: '#/components/schemas/RentalSku'}}
    RentalSkuStatus:
      type: object
      description: One (product, GPU count)'s standing.
      required: [name, accelerator_count, known, offered]
      properties:
        name: {type: string}
        accelerator_count: {type: integer, format: int64}
        known: {type: boolean, description: This hub sells a product of that name.}
        offered: {type: boolean, description: Buyable now at that count.}
        sku: {$ref: '#/components/schemas/RentalSku'}
        last_seen_at:
          type: string
          format: date-time
          description: When that count was last buyable; absent when offered now or never seen.
        unavailable_reason:
          type: string
          description: Why compatible stock is held back (cooldown, retry_in_progress).
        retry_after: {type: string, format: date-time}
    RentalSkuWidth:
      type: object
      description: One buyable GPU count of a product and its per-machine prices.
      required:
      - accelerator_count
      - price_usd_micros_per_hour
      - storage_usd_micros_per_hour
      - container_disk_gb
      - expected_price
      properties:
        accelerator_count: {type: integer, format: int64}
        price_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        bandwidth_usd_micros_per_gb:
          type: integer
          format: int64
          description: The most a GB of traffic costs, where the provider bills traffic.
        container_disk_gb: {type: integer, format: int64}
        vcpu_count: {type: integer, format: int64}
        memory_gb: {type: integer, format: int64}
        expected_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
    RentalWebRtc:
      type: object
      description: A ready machine rental's browser-media listener.
      required: [address, fingerprint]
      properties: {address: {type: string}, fingerprint: {type: string}}
    SearchMeta:
      type: object
      required: [total, limit, capped]
      properties:
        total: {type: integer, format: int64}
        limit: {type: integer, format: int64}
        capped: {type: boolean, description: More matched than the answer holds.}
    Software:
      type: object
      required: [runtime, tensorfs, pinned]
      properties:
        runtime: {type: string}
        tensorfs: {type: string}
        cozy:
          type: string
          description: The cozy binary's release version (`cozy --version`, tag v<cozy>). Absent, a machine keeps its binary.
        pinned:
          type: boolean
          description: The version is the operator's pin, not the current worker image's.
    WorkerAuthorizedKeys:
      type: object
      required: [worker_id, authorized_keys, lease_seconds]
      properties:
        worker_id: {type: string}
        authorized_keys:
          type: array
          description: Ed25519 public keys, unpadded base64url, sorted.
          items: {type: string}
        lease_seconds:
          type: integer
          format: int64
          description: How long the keys may be trusted before asking again.
    WorkerEndpointReport:
      type: object
      required: [public_host, ports]
      properties:
        public_host: {type: string, description: The machine's public IP.}
        ports:
          type: object
          description: Private TCP port (a decimal string) to its public port.
          minProperties: 1
          maxProperties: 16
          additionalProperties: {type: integer, format: int64, minimum: 1, maximum: 65535}
    WorkerReleaseRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id: {type: string, description: Equal to the X-Cozy-Worker-ID header.}
  parameters:
    Org: {name: org, in: path, required: true, schema: {type: string}, description: 'An account, or `_` for the root namespace (first-party models and packages).'}
    Name: {name: name, in: path, required: true, schema: {type: string}}
    Release: {name: release, in: path, required: true, schema: {type: string}}
    Commit: {name: commit, in: path, required: true, schema: {type: string}, description: 'sha256:<hex>'}
