[package]
name = "api"
description = "The types of every cozy API (Calcifer's, the machine's) and the formats and pieces they share; no HTTP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
executor-api.workspace = true
base64.workspace = true
platform.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
tensorfs.workspace = true
serde_ignored.workspace = true
serde_path_to_error.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true
idna_adapter.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
# TypeScript declarations of the API's records, for the page (examples/ts.rs).
ts = ["dep:ts-rs"]

[[example]]
name = "ts"
required-features = ["ts"]

[lints]
workspace = true
