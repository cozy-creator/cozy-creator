[package]
name = "api"
description = "The types of every cozy API (Calcifer's, the machine's) and the formats and pieces they share; `hub` adds the Hub's client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
executor-api.workspace = true
base64.workspace = true
platform = { workspace = true, features = ["seams"] }
ed25519-dalek.workspace = true
hex.workspace = true
saphyr.workspace = true
saphyr-parser.workspace = true
serde.workspace = true
tensorfs.workspace = true
serde_ignored.workspace = true
serde_path_to_error.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
url.workspace = true
idna_adapter.workspace = true
ts-rs = { workspace = true, optional = true }
aws-lc-rs = { workspace = true, optional = true }
httpdate = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"], optional = true }
tracing = { workspace = true, optional = true }

[features]
# The Hub's client (`hub`), which Calcifer and TensorD share: the only HTTP here.
hub = ["dep:aws-lc-rs", "dep:httpdate", "dep:percent-encoding", "dep:reqwest", "dep:tokio", "dep:tracing", "tensorfs/net"]
# TypeScript declarations of the API's records, for the page (examples/ts.rs).
ts = ["dep:ts-rs"]

[[example]]
name = "ts"
required-features = ["ts"]

[lints]
workspace = true
