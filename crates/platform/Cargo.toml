[package]
name = "platform"
description = "Every OS-specific seam of the cozy binary: paths, locks, files, processes, containment, shared memory, IPC, services, GPU probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
getrandom = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
libloading = { workspace = true, optional = true }
libmimalloc-sys = { workspace = true, optional = true }
nvml-wrapper = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
sigstore-verify = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[features]
default = ["seams"]
# Every seam but `signal`, which varena's shared core links alone. Without it: thiserror, and rustix or windows-sys.
seams = ["dep:getrandom", "dep:hex", "dep:libc", "dep:libloading", "dep:nvml-wrapper", "dep:serde", "dep:sha2", "dep:tracing"]
# The cozy binary's allocator, mimalloc, asked to give freed memory back (`heap::give_back`): for the crates that run in that
# binary only. A library that links platform (varena's dylib, TensorFS) carries no mimalloc.
allocator = ["seams", "dep:libmimalloc-sys"]
# Fetched archives: a cozy release verified (`release`) and members unpacked (`tools::unpack`).
fetch = ["seams", "dep:flate2", "dep:serde_json", "dep:sigstore-verify", "dep:tar", "dep:zip"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true, optional = true }
# use-libc-auxv: page size and clock ticks from getauxval, so they need no /proc.
rustix = { workspace = true, features = ["event", "fs", "net", "param", "process", "thread", "use-libc-auxv"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
