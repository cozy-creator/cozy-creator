openapi: 3.1.0
info:
  title: cozy machine API
  version: '1'
  description: |
    One machine's API on its pinned-TLS port (design/machine-http-api.md), served by TensorD
    (`crates/tensord/src/api/http.rs`) with the types of `protocol::machine`. Every request carries
    `authorization: Cozy-Cap <token>`; refusals are the error envelope. Unknown fields are ignored and a
    missing field reads as its empty value.

    This file follows the server: a change to a route or a body lands here in the same PR.
    `scripts/machine-routes.sh` (the build check) holds TensorD's router and this file to the same
    routes, both ways, and every route the machine client (`protocol::machine::client`) calls to it.

security: [{cozy_cap: []}]

paths:
  /v1/health:
    get:
      summary: >-
        Answers 204 when nothing authorizes the request, 401 when something does: a probe that the listener is
        up.
      operationId: health
      responses: {'204': {description: Up}, '401': {description: The request carried a credential}}
      security: [{}]
  /v1/keepalive:
    post:
      summary: Starts a rental's idle clock over and answers the frame with the new deadline.
      operationId: keepalive
      responses:
        '200':
          description: The frame
          content: {application/json: {schema: {$ref: '#/components/schemas/StatusFrame'}}}
        '409':
          description: This machine has no idle deadline
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
  /v1/logs/{name}:
    get:
      summary: >-
        A log the machine keeps (`tensorfs-transport`, `memory`, `tensord`): its whole lines. With `Accept:
        text/event-stream`, those and then each batch as it is appended, across rotations.
      operationId: log
      parameters:
        - {name: name, in: path, description: The log's name, required: true, schema: {type: string}}
        - name: lines
          in: query
          description: 'Its newest N whole lines; absent or 0: all'
          schema: {type: integer, format: int64, minimum: 0}
        - name: Last-Event-ID
          in: header
          description: Follow on from this event's place
          schema: {type: [string, 'null']}
      responses:
        '200':
          description: 'The lines, or SSE `event: lines` with the place after them as id'
          content:
            text/plain: {schema: {type: string}}
            text/event-stream: {schema: {$ref: '#/components/schemas/LogLines'}}
        '404':
          description: No such log
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '503':
          description: '`log_follow_unsupported`: this machine''s OS cannot follow'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
  /v1/objects/held:
    post:
      summary: >-
        What the machine holds of many objects in one request, in the order asked: each stored object whole
        (renewed, as a `HEAD` renews it), else the ranges its upload has landed.
      operationId: held_objects
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/HeldRequest'}}}
        required: true
      responses:
        '200':
          description: Each object's held ranges
          content: {application/json: {schema: {$ref: '#/components/schemas/HeldAnswer'}}}
        '400':
          description: A digest that is not `sha256:<hex>`
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
  /v1/objects/{digest}:
    get:
      summary: >-
        What this signer's upload of the object holds as its parts land, as SSE `held` events after each MiB
        more, ending once it holds all `length` bytes. A stored object answers at once.
      operationId: follow_object
      parameters:
        - {name: digest, in: path, description: '`sha256:<hex>`', required: true, schema: {type: string}}
        - name: length
          in: query
          description: The object's length
          required: true
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: 'SSE `event: held`'
          content: {text/event-stream: {schema: {$ref: '#/components/schemas/HeldBytes'}}}
        '507':
          description: '`machine_disk_full`'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    put:
      summary: >-
        Lands one part of the object: the body is `Content-Range`'s bytes (without it, the whole object).
        Parts may go side by side, in any order. Once the held ranges cover the object, the machine verifies
        its sha256 and stores it for the signer; bytes that differ are dropped (`object_digest_mismatch`).
      operationId: put_object
      parameters:
        - {name: digest, in: path, description: '`sha256:<hex>`', required: true, schema: {type: string}}
        - name: Content-Range
          in: header
          description: '`bytes first-last/length`'
          schema: {type: [string, 'null']}
      requestBody:
        content:
          application/octet-stream: {schema: {type: array, items: {type: integer, format: int32, minimum: 0}}}
        required: true
      responses:
        '204':
          description: Landed
          headers: {Cozy-Held: {schema: {type: string}, description: What is held now}}
        '400':
          description: '`object_digest_mismatch`, `object_length_exceeded`, an invalid range'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '507':
          description: '`machine_disk_full`'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
    head:
      summary: >-
        The byte ranges of the object the machine holds for this signer, in `Cozy-Held`. A stored object is
        held whole, and asking renews it, so a run sent next finds it.
      operationId: head_object
      parameters:
        - {name: digest, in: path, description: '`sha256:<hex>`', required: true, schema: {type: string}}
      responses:
        '200':
          description: What is held
          headers:
            Cozy-Held: {schema: {type: string}, description: '`first-last,…` inclusive; empty: nothing'}
  /v1/runs:
    post:
      summary: >-
        Submits a run, idempotent on its id per signer: the same id with the same spec answers its state; with
        another spec, `run_id_conflict`. An update's activation and a rental's idle release wait for it.
      operationId: submit
      requestBody:
        content: {application/json: {schema: {$ref: '#/components/schemas/RunRequest'}}}
        required: true
      responses:
        '200':
          description: Already accepted
          content: {application/json: {schema: {$ref: '#/components/schemas/RunState'}}}
        '201':
          description: Accepted
          content: {application/json: {schema: {$ref: '#/components/schemas/RunState'}}}
        '400':
          description: An invalid spec
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '409':
          description: '`run_id_conflict`, or a refusal of the run'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '503':
          description: '`machine_updating` or `machine_released`'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
  /v1/runs/{id}/cancel:
    post:
      summary: >-
        Cancels the run. An id the machine never received is recorded canceled, so a late submit of it answers
        that.
      operationId: cancel
      parameters: [{name: id, in: path, description: The run id, required: true, schema: {type: string}}]
      responses:
        '200':
          description: Its state
          content: {application/json: {schema: {$ref: '#/components/schemas/RunState'}}}
  /v1/runs/{id}/events:
    get:
      summary: >-
        The run's log after `Last-Event-ID` as SSE: first `state` (the snapshot), then `progress`, `product`,
        `log`, `call`, `gpu` and finally `outcome`, after which the stream ends. Durable events carry `id:
        <sequence>`; live ones none. Closing it never cancels the run.
      operationId: events
      parameters:
        - {name: id, in: path, description: The run id, required: true, schema: {type: string}}
        - name: Last-Event-ID
          in: header
          description: Resume after this sequence
          schema: {type: [integer, 'null'], format: int64, minimum: 0}
        - name: after
          in: query
          description: As `Last-Event-ID`
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: 'SSE: `event: <variant>`, data the whole event'
          content: {text/event-stream: {schema: {$ref: '#/components/schemas/RunEvent'}}}
        '404':
          description: No such run
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
  /v1/runs/{id}/outputs/{output}:
    get:
      summary: An output's current bytes, readable while it grows (each revision is a `product` event).
      operationId: output
      parameters:
        - {name: id, in: path, description: The run id, required: true, schema: {type: string}}
        - {name: output, in: path, description: The output's name, required: true, schema: {type: string}}
        - name: index
          in: query
          description: A list item's 1-based index; absent for a single output
          schema: {type: integer, format: int32, minimum: 0}
        - name: member
          in: query
          description: One file of a tree output, by its manifest path
          schema: {type: string}
        - name: Range
          in: header
          description: One range, `bytes=first-[last]`
          schema: {type: [string, 'null']}
        - name: If-Match
          in: header
          description: '`"<rev>"`: refuse once the output moved past it'
          schema: {type: [string, 'null']}
      responses:
        '200':
          description: All of it
          headers: {ETag: {schema: {type: string}, description: '`"<rev>"`'}}
          content:
            application/octet-stream:
              schema: {type: array, items: {type: integer, format: int32, minimum: 0}}
        '206':
          description: The range
          headers:
            Content-Range: {schema: {type: string}, description: '`bytes first-last/length`'}
            ETag: {schema: {type: string}, description: '`"<rev>"`'}
          content:
            application/octet-stream:
              schema: {type: array, items: {type: integer, format: int32, minimum: 0}}
        '404':
          description: No such run or output
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '412':
          description: '`output_revision_moved`'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
        '416':
          description: '`range_unsatisfiable`'
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
  /v1/runs/{id}/triage:
    get:
      summary: A failed attempt's retained triage bundle.
      operationId: triage
      parameters: [{name: id, in: path, description: The run id, required: true, schema: {type: string}}]
      responses:
        '200': {description: The bundle, content: {application/json: {schema: {type: object}}}}
        '404':
          description: None retained
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
  /v1/status:
    get:
      summary: >-
        The machine's picture. Without a machine-scope cap: identity, version, capabilities and the sealed
        readiness receipt only (what a Hub reads). With one: all of it, and with `Accept: text/event-stream`
        an SSE stream of `status` events, each the whole frame, sent again when it changes.
      operationId: status
      responses:
        '200':
          description: 'The frame, or SSE `event: status` frames'
          content:
            application/json: {schema: {$ref: '#/components/schemas/StatusFrame'}}
            text/event-stream: {schema: {$ref: '#/components/schemas/StatusFrame'}}
        '401':
          description: A credential this machine does not admit
          content: {application/json: {schema: {$ref: '#/components/schemas/Envelope'}}}
      security: [{}, {cozy_cap: []}]

components:
  schemas:
    Adapter:
      type: object
      properties:
        component: {type: string}
        lane: {type: string}
        manifest:
          type: string
          description: '`sha256:<hex>`, a commit of `model` by hash; else `model` at `release`, `lane`.'
        model: {type: string}
        profiles: {type: array, items: {type: string}}
        release: {type: string}
        scale: {type: string, description: Canonical decimal; empty means 1.}
        source:
          type: string
          description: >-
            A provider source (`civitai://<version>`, `hf://…`) made here and normalized at ingest, under
            these reviewed `profiles` (none: the one its headers select); never with `model`.
    Adjustment:
      type: object
      description: One request field served other than as sent.
      properties:
        applied: {type: string}
        field: {type: string, description: 'Its path in the request: `steps`, `assets.2.asset`.'}
        kind: {type: string, description: '`adjusted`, `clamp` or `warn`.'}
        reason: {type: string}
        requested: {type: string}
        source:
          type: string
          description: '`handler`, or what the Runtime applied: `policy`, `checkpoint:…`, `adapter:…`.'
    Booting:
      type: object
      description: A starting machine's step and a counter that advances as it moves.
      properties: {progress: {type: integer, format: int64, minimum: 0}, step: {type: string}}
    Call:
      type: object
      description: 'One settled call the run made: a child run, or an effect such as its weights publication.'
      properties:
        called_at_ms: {type: integer, format: int64}
        computation_digest:
          type: string
          description: A memoized call's computation (`sha256:<hex>`), ran or answered.
        finished_at_ms: {type: integer, format: int64}
        function: {type: string}
        index: {type: integer, format: int32, description: Its index among the run's calls., minimum: 0}
        label: {type: string, description: The author's label for it.}
        measurements:
          description: Its executor's, as `Outcome::measurements`.
          oneOf: [{$ref: '#/components/schemas/Json'}, {type: 'null'}]
        memoized: {type: boolean, description: Answered from a result this machine held; nothing ran.}
        reason:
          description: Why it did not succeed.
          oneOf: [{$ref: '#/components/schemas/Reason'}, {type: 'null'}]
        run: {type: string, description: The child run's id.}
        status: {type: string, description: 'succeeded, failed, canceled'}
        unmemoized:
          type: string
          description: Why a memoizable call was neither looked up nor held ("seed not given").
    Checkpoint:
      type: object
      properties:
        lane: {type: string, description: Its commit's lane label.}
        manifest: {type: string, description: '`sha256:<hex>` of its header.'}
        precision: {type: string, description: 'Its header''s precision family (`int8`, `bf16`, …).'}
        release: {type: string, description: Empty for a local alias or a commit by hash.}
    CheckpointRef:
      type: object
      description: 'A weights output''s commit: `revision` (`sha256:<tree>`) of `repo_id`, in `lane`.'
      properties: {lane: {type: string}, repo_id: {type: string}, revision: {type: string}}
    Disk:
      type: object
      properties:
        free_bytes: {type: integer, format: int64, minimum: 0}
        total_bytes: {type: integer, format: int64, minimum: 0}
    Envelope:
      type: object
      description: The HTTP body of a refusal.
      required: [error]
      properties: {error: {$ref: '#/components/schemas/Error'}}
    Environment:
      type: object
      properties:
        entrypoints: {type: array, items: {type: string}}
        hub:
          type: string
          description: The Hub origin a published installation came from; empty for local code.
        installation: {type: string, description: '`Source::Installation` names it.'}
        level:
          type: string
          description: What it holds now (as `WarmItem::holds`), in a warm set or not.
        package: {type: string}
        release: {type: string}
        runtime: {type: string, description: The cozy-runtime installed in it.}
        warning:
          type: string
          description: Why it does not run the machine's own Runtime; empty when it does.
    Error:
      type: object
      required: [kind, code, message]
      properties:
        cause:
          type: [string, 'null']
          description: >-
            The originating component's own stable code (a machine's or the Hub's), when not ours.
        code: {type: string}
        kind: {$ref: '#/components/schemas/Kind'}
        message: {type: string}
        next: {type: array, items: {type: string}, description: Commands to try next; at most two.}
        remedy: {type: [string, 'null']}
    Event:
      oneOf:
        - type: object
          required: [state]
          properties: {state: {$ref: '#/components/schemas/RunState'}}
        - type: object
          required: [progress]
          properties: {progress: {$ref: '#/components/schemas/Progress'}}
        - type: object
          required: [product]
          properties: {product: {$ref: '#/components/schemas/Product'}}
        - type: object
          required: [log]
          properties: {log: {$ref: '#/components/schemas/LogLine'}}
        - type: object
          required: [outcome]
          properties: {outcome: {$ref: '#/components/schemas/Outcome'}}
        - type: object
          required: [call]
          properties: {call: {$ref: '#/components/schemas/Call'}}
        - type: object
          required: [gpu]
          properties: {gpu: {$ref: '#/components/schemas/GpuAllocation'}}
    Gpu:
      type: object
      properties:
        driver: {type: string}
        family:
          type: string
          description: 'The tensor-core row by compute capability ("sm90"); empty: unread.'
        index: {type: integer, format: int32, minimum: 0}
        memory:
          description: TensorD's page accounting of its memory manager on it.
          oneOf: [{$ref: '#/components/schemas/GpuMemory'}, {type: 'null'}]
        memory_bytes: {type: integer, format: int64, minimum: 0}
        memory_class:
          type: string
          description: 'discrete, coherent (GH200, GB200), unified (GB10); empty: unread.'
        memory_limit_bytes:
          type: integer
          format: int64
          description: >-
            The most of `memory_bytes` this machine uses (`machine.gpu_memory_limit`); 0: all of it.
          minimum: 0
        name: {type: string}
        pci_bus_id: {type: string}
        uuid: {type: string}
    GpuAllocation:
      type: object
      description: >-
        A root run's GPU allocation changed: `grant` binds its lane, `wait` queues it behind `behind` (a run
        id), `release` ends its lane (`Context.release_gpus()` or its exit).
      properties:
        behind: {type: string}
        gpus:
          type: array
          items: {type: integer, format: int32, minimum: 0}
          description: The lane, as machine GPU indices.
        state: {type: string}
        width: {type: integer, format: int32, minimum: 0}
    GpuMemory:
      type: object
      description: A GPU's page accounting, as its memory manager holds it now.
      properties:
        allocated_bytes: {type: integer, format: int64, description: Allocated to live processes., minimum: 0}
        books_only_bytes:
          type: integer
          format: int64
          description: Bytes a process holds that no live manager created (a previous TensorD's).
          minimum: 0
        capacity_bytes:
          type: integer
          format: int64
          description: >-
            What it may allocate: the card or its limit, less its own context and the reserved pool.
          minimum: 0
        created_bytes: {type: integer, format: int64, minimum: 0}
        created_chunks: {type: integer, format: int64, minimum: 0}
        foreign_bytes:
          type: integer
          format: int64
          description: Bytes no cozy process holds (another app's), as its last reading measured them.
          minimum: 0
        free_bytes:
          type: integer
          format: int64
          description: '`capacity_bytes` less what it allocated.'
          minimum: 0
        page_cache_bytes:
          type: integer
          format: int64
          description: >-
            The GPU page cache: landed weights of exited processes, kept for the next of their layout.
          minimum: 0
        page_cache_chunks: {type: integer, format: int64, minimum: 0}
        pressure_some_10s:
          type: number
          format: float
          description: >-
            The share of wall time at least one allocation waited (`some` pressure), over 10 s and 60 s.
        pressure_some_60s: {type: number, format: float}
        processes: {type: array, items: {$ref: '#/components/schemas/ProcessMemory'}}
    HeldAnswer:
      type: object
      description: >-
        What the machine holds of each object asked, in the order asked; a stored object is held whole, and
        asking renews it, as a `HEAD` does.
      properties: {held: {type: array, items: {$ref: '#/components/schemas/HeldObject'}}}
    HeldBytes:
      type: object
      description: >-
        What an upload holds, as `GET /v1/objects/sha256:<hex>?length=N` streams it (`event: held`).
      properties:
        held:
          type: integer
          format: int64
          description: Bytes landed, synced or not; the last event says all N.
          minimum: 0
    HeldObject:
      type: object
      properties:
        digest: {type: string}
        ranges:
          type: array
          items: {type: array, items: {type: integer, format: int64, minimum: 0}}
          description: 'Byte ranges `[start, end)`; none: nothing held.'
    HeldRequest:
      type: object
      description: >-
        `POST /v1/objects/held`: which of these objects (`sha256:<hex>`) the machine holds for this signer.
      properties: {digests: {type: array, items: {type: string}}}
    Hub:
      type: object
      properties:
        machine_id: {type: string, description: This machine's worker id there.}
        origin: {type: string}
    HubAccess:
      type: object
      description: A Hub a run reads. Public content is read anonymously.
      properties:
        ca_der:
          type: string
          format: byte
          description: An origin's private CA (DER, base64), when it has one.
        capability:
          type: string
          description: >-
            The run capability its computer's device key signed for this machine's workload key (cl-675): what the
            signer's runs here read and write at this Hub. TensorD redeems it at the Hub (AuthKit's jwt-bearer grant)
            and again before each token expires while those runs live; no executor sees it. A capability bound to
            another key is refused 409 `workload_key_changed`.
        origin: {type: string}
    InputFile:
      type: object
      properties:
        digest: {type: string, description: '`sha256:<hex>`'}
        field: {type: string, description: 'The payload field path, list index included.'}
        length: {type: integer, format: int64, minimum: 0}
        media_type: {type: string}
        order: {type: integer, format: int32, minimum: 0}
    Json: {type: object}
    KernelVerdict:
      type: object
      description: >-
        One kernel's verification on this machine (the Runtime's `verify_op`), keyed by its artifact, the
        card's architecture and the driver.
      properties:
        artifact: {type: string}
        detail: {type: string, description: 'What was measured, or why it failed.'}
        driver: {type: string}
        kernel: {type: string}
        ok: {type: boolean}
        sm: {type: integer, format: int32, minimum: 0}
    Kind:
      type: string
      enum: [usage, validation, not_found, credential, forbidden, conflict, capacity, unavailable, internal]
    LocalSource:
      type: object
      description: >-
        Local code: `manifest` names a JSON object written with `PUT /v1/objects`: `{package: "local/<dist>",
        release, python_requires, python_version, callees: {distribution: package}}` and its code. A live
        project is installed editable from `files: [{name, digest, length, executable}]`: the project and the
        path dependencies its lock names, each file under their common directory, with `project` the project's
        directory there. The machine keeps one such tree and one environment per signer and package. `path`
        names that common directory on this computer's machine, which reads it in place. `wheels: [{name,
        digest, length}]` are locked dependencies the caller carries because the machine cannot fetch them.
        Members are objects the same signer wrote.
      properties: {manifest: {type: string, description: '`sha256:<hex>` of the manifest object.'}}
    LogLine:
      type: object
      properties: {level: {type: string}, text: {type: string}}
    LogLines:
      type: object
      description: 'Whole lines of a machine log, as `GET /v1/logs/{name}` streams them (`event: lines`).'
      properties:
        after:
          type: string
          description: >-
            The place after them, also the event's id: a follow resumed there goes on with the next line.
        text: {type: string}
    Model:
      type: object
      properties:
        checkpoints: {type: array, items: {$ref: '#/components/schemas/Checkpoint'}}
        repository: {type: string, description: org/name; org "local" is a local alias.}
        total_bytes:
          type: integer
          format: int64
          description: Everything this repository reaches.
          minimum: 0
        unique_bytes:
          type: integer
          format: int64
          description: Reached by no other held repository.
          minimum: 0
    ModelChoice:
      type: object
      description: >-
        One model slot's choice, by name (th-245: the machine resolves it at the Hub). A Hub model is
        `repository` at `release` (empty: the newest) in `lane`, else in the lane the Hub picks for the
        machine's hardware. `manifest` names a commit (or a header) by hash: one of the repository's at the
        Hub (with `repository`), or one this machine holds (without). A slot with no choice takes its declared
        default release, a callee's included (`<package>/<path>`).
      properties:
        adapters:
          type: array
          items: {$ref: '#/components/schemas/Adapter'}
          description: Each by name, a hash of the owner's, or a provider source.
        lane: {type: string}
        manifest: {type: string, description: '`sha256:<hex>`'}
        manifest_length: {type: integer, format: int64, minimum: 0}
        parameter: {type: string, description: A root slot parameter or full slot path.}
        profiles: {type: array, items: {type: string}}
        release: {type: string}
        repository: {type: string}
        source:
          type: string
          description: >-
            A provider source (`hf://<org>/<repo>@<rev>[/member]`, `civitai://<version>[/file]`) the machine
            makes the slot's model from, under these reviewed `profiles` (none: the one its headers select);
            never with repository or manifest. A model-only warm upload also accepts `input://<field>` naming
            its retained tree input: a plain CozyTensors folder, without selectors or conversion profiles.
            Missing folder payload must already be at the endpoint.
    Outcome:
      type: object
      properties:
        adjustments:
          type: array
          items: {$ref: '#/components/schemas/Adjustment'}
          description: >-
            How its executor served the request other than as sent, in the executor's order. Advisory.
        computation_digest:
          type: string
          description: A memoizable callable's computation (`sha256:<hex>`), whether it ran or was answered.
        execution_ms:
          type: integer
          format: int64
          description: 'Its own time running its callable, every attempt summed; 0: unknown.'
          minimum: 0
        measurements:
          description: >-
            What its executor measured, canonical JSON: `attribution` (stage and step tracks), `execution`
            (degree, ranks with the GPU and attention each served, executor boot, construction load and warm)
            and `observations` (attention rows). None for a run that ran on no device.
          oneOf: [{$ref: '#/components/schemas/Json'}, {type: 'null'}]
        memoized: {type: boolean, description: 'Answered from a result this machine held: nothing ran.'}
        outputs: {type: array, items: {$ref: '#/components/schemas/Product'}}
        reason: {oneOf: [{$ref: '#/components/schemas/Reason'}, {type: 'null'}]}
        result:
          description: The result, canonical JSON, assets as digests.
          oneOf: [{$ref: '#/components/schemas/Json'}, {type: 'null'}]
        status: {type: string, description: 'succeeded, failed, canceled'}
        triage: {type: boolean, description: '`GET /v1/runs/{id}/triage` answers its bundle.'}
        unmemoized:
          type: string
          description: >-
            Why it was neither looked up nor held (its author's condition unmet, e.g. "seed not given").
    ProcessMemory:
      type: object
      description: One process's allocated memory on a GPU.
      properties:
        bytes: {type: integer, format: int64, minimum: 0}
        chunks: {type: integer, format: int64, minimum: 0}
        executor: {type: string, description: Its executor group (plan and lane).}
        pid: {type: integer, format: int32, minimum: 0}
    Product:
      type: object
      description: >-
        One revision of an output: a single output is replaced by each, a list output grows. Byte outputs use
        `GET /v1/runs/{id}/outputs/{output}`; checkpoints are immutable references.
      properties:
        appended_from:
          type: [integer, 'null']
          format: int64
          description: These bytes extend the previous revision's, from here.
          minimum: 0
        checkpoint: {oneOf: [{$ref: '#/components/schemas/CheckpointRef'}, {type: 'null'}]}
        digest: {type: string, description: '`sha256:<hex>` of these bytes.'}
        duration_us:
          type: integer
          format: int64
          description: Media time, for a growing video.
          minimum: 0
        index:
          type: integer
          format: int32
          description: A list item's 1-based index; 0 for a single output.
          minimum: 0
        label: {type: string}
        length: {type: integer, format: int64, minimum: 0}
        media_type: {type: string}
        output: {type: string}
        rev: {type: integer, format: int64, minimum: 0}
    Progress:
      type: object
      properties:
        bytes_done: {type: integer, format: int64, minimum: 0}
        bytes_total: {type: integer, format: int64, minimum: 0}
        completed: {type: integer, format: int64, minimum: 0}
        fraction: {type: number, format: double, description: '-1: unknown.'}
        stage: {type: string}
        stage_fraction:
          type: [number, 'null']
          format: double
          description: How far this stage is, when it says.
        step_avg_ms:
          type: number
          format: double
          description: The mean of its steps after the first, which carries the stage's setup; 0 before one.
        step_ms: {type: number, format: double, description: 'The latest step''s time, while a stage steps.'}
        total: {type: integer, format: int64, minimum: 0}
    ProviderAccess:
      type: object
      description: The caller's provider tokens, for models a run makes from a provider source.
      properties: {civitai: {type: string}, huggingface: {type: string}}
    Reason:
      type: object
      properties:
        code: {type: string}
        detail:
          type: string
          description: >-
            A failed call's traceback, else its executor's stderr: the last lines, secrets masked. It explains
            the failure after its machine is gone.
        message: {type: string}
        origin: {type: string, description: 'request, runtime, author, machine'}
    Release:
      type: object
      description: >-
        A published release by name (th-245): a machine that holds no installation of it reads its card and
        locked requirements at the Hub by name.
      properties:
        package: {type: string, description: org/name}
        release: {type: string, description: 'Empty: the Hub''s newest.'}
    RunEvent:
      type: object
      description: >-
        One entry of a run's log, as `GET /v1/runs/{id}/events` sends it: SSE `event: <variant>`, `id:
        <sequence>` for durable entries.
      required: [event]
      properties:
        at_ms: {type: integer, format: int64}
        event: {$ref: '#/components/schemas/Event'}
        sequence:
          type: integer
          format: int64
          description: >-
            0: a frame that is not in the log (the snapshot, progress before acceptance, live state).
          minimum: 0
    RunKind: {type: string, enum: [call, warm, update, remove]}
    RunRequest:
      type: object
      description: >-
        `POST /v1/runs`: submits when `id` is new (idempotent on id per signer); the same id with another spec
        is `run_id_conflict`.
      properties:
        id: {type: string, description: 'The caller''s run id, 1-256 bytes.'}
        spec:
          $ref: '#/components/schemas/RunSpec'
          default:
            attention_kernel: ''
            catalog_revision: ''
            entrypoint: ''
            gpus: 0
            inputs: []
            kind: call
            lane: ''
            models: []
            owner: ''
            weights_destination: ''
    RunSpec:
      type: object
      properties:
        attention_kernel: {type: string}
        catalog_revision:
          type: string
          description: >-
            The catalog revision the caller made its choices under (th-245): a held resolution is reused only
            under the same one, so a publish, yank, bind or retarget the caller knows of resolves once more at
            the Hub.
        entrypoint: {type: string}
        gpus:
          type: integer
          format: int32
          description: >-
            0: widest group every model slot supports on this machine. Positive: at most this many GPUs, for
            the run and its children.
          minimum: 0
        hub:
          description: The Hub the run reads.
          oneOf: [{$ref: '#/components/schemas/HubAccess'}, {type: 'null'}]
        inputs:
          type: array
          items: {$ref: '#/components/schemas/InputFile'}
          description: Objects uploaded with `PUT /v1/objects`, bound to payload fields.
        kind: {$ref: '#/components/schemas/RunKind', default: call}
        lane:
          type: string
          description: >-
            The main model's lane, a label (`bf16`, `fp8`, …). Empty, and every other slot: the Hub picks for
            the machine's hardware. For a model-only warm run with a weights destination, the lane its commit
            is labelled. The package's own children inherit it; another package's take none.
        models: {type: array, items: {$ref: '#/components/schemas/ModelChoice'}}
        owner: {type: string, description: The account that org-relative references of local code name.}
        payload:
          description: The function's parameters, a JSON object.
          oneOf: [{$ref: '#/components/schemas/Json'}, {type: 'null'}]
        providers:
          description: Provider tokens for source models, kept in memory only.
          oneOf: [{$ref: '#/components/schemas/ProviderAccess'}, {type: 'null'}]
        set:
          description: >-
            `warm/2`: the caller's whole warm set, replacing its previous one; no items clears it. The run
            installs and downloads every member, and its result lists each one's `level` and `held_back`.
            Absent: the set is left as it is.
          oneOf: [{$ref: '#/components/schemas/WarmSet'}, {type: 'null'}]
        source: {oneOf: [{$ref: '#/components/schemas/Source'}, {type: 'null'}]}
        tensorfs:
          description: Ordinary TensorFS connection settings supplied by the caller, forwarded to Runtime.
          oneOf: [{$ref: '#/components/schemas/TensorFSOptions'}, {type: 'null'}]
        weights_destination:
          type: string
          description: >-
            org/name: the requester's repository for the call's weights outputs, or a warm run's source model.
    RunState:
      type: object
      properties:
        attempt: {type: integer, format: int32, minimum: 0}
        id: {type: string}
        number: {type: integer, format: int64, description: This machine's run number., minimum: 0}
        sequence: {type: integer, format: int64, description: The log's head., minimum: 0}
        started_at_ms:
          type: integer
          format: int64
          description: >-
            When it began executing (`running`), Unix ms: its time counts from here, never its queue's. 0
            before it does.
          minimum: 0
        state: {type: string, description: 'queued, preparing, running, succeeded, failed, canceled'}
        waiting: {type: string, description: 'Why a queued run waits, for people.'}
        waiting_for:
          type: array
          items: {type: string}
          description: The runs it waits for, by id (an update waits for those in flight).
    Source:
      oneOf:
        - type: object
          required: [release]
          properties: {release: {$ref: '#/components/schemas/Release'}}
        - type: object
          description: An installation this machine already holds for the signer.
          required: [installation]
          properties:
            installation:
              type: string
              description: An installation this machine already holds for the signer.
        - type: object
          required: [local]
          properties: {local: {$ref: '#/components/schemas/LocalSource'}}
      description: What a run runs.
    StatusFrame:
      type: object
      description: >-
        The machine's picture. Without a machine-scope cap, `GET /v1/status` answers identity, version,
        capabilities, the workload key and the sealed readiness `receipt` only. With one it answers all of it, and as SSE
        (`Accept: text/event-stream`) sends the whole frame again whenever it changes. An open stream is not
        activity.
      properties:
        boot_id: {type: string}
        booting:
          description: >-
            While the machine starts: the step it is on, answered before anything else, so a watcher tells a
            slow start from none. Absent once it serves.
          oneOf: [{$ref: '#/components/schemas/Booting'}, {type: 'null'}]
        capabilities: {type: array, items: {type: string}}
        commit: {type: string, description: The commit its `cozy` binary was built from.}
        dev:
          type: boolean
          description: >-
            Its binary arrived by a dev update (`cozy machine update --tensord <path>`), not a release.
        disk:
          description: The filesystem holding the machine's store.
          oneOf: [{$ref: '#/components/schemas/Disk'}, {type: 'null'}]
        driver_floor:
          type: string
          description: 'The oldest NVIDIA driver this machine''s kernels run on; empty: no GPU stack.'
        environments:
          type: array
          items: {$ref: '#/components/schemas/Environment'}
          description: The caller's held package installations.
        gpus: {type: array, items: {$ref: '#/components/schemas/Gpu'}, description: Measured at boot.}
        hubs: {type: array, items: {$ref: '#/components/schemas/Hub'}}
        idle_deadline_unix_ms:
          type: integer
          format: int64
          description: >-
            An idle rental's release, 15 min after its last job; 0: none (a job is queued or running, or it
            never releases).
        kernels:
          type: array
          items: {$ref: '#/components/schemas/KernelVerdict'}
          description: Each native kernel's verdict on this machine's cards, as the Runtime keeps it.
        models:
          type: array
          items: {$ref: '#/components/schemas/Model'}
          description: The models the machine's store holds.
        models_bytes:
          type: integer
          format: int64
          description: Their bytes together, shared content counted once.
          minimum: 0
        phase: {type: string, description: 'booting, ready, releasing'}
        platform: {type: string, description: os/arch}
        receipt:
          type: string
          format: byte
          description: The sealed readiness envelope (base64); empty until sealed.
        runs:
          type: array
          items: {$ref: '#/components/schemas/RunState'}
          description: The caller's live runs.
        runtime: {type: string, description: The executors' cozy-runtime.}
        started_at_unix_ms: {type: integer, format: int64}
        stuck:
          type: array
          items: {$ref: '#/components/schemas/StuckProcess'}
          description: >-
            Killed processes stuck in the kernel: nothing waits on them, and what each holds stays held until
            it exits.
        tensord_pid:
          type: integer
          format: int32
          description: The TensorD service's process (not its stable parent, a pod's PID 1).
          minimum: 0
        tensorfs: {type: string}
        toolchain:
          $ref: '#/components/schemas/Toolchain'
          description: What builds kernels here when no prebuilt one serves the card.
          default: {detail: '', host_compiler: '', install: '', missing: [], nvcc: '', state: ''}
        update:
          description: An update in progress here; none without one.
          oneOf: [{$ref: '#/components/schemas/RunState'}, {type: 'null'}]
        version: {type: string, description: This machine's release.}
        warm:
          type: array
          items: {$ref: '#/components/schemas/WarmItem'}
          description: The caller's warm set, each with what it holds now.
        webrtc:
          description: The direct player endpoint, when the machine listens.
          oneOf: [{$ref: '#/components/schemas/WebRtc'}, {type: 'null'}]
        workload_key:
          type: string
          description: >-
            The RFC 7638 thumbprint of this TensorD's workload key, made at its start and held in memory only: what
            its runs' capabilities bind (cl-675).
        worker_id: {type: string}
    StuckProcess:
      type: object
      description: >-
        A killed process in uninterruptible sleep (`D`: a driver after an Xid, a hung network filesystem): it
        exits once that wait ends.
      properties:
        command: {type: string}
        pid: {type: integer, format: int32, minimum: 0}
        since_unix_ms: {type: integer, format: int64, description: When the machine found it stuck.}
        wchan: {type: string, description: The kernel function it sleeps in; empty when the kernel hides it.}
    TensorFSOptions:
      type: object
      description: >-
        Public TensorFS transport options. TensorD forwards a supplied token without acquiring one: at the
        run's Hub, the run capability its computer minted, never an account's sign-in.
      properties:
        ca_der:
          type: string
          format: byte
          description: An endpoint's private CA, base64 DER on the wire.
        endpoint: {type: string}
        expires_unix_ms: {type: integer, format: int64, description: 'When `token` expires; 0: unknown.'}
        token: {type: string}
    Toolchain:
      type: object
      description: 'The machine''s build toolchain: CUDA''s compiler and a host C/C++ compiler.'
      properties:
        detail: {type: string, description: Why the last install failed.}
        host_compiler:
          type: string
          description: 'The host compiler''s first version line; empty: none found.'
        install:
          type: string
          description: >-
            The OS's own command for a missing host compiler; empty when none is missing or known.
        missing: {type: array, items: {type: string}, description: 'What it lacks: `nvcc`, `cc`, `ninja`.'}
        nvcc: {type: string, description: '`nvcc --version`''s release line; empty: none found.'}
        state: {type: string, description: 'ready, absent, installing, failed'}
    WarmItem:
      type: object
      description: >-
        One member of a caller's warm set: a function the machine keeps ready up to `level`. It is the last
        idle thing to give its memory to a request, and comes back when room returns.
      properties:
        entrypoint: {type: string}
        held_back: {type: string, description: 'Status only: why that is lower than `level`.'}
        holds:
          type: string
          description: 'Status only: the level it holds now (installed, downloaded, imported, host, gpu).'
        lane: {type: string, description: 'As `RunSpec::lane`.'}
        level: {$ref: '#/components/schemas/WarmLevel', default: 'off'}
        models:
          type: array
          items: {$ref: '#/components/schemas/ModelChoice'}
          description: 'None: the slots'' defaults, as for a run.'
        source: {oneOf: [{$ref: '#/components/schemas/WarmSource'}, {type: 'null'}]}
    WarmLevel:
      type: string
      description: How far a function is kept ready; each level includes the ones before it.
      enum: ['off', installed, downloaded, imported, host, gpu]
    WarmSet:
      type: object
      properties: {items: {type: array, items: {$ref: '#/components/schemas/WarmItem'}}}
    WarmSource:
      oneOf:
        - type: object
          required: [release]
          properties: {release: {$ref: '#/components/schemas/Release'}}
        - type: object
          required: [installation]
          properties: {installation: {type: string}}
      description: What a warm set's member keeps ready.
    WebRtc:
      type: object
      properties:
        addresses:
          type: array
          items: {type: string}
          description: 'host:port to dial: own interfaces, or the provider''s mapping.'
        fingerprint: {type: string, description: SHA-256 hex of the certificate its DTLS presents.}
        port:
          type: integer
          format: int32
          description: The listener; a persistent machine keeps it across restarts.
          minimum: 0
        unavailable_reason: {type: string, description: Why no address is reported (a malformed mapping).}
  securitySchemes:
    cozy_cap:
      type: apiKey
      in: header
      name: authorization
      description: >-
        `Cozy-Cap <token>`: machine scope does everything as its signer; run scope reads one run's events and
        its granted outputs.
