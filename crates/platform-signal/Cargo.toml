[package]
name = "platform-signal"
description = "Process-local OS signals and wait sets without installer dependencies"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }

[lints]
workspace = true
