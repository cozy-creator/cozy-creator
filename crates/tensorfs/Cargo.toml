[package]
name = "tensorfs"
version = "0.17.8"
edition = "2021"
license.workspace = true
publish.workspace = true

[[bin]]
name = "tfs"
path = "src/bin/tfs/main.rs"
required-features = ["store"]

[features]
# The store, fetch, convert and everything that opens one. Without it: the format and the
# read engine only.
default = ["store"]
store = ["dep:hmac", "dep:rustix", "dep:rustls", "dep:webpki-roots", "dep:tokio", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:tower-service", "dep:async-trait", "dep:http-body-util", "dep:bytes", "dep:futures", "dep:tracing-subscriber"]

[dependencies]
# SVDQ producer revision pins its factorization and random-sketch implementation.
faer = { version = "=0.24.4", path = "../../vendor/faer", default-features = false, features = ["std", "linalg"] }
# The SVDQ fit's one pool of the machine's cores; faer itself stays sequential per call.
rayon = "1.12.0"
# The fit's products: faer's own SIMD dispatch, the arithmetic of its 16-cubed nano-GEMM.
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"] }
rand = { version = "=0.9.5", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.9.0", default-features = false, features = ["std"] }
rand_distr = { version = "=0.5.1", default-features = false, features = ["std"] }
base64.workspace = true
platform.workspace = true
libloading.workspace = true
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
# Public tag names are PEP 440 versions, ordered as pip orders them (src/format/repo.rs).
pep440_rs = { version = "0.7.3", default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
rustix = { version = "1.1.4", default-features = false, features = ["std", "net", "event"], optional = true }
# The one HTTP client (src/fetch/net.rs). rustls is the one TLS stack, used only there.
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# Requests in flight are tasks, never a thread each: hyper's pooled HTTP/1.1 client over our
# connector (egress policy, TLS).
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client", "http1"], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1"], optional = true }
tower-service = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { version = "0.3.31", default-features = false, features = ["std", "executor"], optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# Endpoint credentials (src/fetch/token.rs): S3 SigV4.
hmac = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"], optional = true }

[lints]
workspace = true
