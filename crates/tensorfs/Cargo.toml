[package]
name = "tensorfs"
version = "0.22.0"
edition = "2021"
license.workspace = true
publish.workspace = true

[[bin]]
name = "tfs"
path = "src/bin/tfs/main.rs"
required-features = ["store"]

[features]
# The store, fetch, convert and everything that opens one. Without it: the format and the
# read engine only.
default = ["store"]
# GPU destinations through Varena: the wheel's. `cozy` opens no CUDA and links no native core.
cuda = ["dep:varena"]
# `Writer::quantize` and its SVDQ fit: faer and its tree. The wheel's; `cozy` never quantizes.
quantize = ["store", "dep:faer", "dep:rayon", "dep:pulp", "dep:rand", "dep:rand_chacha", "dep:rand_distr"]
store = ["dep:hmac", "dep:rustix", "dep:rustls", "dep:webpki-roots", "dep:tokio", "dep:reqwest", "dep:backon", "dep:async-trait", "dep:bytes", "dep:futures", "dep:tracing-subscriber"]

[dependencies]
# SVDQ producer revision pins its factorization and random-sketch implementation.
faer = { version = "=0.24.4", path = "../../vendor/faer", default-features = false, features = ["std", "linalg"], optional = true }
# The SVDQ fit's one pool of the machine's cores; faer itself stays sequential per call.
rayon = { version = "1.12.0", optional = true }
# The fit's products: faer's own SIMD dispatch, the arithmetic of its 16-cubed nano-GEMM.
pulp = { version = "0.22.3", default-features = false, features = ["std", "x86-v3"], optional = true }
rand = { version = "=0.9.5", default-features = false, features = ["std"], optional = true }
rand_chacha = { version = "=0.9.0", default-features = false, features = ["std"], optional = true }
rand_distr = { version = "=0.5.1", default-features = false, features = ["std"], optional = true }
base64.workspace = true
platform.workspace = true
varena = { workspace = true, optional = true }
libloading.workspace = true
# Public tag names are PEP 440 versions, ordered as pip orders them (src/format/repo.rs).
pep440_rs = { version = "0.7.3", default-features = false }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
thiserror.workspace = true
rustix = { workspace = true, features = ["net", "event"], optional = true }
# The one HTTP client (src/fetch/net.rs): reqwest, over rustls with the webpki roots.
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# Requests in flight are tasks, never a thread each.
tokio = { workspace = true, optional = true }
# Exponential backoff with jitter between attempts (src/fetch/ask.rs).
backon = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { version = "0.3.31", default-features = false, features = ["std", "executor"], optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# Endpoint credentials (src/fetch/token.rs): S3 SigV4.
hmac = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process"], optional = true }

[lints]
workspace = true
