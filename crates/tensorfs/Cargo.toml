[package]
name = "tensorfs"
version = "0.22.0"
edition = "2021"
license.workspace = true
publish.workspace = true

[[bin]]
name = "tfs"
path = "src/bin/tfs/main.rs"

[features]
# GPU destinations through Varena (the wheel's).
cuda = ["tensorfs-core/cuda"]
# `Writer::quantize` (the wheel's).
quantize = ["tensorfs-core/quantize"]

[dependencies]
tensorfs-core.workspace = true
base64.workspace = true
platform.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
sha2.workspace = true
rustix = { workspace = true, features = ["net", "event"] }
# The one HTTP client (src/fetch/net.rs): reqwest, over rustls with the webpki roots.
reqwest = { workspace = true }
rustls = { workspace = true }
webpki-roots = { workspace = true }
# Requests in flight are tasks, never a thread each.
tokio = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tracing.workspace = true
tracing-subscriber = { workspace = true }
# Endpoint credentials (src/fetch/token.rs): S3 SigV4's HMAC, from the TLS stack's own crypto.
aws-lc-rs = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true
