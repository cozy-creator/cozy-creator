# One Rust workspace for the `cozy` binary and its machine role (xs-043).
[workspace]
resolver = "3"
# Build the pinned bounded-SVD dependency as a dependency, not a workspace test target.
exclude = ["vendor/faer"]
# The Rust implementation and its complete Python binding/package each have one directory.
members = [
    "crates/api",
    "crates/calcifer",
    "crates/cli",
    "crates/cozy",
    "crates/executor-api",
    "crates/platform",
    "crates/project-vault",
    "crates/project-mount",
    "crates/tensord",
    "crates/tensorfs",
    "crates/tensorfs-py",
    "crates/varena",
    "crates/varena-client",
    "crates/varena-ledger",
    "release-gate/suites/varena/ledger",
]

[workspace.package]
version = "0.23.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/cozy-creator/cozy-creator"
homepage = "https://github.com/cozy-creator/cozy-creator"
publish = false

[workspace.dependencies]
api = { path = "crates/api" }
calcifer = { path = "crates/calcifer" }
cli = { path = "crates/cli" }
executor-api = { path = "crates/executor-api" }
# Only `signal` unless a member asks for `seams` or `fetch`: varena links nothing else.
platform = { path = "crates/platform", default-features = false }
project-vault = { path = "crates/project-vault" }
project-mount = { path = "crates/project-mount" }
tensord = { path = "crates/tensord" }
# Without `net` unless a member asks for it: api needs only the format.
tensorfs = { path = "crates/tensorfs", default-features = false }
varena = { path = "crates/varena" }
varena-ledger = { path = "crates/varena-ledger" }

anstream = "1.0.0"
anstyle = "1.0.14"
aws-lc-rs = "1.18"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64 = "0.23"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
comfy-table = "8.0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
ed25519-dalek = "2"
flate2 = "1.1"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.3"
hex = "0.4"
http = "1"
http-body-util = "0.1.5"
httpdate = "1"
hyper = { version = "1.11", default-features = false }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
# `url`'s IDNA back end, chosen by this exact version: ASCII hostnames only (non-ASCII is refused, `xn--` works).
# It keeps ICU4X out, 21 crates (cl-722). `=1.1.0` is full IDNA with unicode-rs, 16 fewer than ICU4X.
idna_adapter = "=1.0.0"
infer = { version = "0.22", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libc = "0.2"
libloading = "0.9"
# The cozy binary's allocator (cl-822): it gives back what any thread freed, on every OS. No transparent huge pages:
# a 2 MiB page that holds a few small allocations is 2 MiB resident.
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }
nvml-wrapper = "0.13"
nvml-wrapper-sys = "0.10"
percent-encoding = "2.3"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "query", "rustls", "stream"] }
# No prepared-statement cache: nothing calls `prepare_cached`.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
rustix = { version = "1.1.4", default-features = false, features = ["std"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
saphyr = { version = "0.2.2", default-features = false }
saphyr-parser = { version = "0.2.2", default-features = false }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"
serde_json = "1"
serde_json_canonicalizer = "0.4"
sha2 = "0.10"
sigstore-verify = { version = "0.15", default-features = false, features = ["aws-lc-rs"] }
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "0.8"
toml_edit = "0.22.27"
tower-service = "0.3.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
# The page's types from api (crates/api/examples/ts.rs); never in cozy.
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
unicode-width = "0.2.2"
url = { version = "2.5.8", features = ["serde"] }
webpki-roots = "1"
windows-sys = "0.61"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

# No LTO, 16 codegen units: half the build time of fat LTO, whose binary measured the same on startup and runs
# and 3-5% less CPU on a TensorFS download (cl-669).
[profile.release]
strip = true

# Memory safety (xs-067): crates without FFI forbid unsafe_code at their root; FFI crates deny it and
# allow it only in their boundary files. A crate whose every unsafe block
# carries its SAFETY note denies clippy::undocumented_unsafe_blocks at its root.
[workspace.lints.rust]
# `pub` means exported (cl-832). Warn here, not deny, only while varena's crates still carry
# unreachable `pub`s; every other crate root denies it.
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
# Every verb returns the one typed refusal; it is not on a hot path.
result_large_err = "allow"
undocumented_unsafe_blocks = "warn"

# What dist builds releases with.
[profile.dist]
inherits = "release"
