name: rc-e2e
# Every e2e suite on the open RC's head, after merges (Paul, 11-12: "merge it in and then do the tests on the RC branch
# itself"): an rc/* merge queue requires `build` alone. One run per RC at a time: pushes while one runs wait, and only the
# newest waiting one runs, so a busy RC is tested about hourly, each run its newest head. macOS and Windows run on every push
# too, in rc-os.yaml's own concurrency group (cl-1128). Nightly, master's rc-nightly.yaml dispatches both, and its
# rc-siblings.yaml dispatches this when cozy-runtime's or packages' RC moves.
# A red lists what merged since the last green run, here and in those two, each with its issue, to find the commit that
# caused it (tracker cl-885).
# `skew-candidate` is the RC's cozy against the production Hub's line (tensorhub master), as the suites' Hub is tensorhub's RC.
# On a push it runs the edge set and what changed since each shard last went green (cl-1128); a red edge shard ends the run. A
# release's run is the release gate's, every shard. By hand: gh workflow run rc-e2e.yaml -R cozy-creator/cozy-creator --ref rc/<x.y.z>
# [-f select='cli imports cpu model']: every shard of the suites named.
on:
  push:
    branches: ['rc/*']
  workflow_dispatch:
    inputs:
      select:
        description: The suites (ci/suites.toml tokens)
        type: string
        default: cli imports cpu model skew-candidate

concurrency:
  group: rc-e2e-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  # A red edge shard ends the run (e2e.yaml, cl-1128).
  actions: write

jobs:
  e2e:
    uses: ./.github/workflows/e2e.yaml
    secrets: inherit
    with:
      repo: cozy-creator
      ref: ${{ github.sha }}
      select: ${{ inputs.select || 'cli imports cpu model skew-candidate' }}
      # The edge set, and what changed since each shard last went green (cl-1128); a dispatch naming suites runs them whole.
      shards: ${{ inputs.select && '' || 'changed' }}

  # H3 over 2 and 4 GPUs on this RC's builds (cr-326, release-gate/sessions/h3-group.sh): every group follower failed its
  # prepare on rc/0.27.0 and nothing ran a group between releases. Paul, 11-17: "minimax h3 inference can use 1 GPU, 2, 4,
  # 7, or 8 GPUs. We should always support all of these with ulysses-style parallelism." It rents only when what a group
  # runs moved since its last green: the Runtime's RC, H3's package, or TensorD and TensorFS here (`key`).
  group-key:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      key: ${{ steps.key.outputs.key }}
      seen: ${{ steps.seen.outputs.cache-hit }}
      cozy: ${{ steps.cozy.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - id: key
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          rt=$(git ls-remote https://github.com/cozy-creator/cozy-runtime "refs/heads/$BRANCH" | cut -f1)
          git init -q "$RUNNER_TEMP/packages"
          git -C "$RUNNER_TEMP/packages" fetch -q --depth 1 --filter=blob:none https://github.com/cozy-creator/packages "$BRANCH"
          h3=$(git -C "$RUNNER_TEMP/packages" rev-parse FETCH_HEAD:minimax-h3)
          here=$(git rev-parse HEAD:crates/tensord HEAD:crates/varena HEAD:crates/tensorfs HEAD:crates/tensorfs-py | sha1sum | cut -c1-12)
          echo "runtime ${rt:-none}, minimax-h3 $h3, tensord+tensorfs $here" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "key=h3-group-$BRANCH-${rt:-none}-$h3-$here" >> "$GITHUB_OUTPUT"
      - id: seen
        uses: actions/cache/restore@v4
        with:
          path: group.key
          key: ${{ steps.key.outputs.key }}
          lookup-only: true
      # The session's cozy is this commit's RC build (rc-dev.yaml), or the branch's newest when a sibling's RC moved.
      - id: cozy
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          for _ in $(seq 60); do
            read -r id state <<< "$(gh run list -R "$GITHUB_REPOSITORY" -w rc-dev.yaml -b "$BRANCH" -c "$GITHUB_SHA" -L 1 --json databaseId,conclusion -q '.[0] // empty | "\(.databaseId) \(.conclusion)"')"
            [ -z "$id" ] || [ -n "$state" ] && break
            sleep 30
          done
          [ "${state:-}" = success ] || id=$(gh run list -R "$GITHUB_REPOSITORY" -w rc-dev.yaml -b "$BRANCH" -s success -L 1 --json databaseId -q '.[0].databaseId')
          [ -n "$id" ] || { echo "::error::no rc-dev build of $BRANCH"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"

  h3-group:
    needs: group-key
    if: needs.group-key.outputs.seen != 'true'
    strategy:
      fail-fast: false
      matrix:
        gpus: [2, 4]
    uses: ./.github/workflows/pod-session.yaml
    secrets: inherit
    with:
      hub: prod
      script: h3-group
      packages_refs: rc=${{ github.ref_name }}
      sku: rtx-3090
      disk: '150'
      cap: ${{ matrix.gpus == 2 && '1.5' || '2.5' }}
      cozy: ${{ needs.group-key.outputs.cozy }}
      params: '{"tree": "rc", "gpus": ${{ matrix.gpus }}}'
      rent: true

  group-green:
    needs: [group-key, h3-group]
    if: needs.h3-group.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: echo "${{ needs.group-key.outputs.key }}" > group.key
      - uses: actions/cache/save@v4
        with:
          path: group.key
          key: ${{ needs.group-key.outputs.key }}

  since:
    name: merged since green
    needs: e2e
    if: always() && needs.e2e.result != 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          read -r green green_run <<< "$(gh run list -R "$GITHUB_REPOSITORY" -w rc-e2e.yaml -b "$BRANCH" -s success -L 1 --json headSha,databaseId -q '.[0] // empty | "\(.headSha) \(.databaseId)"')"
          range=${green:+$green..}$GITHUB_SHA
          [ -n "$green" ] || range="-30 $GITHUB_SHA"
          { echo "### $BRANCH ${GITHUB_SHA:0:9} is red: merged since the last green run (${green:0:9})"
            echo; git log --first-parent --format='- %h %s' $range; } | tee -a "$GITHUB_STEP_SUMMARY"
          # The siblings' RC merges between the green run's pins and this run's (each run's `e2e / affected` job).
          pins() {
            local job
            job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$1/jobs?per_page=100" -q '.jobs[] | select(.name == "e2e / affected") | .id')
            [ -z "$job" ] || gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" | sed -nE 's/.*Z (runtime|packages)=([0-9a-f]{40})\r?$/\1=\2/p'
          }
          now=$(pins "$GITHUB_RUN_ID") was=
          [ -z "${green_run:-}" ] || was=$(pins "$green_run")
          for sibling in runtime packages; do
            repo=$([ $sibling = runtime ] && echo cozy-runtime || echo packages)
            to=$(sed -n "s/^$sibling=//p" <<< "$now" | tail -1) from=$(sed -n "s/^$sibling=//p" <<< "$was" | tail -1)
            [ -n "$to" ] && [ "$to" != "$from" ] || continue
            git init -q "$RUNNER_TEMP/$repo" && git -C "$RUNNER_TEMP/$repo" fetch -q --filter=blob:none "https://github.com/cozy-creator/$repo" "$BRANCH"
            span=${from:+$from..}$to
            [ -n "$from" ] || span="-30 $to"
            { echo; echo "#### cozy-creator/$repo $BRANCH ${from:0:9}..${to:0:9}"
              echo; git -C "$RUNNER_TEMP/$repo" log --first-parent --format='- %h %s' $span; } | tee -a "$GITHUB_STEP_SUMMARY"
          done
