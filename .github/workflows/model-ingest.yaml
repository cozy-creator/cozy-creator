name: model-ingest
# A first-party model onto tensorhub.com's root, driven from a runner so no laptop has to stay up for it (xs-104).
# One fresh rental:
#   1. uploads each source as its bf16 commit;
#   2. writes each lane from that commit by the recipe the package (at packages_ref) declares;
#   3. calls the package's function once per model on its first lane's commit (the gate);
#   4. publishes the release (bf16 + every lane), then calls each model once more through it.
# A failed first lane stops it; any other failure stops before publishing, and the commits stay private.
# The runner signs in as the owner (environment release-gate, COZY_CI_DEVICE_KEY, an admin: root writes) and its
# Calcifer renews the pod's credential for the whole job. A guard ends the pod at `cap` USD, all in.
#   gh workflow run model-ingest.yaml -R cozy-creator/cozy-creator -f package=qwen3.6 -f packages_ref=<sha> \
#     -f sources='qwen3.6-35b-a3b=hf://Qwen/Qwen3.6-35B-A3B@<rev> qwen3.6-27b=hf://Qwen/Qwen3.6-27B@<rev>' \
#     -f lanes=int8,w4a8,nvfp4 -f version=0.1.0 -f sku=a40 -f disk=500 -f cap=6 -f cozy=<dev-build run id>
on:
  workflow_dispatch:
    inputs:
      package:
        description: "The packages directory whose recipes write the lanes and whose function the calls run"
        type: string
        required: true
      packages_ref:
        description: "A cozy-creator/packages commit"
        type: string
        required: true
      sources:
        description: "Space-separated name=source pairs; each source becomes the root model name's bf16 commit"
        type: string
        required: true
      lanes:
        description: "Comma-separated lanes the package's recipes write; the first one gates the release"
        type: string
        required: true
      version:
        description: "The release: higher than every earlier one"
        type: string
        required: true
      sku:
        type: string
        required: true
      disk:
        description: "Disk GB: every source, its HF download and its lanes"
        type: string
        required: true
      cap:
        description: "USD, GPU + disk + traffic: the guard ends the pod at it"
        type: string
        required: true
      traffic_gb:
        description: "GB the provider bills: the image, the sources and the uploads"
        type: string
        default: '430'
      function:
        type: string
        default: ask
      slot:
        description: "The function's model slot"
        type: string
        default: model
      request:
        description: "The calls' payload (JSON); a seed key gets a fresh seed per call"
        type: string
        default: '{"prompt": "First, what is 17 + 25? Give just the number. Then describe this picture in two sentences.", "max_tokens": 160, "temperature": 0.7, "top_p": 0.8, "presence_penalty": 1.5, "seed": 0}'
      expect:
        description: "Text every gate answer contains (empty: none)"
        type: string
        default: '42'
      asset:
        description: "The field that takes release-gate/ref/seed.jpg (empty: none)"
        type: string
        default: images
      cozy:
        description: "cozy on the runner: released, a release tag or a dev-build run id"
        type: string
        default: released
      rent:
        description: "Rent and ingest; without it, the $0 pre-flight only (install, sign-in, quote, guard, parsers)"
        type: boolean
        default: false
run-name: model-ingest ${{ inputs.package }} ${{ inputs.version }} ${{ inputs.sku }}

jobs:
  ingest:
    runs-on: ubuntu-24.04
    environment: release-gate
    permissions:
      contents: read
      actions: read  # a dev-build cozy
    concurrency:
      group: model-ingest
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/ingest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: release-gate/ref
          path: creator
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/packages
          ref: ${{ inputs.packages_ref }}
          path: packages
      - name: Install cozy
        env:
          COZY: ${{ inputs.cozy }}
        run: |
          bin=$HOME/.cozy/bin; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
          if [ "$COZY" = released ]; then
            curl -LsSf https://tensorhub.com/install.sh | sh
          elif [[ $COZY == v* ]]; then
            curl -LsSf "https://github.com/cozy-creator/cozy-creator/releases/download/$COZY/cozy-installer.sh" | sh
          else
            gh run download "$COZY" -R cozy-creator/cozy-creator -p 'cozy-*' -D dev
            install -m 0755 dev/cozy-*/cozy-linux-x86_64 "$bin/cozy"
          fi
          "$bin/cozy" --version
      - name: Sign in
        env:
          KEY: ${{ secrets.COZY_CI_DEVICE_KEY }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the release-gate environment has no COZY_CI_DEVICE_KEY"; exit 1; }
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus" >> "$GITHUB_ENV"
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          umask 077; printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          cozy login --key "$RUNNER_TEMP/key.json"; code=$?
          rm -f "$RUNNER_TEMP/key.json"
          exit $code
      - name: Ingest
        working-directory: packages
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCES: ${{ inputs.sources }}
          LANES: ${{ inputs.lanes }}
          VERSION: ${{ inputs.version }}
          SKU: ${{ inputs.sku }}
          DISK: ${{ inputs.disk }}
          CAP: ${{ inputs.cap }}
          TRAFFIC_GB: ${{ inputs.traffic_gb }}
          FUNCTION: ${{ inputs.function }}
          SLOT: ${{ inputs.slot }}
          REQUEST: ${{ inputs.request }}
          EXPECT: ${{ inputs.expect }}
          ASSET: ${{ inputs.asset }}
          RENT: ${{ inputs.rent }}
        run: |
          set -uo pipefail
          D=$OUT; mkdir -p "$D"; R=$D/results.txt; IMG=$GITHUB_WORKSPACE/creator/release-gate/ref/seed.jpg
          say() { echo "$(date -u +%T) $*" | tee -a "$R"; }
          RC=0 RID='' NAME='' WD=''
          fail() { say "FAIL: $*"; RC=1; exit 1; }
          state() { cozy machine show "$1" --json 2>/dev/null | jq -r '.state // empty'; }
          # live <rental id>: listed and not ended; a list that does not answer counts as live.
          live() {
            local j; j=$(cozy machine list --json 2>/dev/null) || return 0
            jq -e --arg r "$1" '.machines[] | select(.rental_id==$r and .state!="ended")' <<<"$j" >/dev/null
          }
          gone() { local s; s=$(state "$1"); { [ "$s" = ended ] || [ -z "$s" ]; } && ! live "$1"; }
          made() { awk '$1=="commit"{c=$2} END{sub(/.*@/, "", c); print c}' "$D/$1.txt"; }
          lane_of() { cozy model info "$1" --json 2>/dev/null | jq -r --arg c "$2" '.commits[]? | select(.commit==$c) | .lane'; }
          runno() { awk '$1=="run" && NF==2{print $2}' "$D/$1.txt" | tail -1; }
          finish() {
            [ -n "$WD" ] && { pkill -P "$WD"; kill "$WD"; } 2>/dev/null
            if [ -n "$RID" ]; then
              local tries=0
              until gone "$RID"; do
                if [ $((tries % 12)) = 0 ]; then
                  cozy machine end "$RID" -y >> "$D/end.txt" 2>&1 || cozy machine end "$RID" -y --force >> "$D/end.txt" 2>&1
                  say "END requested $RID"
                fi
                tries=$((tries + 1)); sleep 10
              done
              say "GONE $RID ($NAME): ended, and no live machine in cozy machine list holds it"
            fi
            say "RESULT $([ "$RC" = 0 ] && echo PASSED || echo FAILED)"
            exit "$RC"
          }
          trap finish EXIT
          trap 'RC=1; exit 1' INT TERM HUP
          # step <name> <cozy args…>: one call followed to its end; output that stops growing for 15 min cancels it.
          step() {
            local n=$1; shift; say "step $n: cozy $*"
            cozy "$@" > "$D/$n.txt" 2>&1 & local p=$! last=-1 still=0 size
            while kill -0 "$p" 2>/dev/null; do
              sleep 30; size=$(stat -c %s "$D/$n.txt")
              if [ "$size" = "$last" ]; then still=$((still + 30)); else still=0; last=$size; fi
              [ "$still" -lt 900 ] || { kill "$p"; say "$n: no output for 15 min"; return 124; }
            done
            wait "$p"; local c=$?
            tail -6 "$D/$n.txt" | cut -c1-300 | sed 's/^/    /' >> "$R"
            return $c
          }
          # call <name> <model ref>: the package's function once, with a fresh seed; passes on a completed run whose
          # answers (texts) each contain EXPECT.
          call() {
            local n=$1 ref=$2 N asset=()
            [ -z "$ASSET" ] || asset=(--asset "$ASSET=$IMG")
            jq --argjson s "$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" 'if has("seed") then .seed = $s else . end' \
              <<<"$REQUEST" > "$D/$n.json" || return 1
            step "$n" run "./$PACKAGE/$FUNCTION" "model.$SLOT=$ref" --input "$D/$n.json" "${asset[@]}" --on "$NAME" || return 1
            N=$(runno "$n"); [ -n "$N" ] || return 1
            cozy run show "$N" --json > "$D/$n-run.json" 2>/dev/null
            say "$n run $N $(jq -r .status "$D/$n-run.json"): $(grep -E 'resolving|served' "$D/$n.txt" | tr -s ' ' | paste -sd';')"
            say "$n result: $(jq -c .result "$D/$n-run.json" | cut -c1-800)"
            jq -e --arg e "$EXPECT" '.status=="completed" and .result != null
              and ((.result.texts // [$e]) | all(ascii_downcase | contains($e | ascii_downcase)))' "$D/$n-run.json" >/dev/null
          }

          # The quote and the guard: GPU + disk an hour from the offer, the provider's traffic at its rate.
          say "cozy $(cozy --version); $(cozy whoami 2>&1 | grep -E '^account')"
          [ -d "$PACKAGE" ] || fail "packages has no $PACKAGE at $(git rev-parse --short HEAD)"
          read -ra pairs <<<"$SOURCES"; IFS=, read -ra lanes <<<"$LANES"
          [ "${#pairs[@]}" -gt 0 ] && [ "${#lanes[@]}" -gt 0 ] || fail "no sources or lanes"
          for p in "${pairs[@]}"; do
            cozy model info "${p%%=*}" > "$D/before-${p%%=*}.txt" 2>&1
            grep -q model.not_found "$D/before-${p%%=*}.txt" || say "${p%%=*} exists on prod: $(head -2 "$D/before-${p%%=*}.txt" | paste -sd' ')"
          done
          cozy machine rent --json > "$D/skus.json" 2>&1 || fail "no catalog"
          read -r storage bw < <(jq -r --arg s "$SKU" 'if type=="array" then .[] else . end | select(.name==$s) | .widths[] | select(.accelerator_count==1) |
            [(.storage_usd_micros_per_hour / .container_disk_gb), (.bandwidth_usd_micros_per_gb // 0)] | @tsv' "$D/skus.json")
          [ -n "${bw:-}" ] || fail "the catalog offers no single $SKU"
          cozy machine rent "$SKU" --disk-gb "$DISK" --json < /dev/null > "$D/quote.json" 2>&1
          grep -q quote_unagreed "$D/quote.json" || fail "a quote without --yes did not refuse: $(tail -c 300 "$D/quote.json")"
          gpu=$(jq -r 'select(.quote) | .quote.usd_micros_per_hour' "$D/quote.json" 2>/dev/null | head -1)
          [ -n "$gpu" ] || fail "no quote: $(tail -c 300 "$D/quote.json")"
          disk=$(awk -v s="$storage" -v d="$DISK" 'BEGIN{printf "%d", s*d}')
          cap_s=$(awk -v c="$CAP" -v g="$gpu" -v d="$disk" -v w="$bw" -v gb="$TRAFFIC_GB" 'BEGIN{printf "%d", (c*1e6 - w*gb) / (g + d) * 3600}')
          [ "$cap_s" -ge 7200 ] || fail "\$$CAP leaves only ${cap_s}s at GPU $gpu + disk $disk micro-USD/h and $bw/GB x $TRAFFIC_GB GB"
          say "quote $SKU, $DISK GB: GPU $gpu + disk $disk micro-USD/h, traffic $bw/GB x $TRAFFIC_GB GB; guard ends it ${cap_s}s after the order (\$$CAP)"
          printf 'commit   _/x@sha256:%064d\nrun 5 · x\nrun      17999\n' 7 > "$D/probe.txt"
          [ "$(made probe)" = "sha256:$(printf '%064d' 7)" ] && [ "$(runno probe)" = 17999 ] || fail "parsers"
          ! live pr-model-ingest-probe || fail "gone-check: a rental that never existed reads live"
          [ "$RENT" = true ] || { say "pre-flight only: nothing rented"; exit 0; }

          # The rental: the one this order made, by its own rental id.
          o=$(date +%s%3N)
          cozy machine rent "$SKU" --disk-gb "$DISK" -y > "$D/rent.out" 2> "$D/rent.err" & RP=$!
          first='' RRC=''
          while [ -z "$first" ]; do
            first=$(grep -m1 -oE '^[a-z0-9][a-z0-9-]*: (booting|ready|offline)' "$D/rent.err" | cut -d: -f1)
            [ -n "$first" ] || kill -0 "$RP" 2>/dev/null || break
            sleep 2
          done
          [ -n "$first" ] || { wait "$RP"; RRC=$?; [ "$RRC" = 0 ] && first=$(awk '$1=="machine"{print $2; exit}' "$D/rent.out"); }
          [ -n "$first" ] || fail "the rent named no machine: $(tail -3 "$D/rent.err")"
          cozy machine show "$first" --json > "$D/show-boot.json" 2>&1
          RID=$(jq -r '.rental_id // empty' "$D/show-boot.json")
          jq -e --arg s "$SKU" --argjson o "$o" '.rental.sku==$s and .rental.rented_at_ms>=$o-60000' "$D/show-boot.json" >/dev/null ||
            { RID=''; fail "$first is not this order's machine: $(head -c 300 "$D/show-boot.json")"; }
          echo "$RID" > "$D/rental"
          say "rental $RID ($first)"
          ( sleep "$cap_s"; echo "$(date -u +%T) GUARD: \$$CAP reached, ending $RID" >> "$R"; cozy machine end "$RID" -y --force >> "$D/end.txt" 2>&1 ) & WD=$!
          [ -n "$RRC" ] || { wait "$RP"; RRC=$?; }
          [ "$RRC" = 0 ] || fail "boot failed: $(tail -3 "$D/rent.err")"
          [ "$(state "$RID")" = ready ] || fail "$RID is $(state "$RID"), not ready"
          cozy machine show "$RID" --json > "$D/show.json" 2>&1; cozy machine show "$RID" > "$D/show.txt" 2>&1
          NAME=$(jq -r .name "$D/show.json")
          [ "$(jq -r .rental_id "$D/show.json")" = "$RID" ] && [ -n "$NAME" ] || fail "show $RID: $(head -c 300 "$D/show.json")"
          say "READY $RID as $NAME, image $(jq -r .rental.base_worker_image_digest "$D/show.json")"
          grep -E '^(version|runtime|tensorfs|GPU 0|disk free) ' "$D/show.txt" | tee -a "$R"

          # 1. Each source as its bf16 commit.
          declare -A BF16 LANE
          for p in "${pairs[@]}"; do
            m=${p%%=*}
            step "upload-$m" model upload "${p#*=}" "$m" --lane bf16 --on "$NAME" || fail "upload $m"
            c=$(made "upload-$m"); [ "$(lane_of "$m" "$c")" = bf16 ] || fail "upload $m: no bf16 commit ($c)"
            BF16[$m]=$c; say "$m bf16 $c"
          done
          # 2. The lanes, by the package's recipes, from the bf16 commits.
          failed=()
          for lane in "${lanes[@]}"; do
            for p in "${pairs[@]}"; do
              m=${p%%=*}
              if step "$lane-$m" model quantize "$m@${BF16[$m]}" --lane "$lane" --package "./$PACKAGE" --on "$NAME" &&
                 c=$(made "$lane-$m") && [ "$(lane_of "$m" "$c")" = "$lane" ]; then
                LANE[$m/$lane]=$c; say "$m $lane $c"
              else
                failed+=("$m/$lane"); say "LANE FAILED: $m $lane"
                [ "$lane" != "${lanes[0]}" ] || fail "$m's gating lane $lane was not written"
              fi
            done
          done
          # 3. The gate: each model answers on its first lane's commit.
          for p in "${pairs[@]}"; do m=${p%%=*}; call "gate-$m" "$m@${LANE[$m/${lanes[0]}]}" || fail "$m did not pass on ${lanes[0]}"; done
          [ "${#failed[@]}" = 0 ] || fail "not published: ${failed[*]} failed; every other commit is private on prod"
          # 4. The release, then each model through it as this card resolves it.
          for p in "${pairs[@]}"; do
            m=${p%%=*}; commits=("${BF16[$m]}")
            for lane in "${lanes[@]}"; do commits+=("${LANE[$m/$lane]}"); done
            cozy model publish "$m" "$VERSION" "${commits[@]}" > "$D/publish-$m.txt" 2>&1 || fail "publish $m: $(tail -3 "$D/publish-$m.txt")"
            sed 's/^/    /' "$D/publish-$m.txt" >> "$R"
            cozy model info "$m" > "$D/info-$m.txt" 2>&1
            say "PUBLISHED $m $VERSION"
          done
          for p in "${pairs[@]}"; do m=${p%%=*}; call "release-$m" "$m@$VERSION" || fail "$m@$VERSION did not pass through its release"; done
          say "PASS: ${pairs[*]%%=*} released $VERSION (bf16 ${lanes[*]})"
      # The step's trap ends its rental; a cancelled job can skip it, so end it here too and say so.
      - if: always()
        run: |
          rid=$(cat "$OUT/rental" 2>/dev/null) || exit 0
          for _ in $(seq 1 30); do
            cozy machine list --json 2>/dev/null | jq -e --arg r "$rid" '.machines[] | select(.rental_id==$r and .state!="ended")' >/dev/null ||
              { echo "$rid is gone"; exit 0; }
            cozy machine end "$rid" -y || true; sleep 10
          done
          echo "::error::$rid is still listed: end it by hand (cozy machine end $rid)"; exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ingest-${{ inputs.package }}-${{ inputs.version }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore
          retention-days: 30
