name: build
# The PR check (tracker/design/ci-v2.md §1): the workspace compiles, clippy's deny lints pass (warnings are not
# gates yet: master has 61 in tensorfs), and the routes hold to their API documents: every route `api::hub` calls is
# in the Hub contract selected by ci/hub-ref, and TensorD's router, its client and crates/tensord/api/openapi.yaml name the same
# routes, and every route web/app calls is one Calcifer serves; web/app/src/api/calcifer.ts is api's types as ts-rs writes them
# (scripts/web-types.sh). It also builds the page, so the checks compile it in.
# Required for merges into master and rc/*: it runs on the merge queue's group (merge_group), on the final
# PR + branch state; on a pull request it is skipped, which lets the PR be queued. A docs-only entry (its diff from
# the entry ahead) passes without building; ALLGREEN keeps it from vouching for the entries ahead (e2e.yaml).
# The memory-safety step (scripts/memory-safety.sh) runs on every build: an advisory published against an unchanged
# Cargo.lock fails the next one.
# The Python type check (scripts/typecheck.sh: mypy --strict per import root) and executor.pyi's freshness.
# A queue entry that deletes what a tracker issue or changelog.d entry added names it under `## Removed` (xs-199).
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.merge_group.head_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Hang bound, not a work budget.
    timeout-minutes: 60
    steps:
      - id: scope
        name: Docs-only changes skip the build
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          files=$([ -z "$BASE" ] || gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --paginate --jq '.files[].filename') || files=
          # A picture under web/app is in the page.
          if [ -n "$files" ] && ! grep -qvE '\.(md|txt|png|jpe?g|svg)$|^docs/|(^|/)LICENSE$' <<< "$files" && ! grep -q '^web/app/' <<< "$files"; then
            echo "docs only"; echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - if: steps.scope.outputs.run == 'true' && github.event_name == 'merge_group'
        name: The PR names the requested features it removes
        # Report-only until 0.26.0 is promoted (release lead, 11-15); then blocking (tracker xs-199).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          gh pr view "$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")" -R "$GITHUB_REPOSITORY" --json title,headRefName,body > "$RUNNER_TEMP/pr.json"
          python3 scripts/removed-features.py "$BASE" "$GITHUB_SHA" --pr "$RUNNER_TEMP/pr.json"
      # Select the immutable Hub contract paired with this source cohort. The release owner
      # coordinates publication, worker images and the production protocol cutover separately.
      - if: steps.scope.outputs.run == 'true'
        id: hub_contract
        name: Select the source cohort's Hub contract
        run: echo "ref=$(cat ci/hub-ref)" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/tensorhub
          ref: ${{ steps.hub_contract.outputs.ref }}
          ssh-key: ${{ secrets.TENSORHUB_READ_KEY }}
          persist-credentials: false
          sparse-checkout: api/openapi.yaml
          sparse-checkout-cone-mode: false
          path: .tensorhub
      - if: steps.scope.outputs.run == 'true'
        name: Record the resolved Hub contract
        env:
          HUB_REF: ${{ steps.hub_contract.outputs.ref }}
        run: |
          sha=$(git -C .tensorhub rev-parse HEAD)
          printf 'Hub contract: %s @ %s\n' "$HUB_REF" "$sha"
          printf '### Hub API contract\n\n`%s` at `%s`\n' "$HUB_REF" "$sha" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.scope.outputs.run == 'true'
        run: scripts/hub-routes.sh .tensorhub/api/openapi.yaml
      - if: steps.scope.outputs.run == 'true'
        run: scripts/machine-routes.sh
      - if: steps.scope.outputs.run == 'true'
        run: scripts/web-routes.sh
      # The type check (mypy --strict, scripts/typecheck.sh): new errors fail, .mypy-baseline.txt holds the known ones.
      # executor.pyi is generated from executor-api's structs: `pyi.py --check` fails when it is stale.
      - if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - if: steps.scope.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: |
            .venv-typecheck
            .mypy_cache
          key: typecheck-${{ runner.os }}-${{ hashFiles('scripts/typecheck-requirements.txt') }}-${{ github.sha }}
          restore-keys: typecheck-${{ runner.os }}-${{ hashFiles('scripts/typecheck-requirements.txt') }}-
      - if: steps.scope.outputs.run == 'true'
        run: python3 crates/executor-api/scripts/pyi.py --check && scripts/typecheck.sh
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/setup@v1
        with:
          package-json-file: web/app/package.json
          install: false
      - if: steps.scope.outputs.run == 'true'
        run: web/build.sh
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - if: steps.scope.outputs.run == 'true'
        run: scripts/web-types.sh
      - if: steps.scope.outputs.run == 'true'
        run: scripts/memory-safety.sh
      # The release and signing workflows run each action by its commit, never a tag that can move (xs-196).
      - if: steps.scope.outputs.run == 'true'
        run: |
          cd .github/workflows
          ! grep -nE '^\s*(- )?uses: *[^. ]' cozy-publish.yaml cozy-attestations.yaml cozy-promote.yaml tensorfs-publish.yaml rc-dev.yaml dev-build.yaml \
            | grep -vE '@[0-9a-f]{40} # '
      - if: steps.scope.outputs.run == 'true'
        run: cargo check --workspace --all-targets --locked
      - if: steps.scope.outputs.run == 'true'
        run: cargo clippy --workspace --all-targets --locked
