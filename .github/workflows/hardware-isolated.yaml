name: isolated hardware
on:
  workflow_dispatch:
    inputs:
      cozy:
        description: Exact published Cozy release tag (public immutable build input)
        type: string
        required: true
      runtime:
        description: Exact Runtime version
        type: string
        required: true
      tensorfs:
        description: Exact TensorFS version
        type: string
        required: true
      hub_ref:
        description: TensorHub source commit
        type: string
        required: true
      device:
        description: Reserved idle NVIDIA GPU UUID on the self-hosted runner
        type: string
        required: true
      mode:
        description: Provider lifecycle requires separately configured sandbox infrastructure
        type: choice
        options: [local-gpu, provider-sandbox]
        default: local-gpu
permissions:
  contents: read
concurrency:
  group: isolated-hardware-${{ inputs.device }}
  cancel-in-progress: false
jobs:
  hardware:
    runs-on: [self-hosted, Linux, X64, cozy-isolated-gpu]
    timeout-minutes: 60
    steps:
      - name: Require configured hardware mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          [ "$MODE" = local-gpu ] || { echo '::error::provider lifecycle unqualified: no provider sandbox account, budget or reachable test allocation is configured'; exit 2; }
      - uses: actions/checkout@v5
        with:
          path: creator
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/tensorhub
          ref: ${{ inputs.hub_ref }}
          ssh-key: ${{ secrets.TENSORHUB_READ_KEY }}
          persist-credentials: false
          path: tensorhub
      - uses: actions/setup-go@v5
        with:
          go-version-file: tensorhub/go.mod
          cache-dependency-path: tensorhub/go.sum
      - uses: astral-sh/setup-uv@v7
      - name: Prepare public build inputs in owned directories
        env:
          COZY: ${{ inputs.cozy }}
        run: |
          set -euo pipefail
          [[ "$COZY" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]] || { echo '::error::cozy must be an exact release tag'; exit 2; }
          mkdir -p "$RUNNER_TEMP/hardware-inputs"
          curl -LsSf --retry 3 "https://github.com/cozy-creator/cozy-creator/releases/download/$COZY/cozy-x86_64-unknown-linux-gnu.tar.gz" -o "$RUNNER_TEMP/hardware-inputs/cozy.tar.gz"
          tar -xzf "$RUNNER_TEMP/hardware-inputs/cozy.tar.gz" -C "$RUNNER_TEMP/hardware-inputs"
          uv venv --python 3.12 "$RUNNER_TEMP/hardware-tools"
          uv pip install --python "$RUNNER_TEMP/hardware-tools/bin/python" awscli
      - name: Isolated publication, CPU and physical CUDA execution
        env:
          DEVICE: ${{ inputs.device }}
          RUNTIME: ${{ inputs.runtime }}
          TENSORFS: ${{ inputs.tensorfs }}
        run: |
          set -euo pipefail
          binary=$(find "$RUNNER_TEMP/hardware-inputs" -type f -name cozy -print -quit)
          test -n "$binary"
          PATH="$RUNNER_TEMP/hardware-tools/bin:$PATH" python3 creator/e2e/hardware/run.py \
            --hub-src tensorhub --cozy-bin "$binary" --runtime "$RUNTIME" --tensorfs "$TENSORFS" \
            --device "$DEVICE" --out "$RUNNER_TEMP/hardware-proof"
      - if: always()
        uses: ./creator/e2e/publish
        with:
          name: isolated-hardware
          path: ${{ runner.temp }}/hardware-proof
          retention-days: 14
