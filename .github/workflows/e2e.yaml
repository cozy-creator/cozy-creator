name: xs159 matched Mac scale profile
# Disposable diagnostic branch; NEVER MERGE. Required/default/release workflows remain unchanged.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  matched-mac-profile:
    if: github.ref == 'refs/heads/diag/xs159-mac-scale-performance'
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .diag
      - uses: actions/checkout@v5
        with:
          ref: 811b924a138a1cb1fa61128d413279688c0d1b44
          path: .creator
      - uses: actions/checkout@v5
        with:
          ref: 14d9c5fb407bc87e678d7d35d2aa9db66a2422f9
          path: .baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/setup@v1
        with:
          package-json-file: .creator/web/app/package.json
          install: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: .creator/e2e/hubcheck/go.mod
          cache-dependency-path: .creator/e2e/hubcheck/go.sum
      - name: Exact current Mac native artifact, no rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidates"
          gh api repos/cozy-creator/cozy-creator/actions/artifacts/13788927202/zip > "$RUNNER_TEMP/candidate.zip"
          echo "3c22c2b888481aee488e5927861a9a0cde06238cda3663591c93c6a5bc186935  $RUNNER_TEMP/candidate.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/candidates"
          test -f "$RUNNER_TEMP/candidates/cozy"
          chmod +x "$RUNNER_TEMP/candidates/cozy"
          "$RUNNER_TEMP/candidates/cozy" --version | tee "$RUNNER_TEMP/native-version.txt"
          grep -F '0.23.1+dev.ga2333ba5' "$RUNNER_TEMP/native-version.txt"
          node .diag/e2e/diagnostics/performance/controls.cjs < .creator/e2e/cli/web/scale.js
          node .diag/e2e/diagnostics/performance/review-controls.cjs
      - name: Complete production frontend builds, plain and profiled
        run: |
          pnpm --dir .creator/web/app install --frozen-lockfile --ignore-scripts
          pnpm --dir .baseline/web/app install --frozen-lockfile --ignore-scripts
          node .diag/e2e/diagnostics/performance/build-frontends.mjs .creator 811b924a138a1cb1fa61128d413279688c0d1b44 "$RUNNER_TEMP/frontend-current"
          node .diag/e2e/diagnostics/performance/build-frontends.mjs .baseline 14d9c5fb407bc87e678d7d35d2aa9db66a2422f9 "$RUNNER_TEMP/frontend-baseline"
      - name: Four bounded matched workloads, original verdicts retained
        run: bash .diag/e2e/diagnostics/performance/run-matrix.sh 2>&1 | node .creator/e2e/publish/scrub.js
      - name: Stage allowlisted diagnostic results only
        if: always()
        run: python3 .diag/e2e/diagnostics/performance/stage-results.py "$RUNNER_TEMP"
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: xs159-matched-mac-scale-profile
          path: ${{ runner.temp }}/perf-publish
          retention-days: 14
