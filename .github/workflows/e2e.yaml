name: e2e
# CI v2 (tracker/design/ci-v2.md): cozy as a person runs it, on GitHub's runners, for the suites the change
# selects (ci/affected, ci/suites.toml). `cli`: install, up, the local machine, a weightless request and real
# BiRefNet on the CPU, a second executor, down, uninstall (Linux); on macOS and Windows, when selected, what needs no
# machine and every local verb refused (they run no models themselves yet). `imports`:
# every published first-party package release installs and imports on the candidate set. `mps`: real
# inference on the macOS runner's Apple GPU. The GPU suites run in the release gate, not here. `e2e` always
# reports.
#   Required for merges into master and rc/*: it runs on the merge queue's group (merge_group), on the final
#   PR + branch state; on a pull request `affected` and every suite are skipped and `e2e` passes at once, which
#   lets the PR be queued. Nothing runs on a push. A queue entry's base (merge_group.base_sha) is the entry ahead
#   of it, so it selects only its own PR's suites: the rulesets' ALLGREEN (here, cozy-runtime, packages) makes
#   every entry pass its own. HEADGREEN let a later entry's green carry red ones ahead of it in (cl-677).
#   Other repos (their own merge_group) and dispatches call it:
#     uses: cozy-creator/cozy-creator/.github/workflows/e2e.yaml@master
#     with: {repo: cozy-runtime, ref: <head sha>, base: <base sha>}     # or select: "<tokens>" instead of base
# The candidate set (TensorD, TensorFS, the Runtime) is built from the change and the other repos' master
# (stack_ref, runtime_ref) and goes on through `cozy machine update local`; the rest is the release a person
# would get from https://tensorhub.com/install.sh. On Linux each candidate is its own job, once, and the suites
# run in shards that share it: TensorD and TensorFS come from an earlier cozy-creator e2e run that built the same
# build inputs when one did (master's, for cozy-runtime and packages; a PR's own dispatch for its queue entry), so
# only a change to them builds them.
on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      repo:
        description: The repo whose change this is (cozy-creator, cozy-runtime, packages)
        type: string
        required: true
      ref:
        description: Its change's commit
        type: string
        required: true
      base:
        description: What the change is against (the PR's base, the last release tag)
        type: string
        default: ''
      select:
        description: "Tokens instead of ci/affected's selection (ci/suites.toml); `affected`: ci/affected from base to ref, as the merge queue selects"
        type: string
        default: ''
      creator_ref:
        description: "The cozy-creator commit whose ci/ and e2e/ run (empty: the cozy under test's own commit)"
        type: string
        default: ''
      stack_ref:
        description: The cozy-creator commit the candidate TensorD and TensorFS come from (the change's own, if cozy-creator's)
        type: string
        default: master
      runtime_ref:
        description: The cozy-runtime commit the candidate Runtime comes from (the change's own, if cozy-runtime's)
        type: string
        default: master
      packages_ref:
        description: The packages checkout beside the candidate set (the change's own, if packages); empty/default follows the RC sibling
        type: string
        default: master
      tensord:
        description: TensorD (cozy) to take instead of building it, an exact release version (a prerelease's too) `cozy machine update` fetches
        type: string
        default: ''
      tensorfs:
        description: TensorFS to take instead of building it, an exact release version (a prerelease's too, such as 0.15.1)
        type: string
        default: ''
      runtime:
        description: The Runtime to take instead of building it, an exact release version (a prerelease's too, such as 0.32.0)
        type: string
        default: ''
      pins:
        description: Package releases the imports and cli-release suites take instead of the latest unyanked (name@release,...)
        type: string
        default: ''
      published:
        description: The imports suite loads the published releases instead of the packages checkout (a release's question)
        type: boolean
        default: false
      publish_run:
        description: A cozy-publish.yaml run (a dry run's too) whose own installer installs its cozy on every runner, the candidate in place of a build
        type: string
        default: ''
      sku:
        description: What cli-release rents (empty, the catalog's cheapest GPU)
        type: string
        default: ''
      quote:
        description: cli-release stops at the rental's quote and rents nothing (its $0 pre-flight)
        type: boolean
        default: false
      native_shards:
        description: Native CLI partitions as a JSON list; empty uses the full native matrix
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      repo:
        type: string
        default: cozy-creator
      ref:
        type: string
        default: master
      base:
        type: string
        default: ''
      select:
        type: string
        default: cli
      creator_ref:
        type: string
        default: ''
      stack_ref:
        type: string
        default: master
      runtime_ref:
        type: string
        default: master
      packages_ref:
        type: string
        default: master
      tensord:
        type: string
        default: ''
      tensorfs:
        type: string
        default: ''
      runtime:
        type: string
        default: ''
      pins:
        type: string
        default: ''
      published:
        type: boolean
        default: false
      publish_run:
        type: string
        default: ''
      sku:
        type: string
        default: ''
      quote:
        type: boolean
        default: false
      # The cli shards to run, a JSON list (`["executors","commands"]`); empty: all. Reruns only what failed.
      shards:
        type: string
        default: ''
      native_shards:
        description: Native CLI partitions as a JSON list; empty uses the full native matrix
        type: string
        default: ''
      # skew (select it: `select=skew`): released cozy versions × a Hub built from tensorhub at hub_ref (e2e/skew/run.sh).
      hub_ref:
        description: "skew: the tensorhub ref the Hub is built from (the candidate)"
        type: string
        default: master
      skew_clients:
        description: "skew: released cozy versions, space-separated; `previous` is the previous minor's latest patch"
        type: string
        default: previous
      cozy_min:
        description: "skew: the Hub's clients.cozy_min (empty serves every version)"
        type: string
        default: ''

permissions:
  contents: read
  # e2e/candidates/build.sh finds earlier runs' candidates.
  actions: read

# Each merge group, dispatch and call runs to its end; a pull request's placeholder is superseded by the next push.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    # On a pull request (here or a caller's) nothing runs: the merge queue's group is where e2e runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs sends no signal.
    timeout-minutes: 10
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      linux: ${{ steps.select.outputs.linux }}
      runners: ${{ steps.select.outputs.runners }}
      native_runners: ${{ steps.select.outputs.native_runners }}
      native_build: ${{ steps.select.outputs.native_build }}
      repo: ${{ steps.what.outputs.repo }}
      ref: ${{ steps.pin.outputs.ref }}
      creator: ${{ steps.pin.outputs.creator }}
      stack: ${{ steps.pin.outputs.stack }}
      runtime: ${{ steps.pin.outputs.runtime }}
      packages: ${{ steps.pin.outputs.packages }}
      skew_clients: ${{ steps.skew.outputs.clients }}
    steps:
      - id: what
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          BASE: ${{ inputs.base }}
          CREATOR: ${{ inputs.creator_ref }}
          STACK: ${{ inputs.stack_ref || 'master' }}
          TENSORD: ${{ inputs.tensord }}
          PUBLISH_RUN: ${{ inputs.publish_run }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref || github.event.merge_group.head_ref }}
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || '' }}
        run: |
          # No inputs: this repo's own merge group.
          [ -n "$REPO" ] || { REPO=cozy-creator REF=$HEAD_SHA BASE=$BASE_SHA CREATOR=$HEAD_SHA; }
          # A cut across repos lands as `rc/<x>` in each: a change on or into one, or a dispatch from one, runs against its
          # siblings' `rc/<x>` where they have one, else master. A merge group's head names the PR, not the PR's branch.
          rc=
          for b in "${BASE_REF#refs/heads/}" "${HEAD_REF#refs/heads/}" "$DISPATCHED"; do [[ $b == rc/* ]] && { rc=$b; break; }; done
          if [ -z "$rc" ] && [[ ${HEAD_REF#refs/heads/} =~ ^gh-readonly-queue/.+/pr-([0-9]+)- ]]; then
            b=$(gh api "repos/cozy-creator/${REPO/#tensorhub/tensorhub-v2}/pulls/${BASH_REMATCH[1]}" -q .head.ref 2>/dev/null) || b=
            [[ $b != rc/* ]] || rc=$b
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ -n "$rc" ] && [ "$STACK" = master ] && gh api "repos/cozy-creator/cozy-creator/branches/$rc" -q .name >/dev/null 2>&1; then
            STACK=$rc
          fi
          # The harness (ci/, e2e/, coverage.toml) is the cozy under test's own commit unless creator_ref names one: a
          # taken release's tag, a publish run's commit, the change's when it is cozy-creator's, else stack_ref's.
          from_stack=
          if [ -z "$CREATOR" ]; then
            if [ -n "$TENSORD" ]; then CREATOR=v$TENSORD
            elif [ -n "$PUBLISH_RUN" ]; then CREATOR=$(gh api "repos/cozy-creator/cozy-creator/actions/runs/$PUBLISH_RUN" -q .head_sha)
            elif [ "$REPO" = cozy-creator ]; then CREATOR=$REF
            else CREATOR=$STACK from_stack=1; fi
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"; echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"; echo "creator=$CREATOR" >> "$GITHUB_OUTPUT"
          echo "from_stack=$from_stack" >> "$GITHUB_OUTPUT"
          echo "github=cozy-creator/${REPO/#tensorhub/tensorhub-v2}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ steps.what.outputs.creator }}
          path: .creator
      # Each ref resolves once, here, to the commit every job checks out: a branch that moves mid-run never mixes two
      # commits in one run (one master's coverage.toml against another's candidate cozy, cozy-runtime 40887117045).
      - id: pin
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ steps.what.outputs.github }}
          REF: ${{ steps.what.outputs.ref }}
          FROM_STACK: ${{ steps.what.outputs.from_stack }}
          STACK: ${{ inputs.stack_ref || 'master' }}
          RUNTIME: ${{ inputs.runtime_ref || 'master' }}
          PACKAGES: ${{ inputs.packages_ref || 'master' }}
          RC: ${{ steps.what.outputs.rc }}
        run: |
          commit() { gh api "repos/$1/commits/$2" -q .sha; }
          # The sibling's `rc/<x>` (the `what` step's) when it has one, else what was asked.
          sibling() { if [ -n "$RC" ] && [ "$2" = master ] && gh api "repos/$1/branches/$RC" -q .name >/dev/null 2>&1; then echo "$RC"; else echo "$2"; fi; }
          ref=$(commit "$GITHUB_REPO" "$REF")
          creator=$(git -C .creator rev-parse HEAD)
          stack=$creator; [ -n "$FROM_STACK" ] || stack=$(commit cozy-creator/cozy-creator "$(sibling cozy-creator/cozy-creator "$STACK")")
          runtime=$(commit cozy-creator/cozy-runtime "$(sibling cozy-creator/cozy-runtime "$RUNTIME")")
          packages=$ref
          [ "$GITHUB_REPO" = cozy-creator/packages ] || packages=$(commit cozy-creator/packages "$(sibling cozy-creator/packages "$PACKAGES")")
          for c in "$ref" "$creator" "$stack" "$runtime" "$packages"; do [[ $c =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unresolved ref: '$c'"; exit 1; }; done
          printf 'ref=%s\ncreator=%s\nstack=%s\nruntime=%s\npackages=%s\n' "$ref" "$creator" "$stack" "$runtime" "$packages" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: inputs.select == '' || inputs.select == 'affected'
        with:
          repository: ${{ steps.what.outputs.github }}
          ref: ${{ steps.pin.outputs.ref }}
          path: src
          fetch-depth: 0
      - id: select
        env:
          PUBLISH_RUN: ${{ inputs.publish_run }}
          TOKENS: ${{ inputs.select }}
          REPO: ${{ steps.what.outputs.repo }}
          REF: ${{ steps.pin.outputs.ref }}
          BASE: ${{ steps.what.outputs.base }}
        run: |
          if [ -n "$TOKENS" ] && [ "$TOKENS" != affected ]; then s=$(.creator/ci/affected --tokens "$TOKENS" --json)
          else s=$(cd src && ../.creator/ci/affected "$REPO" "$BASE" "$REF" --json); fi
          echo "selection=$s" >> "$GITHUB_OUTPUT"
          # A Linux suite takes the candidate jobs' set.
          echo "linux=$(echo "$s" | jq 'any(.suites[]; . == "cli" or . == "imports" or . == "cli-release" or . == "cpu")')" >> "$GITHUB_OUTPUT"
          # The cli suite's other runners: macOS arm64 (Intel Macs aren't supported), Windows x64; a release run's installer
          # on Windows arm64 too.
          arm=$([ -z "$PUBLISH_RUN" ] || echo '"windows-11-arm"')
          runners=$(echo "$s" | jq -c "[.os[] | {macos: [\"macos-15\"], windows: [\"windows-2025\"${arm:+, $arm}]}[.] // [] | .[]]")
          echo "runners=$runners" >> "$GITHUB_OUTPUT"
          # One native cozy per OS across CLI partitions and explicit Apple-GPU inference.
          echo "native_runners=$(echo "$s" | jq -c --argjson cli "$runners" '
            [if (.suites | any(. == "cli" or . == "supervisor")) then $cli[] else empty end,
             if (.suites | index("mps")) then "macos-15" else empty end] | unique')" >> "$GITHUB_OUTPUT"
          echo "native_build=$(echo "$s" | jq 'any(.suites[]; . == "cli" or . == "mps")')" >> "$GITHUB_OUTPUT"
          { echo "### e2e selection: $REPO ${REF:0:12}"; echo '```'; echo "$s" | jq .; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$s" | jq .
      # skew's clients: `previous` is the previous minor's latest patch, from this cozy's own version.
      - id: skew
        env:
          CLIENTS: ${{ inputs.skew_clients || 'previous' }}
          SELECTION: ${{ steps.select.outputs.selection }}
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -e 'any(.suites[]; . == "skew")' <<< "$SELECTION" > /dev/null || { echo 'clients=[""]' >> "$GITHUB_OUTPUT"; exit 0; }
          v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' .creator/Cargo.toml); minor=${v%.*}
          prev=${minor%%.*}.$(( ${minor#*.} - 1 ))
          latest=$(gh release list -R cozy-creator/cozy-creator --exclude-pre-releases -L 100 --json tagName -q '.[].tagName' |
            grep -E "^v${prev//./\\.}\.[0-9]+$" | sort -V | tail -1)
          out=
          for c in $CLIENTS; do
            [ "$c" = previous ] && c=${latest#v}
            [ -n "$c" ] || { echo "::error::no released cozy $prev.x (this cozy is $v)"; exit 1; }
            out=$out${out:+,}\"${c#v}\"
          done
          echo "clients=[$out]" | tee -a "$GITHUB_OUTPUT"

  # One candidate a job (e2e/candidates/build.sh), each this run's candidate-<what>-<inputs> artifact for every Linux
  # suite: TensorD and TensorFS reused from an earlier merge-group or dispatched run that built the same build inputs
  # (a PR's own dispatch, when the PR is up to date), else built. A taken one (its version) builds nothing.
  candidate:
    name: candidate ${{ matrix.what }}
    needs: affected
    if: needs.affected.outputs.linux == 'true' && !(inputs.publish_run != '' && inputs.select == 'cli' && inputs.shards == '["projectvault"]' && needs.affected.outputs.repo == 'cozy-creator')
    strategy:
      matrix:
        include:
          - { what: cozy, repo: cozy-creator, take: "${{ inputs.tensord || inputs.publish_run }}" }
          - { what: tensorfs, repo: cozy-creator, take: "${{ inputs.tensorfs }}" }
          - { what: runtime, repo: cozy-runtime, take: "${{ inputs.runtime }}" }
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs sends no signal.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/${{ matrix.repo }}
          ref: ${{ needs.affected.outputs.repo == matrix.repo && needs.affected.outputs.ref || matrix.repo == 'cozy-runtime' && needs.affected.outputs.runtime || needs.affected.outputs.stack }}
          path: .build
      - uses: astral-sh/setup-uv@v7
      # A dispatch on cozy-creator's master always builds: its Rust caches are the ones merge groups restore.
      - id: reuse
        if: matrix.what != 'runtime' && matrix.take == '' && !(github.repository == 'cozy-creator/cozy-creator' && github.ref == 'refs/heads/master')
        env:
          REUSE: 1
        run: bash .creator/e2e/candidates/build.sh ${{ matrix.what }} .build "$RUNNER_TEMP/candidates"
      - if: matrix.what != 'runtime' && matrix.take == '' && steps.reuse.outputs.name == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build -> target
          key: ${{ matrix.what }}
          # A merge group's cache is its own ref's, which nothing restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      # The page cozy embeds; build.sh builds it. A ref from before web/app has none.
      - if: matrix.what == 'cozy' && matrix.take == '' && steps.reuse.outputs.name == '' && hashFiles('.build/web/app/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - if: matrix.what == 'cozy' && matrix.take == '' && steps.reuse.outputs.name == '' && hashFiles('.build/web/app/package.json') != ''
        uses: pnpm/setup@v1
        with:
          package-json-file: .build/web/app/package.json
          install: false
      - if: matrix.what == 'cozy' && (matrix.take != '' || steps.reuse.outputs.name == '')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .creator -> target
          key: stage-code
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - id: build
        if: matrix.take == '' && steps.reuse.outputs.name == ''
        env:
          CARGO_INCREMENTAL: "0"
        run: bash .creator/e2e/candidates/build.sh ${{ matrix.what }} .build "$RUNNER_TEMP/candidates"
      - if: matrix.take == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reuse.outputs.name || steps.build.outputs.name }}
          path: ${{ runner.temp }}/candidates
          if-no-files-found: error
          retention-days: 14
      # A taken cozy still stages local warming fixtures with the immutable harness's native API helper.
      - name: Build the local source staging helper for a taken cozy
        if: matrix.what == 'cozy' && matrix.take != ''
        env:
          CARGO_INCREMENTAL: "0"
          COZY_COMMIT: ${{ needs.affected.outputs.creator }}
        run: |
          (cd .creator && cargo build --release --locked -p api --example stage-code)
          mkdir -p "$RUNNER_TEMP/candidates"
          cp .creator/target/release/examples/stage-code "$RUNNER_TEMP/candidates/stage-code"
      - if: matrix.what == 'cozy' && matrix.take != ''
        uses: actions/upload-artifact@v4
        with:
          name: candidate-stage-code-${{ needs.affected.outputs.creator }}
          path: ${{ runner.temp }}/candidates/stage-code
          if-no-files-found: error
          retention-days: 14

  # Linux, in shards (e2e/cli/run.sh --shard) on the candidate jobs' set; `e2e` checks coverage over all of them.
  # The exact published-vault focus uses its producer's archives and the real isolated Hub,
  # without rebuilding Creator or a staging helper that this suite never calls.
  projectvault-archive:
    name: published projectvault Linux
    needs: affected
    if: inputs.publish_run != '' && inputs.select == 'cli' && inputs.shards == '["projectvault"]' && needs.affected.outputs.repo == 'cozy-creator'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
          persist-credentials: false
      - name: Verify and extract the exact published producer
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER: ${{ inputs.publish_run }}
          SOURCE: ${{ needs.affected.outputs.ref }}
          STACK: ${{ needs.affected.outputs.stack }}
          HARNESS: ${{ needs.affected.outputs.creator }}
          RUNTIME_REF: ${{ needs.affected.outputs.runtime }}
          PACKAGES_REF: ${{ needs.affected.outputs.packages }}
          RUNTIME: ${{ inputs.runtime }}
          TENSORFS: ${{ inputs.tensorfs }}
        run: |
          set -euo pipefail
          [[ $PRODUCER =~ ^[0-9]+$ && $SOURCE =~ ^[0-9a-f]{40}$ && $STACK == "$SOURCE" ]]
          [[ $RUNTIME =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ && $TENSORFS =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          mkdir -p "$RUNNER_TEMP/e2e/provenance" "$RUNNER_TEMP/vault-release" "$RUNNER_TEMP/vault-manifest"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER" > "$RUNNER_TEMP/e2e/provenance/producer.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRODUCER/artifacts" > "$RUNNER_TEMP/e2e/provenance/artifacts.json"
          jq -e --arg source "$SOURCE" '.head_sha == $source and .status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and (.path | split("@")[0]) == ".github/workflows/cozy-publish.yaml"' "$RUNNER_TEMP/e2e/provenance/producer.json"
          gh run download "$PRODUCER" -R "$GITHUB_REPOSITORY" -n artifacts-build-local-x86_64-unknown-linux-gnu -D "$RUNNER_TEMP/vault-release"
          gh run download "$PRODUCER" -R "$GITHUB_REPOSITORY" -n artifacts-build-global -D "$RUNNER_TEMP/vault-release"
          gh run download "$PRODUCER" -R "$GITHUB_REPOSITORY" -n artifacts-dist-manifest -D "$RUNNER_TEMP/vault-manifest"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          manifest = json.loads((root/'vault-manifest/dist-manifest.json').read_text())
          name = 'cozy-x86_64-unknown-linux-gnu.tar.gz'
          archive = root/'vault-release'/name
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          assert digest == manifest['artifacts'][name]['checksums']['sha256']
          assert (root/'vault-release'/(name+'.sha256')).read_text().split()[0] == digest
          client = root/'vault-client'; client.mkdir()
          with tarfile.open(archive) as source:
              source.extractall(client, filter='data')
          binaries = [p for p in client.rglob('cozy') if p.is_file() and not p.is_symlink()]
          assert len(binaries) == 1
          binary = binaries[0]; binary.chmod(0o755)
          binary_sha = hashlib.sha256(binary.read_bytes()).hexdigest()
          version = subprocess.check_output([str(binary), '--version'], text=True).strip()
          release = next(r for r in manifest['releases'] if r['app_name'] == 'cozy')
          assert version == 'cozy '+release['app_version']
          record = dict(producer=os.environ['PRODUCER'], source=os.environ['SOURCE'], harness=os.environ['HARNESS'],
              requested_runtime_ref=os.environ['RUNTIME_REF'], requested_packages_ref=os.environ['PACKAGES_REF'], uses_packages_checkout=False,
              runtime=os.environ['RUNTIME'], tensorfs=os.environ['TENSORFS'], archive=name, archive_sha256=digest,
              binary_sha256=binary_sha, version=version, boundary='archive binary; installer is a separate gate')
          (root/'e2e/provenance/cohort.json').write_text(json.dumps(record, indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('binary='+str(binary)+'\n')
              output.write('binary_sha256='+binary_sha+'\n')
          PY
          cp "$RUNNER_TEMP/vault-manifest/dist-manifest.json" "$RUNNER_TEMP/e2e/provenance/dist-manifest.json"
          pin=$(tr -d '\r\n' < .creator/ci/hub-ref)
          [ -n "$pin" ]
          echo "hub_ref=$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/tensorhub
          ref: ${{ steps.archive.outputs.hub_ref }}
          ssh-key: ${{ secrets.TENSORHUB_READ_KEY }}
          persist-credentials: false
          path: .tensorhub
      - uses: actions/setup-go@v5
        with:
          go-version-file: .tensorhub/go.mod
          cache-dependency-path: .tensorhub/go.sum
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: AnimMouse/setup-ffmpeg@v1
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/skew-tools
          key: skew-minio-RELEASE.2025-09-07T16-13-09Z
      - name: Native filesystem driver and real isolated Hub vault proof
        env:
          BINARY: ${{ steps.archive.outputs.binary }}
          RUNTIME: ${{ inputs.runtime }}
          TENSORFS: ${{ inputs.tensorfs }}
          SKEW_TOOLS: ${{ runner.temp }}/skew-tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2t64
          sudo modprobe fuse || test -e /dev/fuse
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          git -C .tensorhub rev-parse HEAD > "$RUNNER_TEMP/e2e/provenance/hub-source.txt"
          bash .creator/e2e/skew/run.sh --hub-src .tensorhub --cozy-bin "$BINARY" \
            --runtime "$RUNTIME" --tensorfs "$TENSORFS" --out "$RUNNER_TEMP/e2e" \
            --command .creator/e2e/cli/projectvault-isolated.sh 2>&1 | node .creator/e2e/publish/scrub.js
      - name: The installed proof used the exact archive binary
        if: always() && steps.archive.outputs.binary_sha256 != ''
        env:
          EXPECTED: ${{ steps.archive.outputs.binary_sha256 }}
        run: |
          jq -e --arg sha "$EXPECTED" '.sha256 == $sha' "$RUNNER_TEMP/e2e/command/cohort.json"
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-cli-linux-projectvault
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  cli:
    name: cli ${{ matrix.shard }}
    needs: [affected, candidate]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'cli') && inputs.shards != '[]' && !(inputs.publish_run != '' && inputs.select == 'cli' && inputs.shards == '["projectvault"]' && needs.affected.outputs.repo == 'cozy-creator')
    strategy:
      fail-fast: false
      matrix:
        # projectdb covers project.db and state.db; the older projectdb-* aliases repeat its calls.
        # Web behavior and the layout viewport partitions run separately. Manual shard selections remain available.
        shard: ${{ fromJSON(inputs.shards || '["runs","executors","commands","follow","web-core","web-layout-1280","web-layout-1600","web-layout-2560","projectdb","projectvault","local-code"]') }}
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          packages_ref: ${{ needs.affected.outputs.packages }}
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: artifacts
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      # The project part's fixtures and probes (e2e/cli/project.sh); Calcifer, a service, fetches its own.
      - if: matrix.shard == 'commands' || matrix.shard == 'web' || startsWith(matrix.shard, 'web-') || matrix.shard == 'local-code' || matrix.shard == 'control' || matrix.shard == 'projectvault' || startsWith(matrix.shard, 'projectdb') || startsWith(matrix.shard, 'project-stream')
        uses: AnimMouse/setup-ffmpeg@v1
      - name: Install the optional project-encryption filesystem driver
        if: matrix.shard == 'projectvault'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2t64
          sudo modprobe fuse || test -e /dev/fuse
      - name: cli suite
        env:
          PINS: ${{ inputs.pins }}
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ contains(fromJSON(needs.affected.outputs.selection).suites, 'model') && '--model' || '' }}
        # BiRefNet: a pin, the change's packages, or packages master (the set's own).
        run: bash .creator/e2e/cli/run.sh --out "$RUNNER_TEMP/e2e" --shard ${{ matrix.shard }} $MODEL $CANDIDATES ${PINS:+--pins "$PINS"} $(case " $CANDIDATES " in (*" --packages "*) ;; (*) echo ${PACKAGES_MASTER:+--packages "$PACKAGES_MASTER"} ;; esac) 2>&1 | node .creator/e2e/publish/scrub.js
      # cozy's logs (Calcifer's too) however the suite ended: one the job's timeout ends never reaches its `logs` part (cl-837).
      - if: always()
        run: mkdir -p "$RUNNER_TEMP/e2e/cozy-logs" && cd ~/.cozy && find . -name '*.log' -size -20M | tar -cf - -T - | tar -xf - -C "$RUNNER_TEMP/e2e/cozy-logs" || true
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-cli-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # Each native runner builds or reuses cozy once for CLI partitions and MPS.
  # An explicit supervisor-only selection runs the process checks without building a candidate.
  candidate-os:
    name: candidate ${{ matrix.runner }}
    needs: affected
    if: needs.affected.outputs.native_runners != '[]' && !(inputs.publish_run != '' && inputs.select == 'cli' && inputs.shards == '["projectvault"]' && needs.affected.outputs.repo == 'cozy-creator')
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.affected.outputs.native_runners) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - id: native
        if: needs.affected.outputs.native_build == 'true' && inputs.tensord == '' && inputs.publish_run == ''
        uses: ./.creator/e2e/candidates
        with:
          packages_ref: ${{ needs.affected.outputs.packages }}
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          stack_ref: ${{ needs.affected.outputs.stack }}
          runtime_ref: ${{ needs.affected.outputs.runtime }}
      - if: runner.os == 'Windows' && (needs.affected.outputs.native_build != 'true' || inputs.tensord != '' || inputs.publish_run != '')
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.repo == 'cozy-creator' && needs.affected.outputs.ref || needs.affected.outputs.stack }}
          path: .native-tests
      - if: runner.os == 'Windows' && (needs.affected.outputs.native_build != 'true' || inputs.tensord != '' || inputs.publish_run != '')
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .native-tests -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Windows supervisor process tests
        if: >-
          runner.os == 'Windows' &&
          (inputs.native_shards == '' ||
           contains(fromJSON(needs.affected.outputs.selection).suites, 'supervisor'))
        env:
          CREATOR: ${{ (needs.affected.outputs.native_build != 'true' || inputs.tensord != '' || inputs.publish_run != '') && '.native-tests' || (needs.affected.outputs.repo == 'cozy-creator' && '.src' || '.stack') }}
        run: |
          cd "$CREATOR"
          cargo test --release --locked -p platform --lib ipc::windows::tests -- --nocapture
          cargo test --release --locked -p tensord --lib machine::supervise::tests -- --nocapture
      - if: needs.affected.outputs.native_build == 'true' && inputs.tensord == '' && inputs.publish_run == ''
        env:
          SOURCE: ${{ needs.affected.outputs.repo == 'cozy-creator' && needs.affected.outputs.ref || needs.affected.outputs.stack }}
          ARTIFACT: ${{ steps.native.outputs.cozy_artifact }}
        run: |
          exe=''; [ "$RUNNER_OS" != Windows ] || exe=.exe
          version=$("$RUNNER_TEMP/candidates/cozy$exe" --version)
          jq -n --arg source "$SOURCE" --arg os "$RUNNER_OS" --arg arch "$RUNNER_ARCH" \
            --arg artifact "$ARTIFACT" --arg version "$version" \
            '{source: $source, os: $os, arch: $arch, artifact: $artifact, version: $version}' \
            > "$RUNNER_TEMP/candidates/native-candidate.json"
      - if: needs.affected.outputs.native_build == 'true' && inputs.tensord == '' && inputs.publish_run == ''
        uses: actions/upload-artifact@v4
        with:
          # Outside candidate-*: Linux suites download that set whole.
          name: native-cozy-${{ matrix.runner }}
          path: ${{ runner.temp }}/candidates
          if-no-files-found: error
          retention-days: 14

  # macOS (arm64) and Windows: native file/restart/browser paths plus three layout viewport partitions.
  # Generic browser journeys run on Linux; an explicit native `web` shard still runs the full suite.
  cli-os:
    name: cli ${{ matrix.runner }} ${{ matrix.shard }}
    needs: [affected, candidate-os]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'cli') && needs.affected.outputs.runners != '[]' && inputs.native_shards != '[]' && !(inputs.publish_run != '' && inputs.select == 'cli' && inputs.shards == '["projectvault"]' && needs.affected.outputs.repo == 'cozy-creator')
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.affected.outputs.runners) }}
        shard: ${{ fromJSON(inputs.native_shards || '["web-core","web-layout-1280","web-layout-1600","web-layout-2560"]') }}
    runs-on: ${{ matrix.runner }}
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          packages_ref: ${{ needs.affected.outputs.packages }}
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: native-artifact
          native_artifact: native-cozy-${{ matrix.runner }}
          stack_ref: ${{ needs.affected.outputs.stack }}
          runtime_ref: ${{ needs.affected.outputs.runtime }}
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: cli suite
        env:
          PINS: ${{ inputs.pins }}
          GH_TOKEN: ${{ github.token }}
        run: bash .creator/e2e/cli/run.sh --out "$RUNNER_TEMP/e2e" --shard ${{ matrix.shard }} $CANDIDATES ${PINS:+--pins "$PINS"} $(case " $CANDIDATES " in (*" --packages "*) ;; (*) echo ${PACKAGES_MASTER:+--packages "$PACKAGES_MASTER"} ;; esac) 2>&1 | node .creator/e2e/publish/scrub.js
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-cli-${{ matrix.runner }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # Publication checks use an owned Hub, Postgres and object store. Hardware qualification
  # remains separate; this job neither rents production machines nor uses a production account.
  cli-release:
    name: isolated publication
    needs: [affected, candidate]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'cli-release')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          packages_ref: ${{ needs.affected.outputs.packages }}
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: artifacts
          stack_ref: ${{ needs.affected.outputs.stack }}
          runtime_ref: ${{ needs.affected.outputs.runtime }}
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/tensorhub
          ref: ${{ inputs.hub_ref || 'master' }}
          ssh-key: ${{ secrets.TENSORHUB_READ_KEY }}
          persist-credentials: false
          path: .tensorhub
      - uses: actions/setup-go@v5
        with:
          go-version-file: .tensorhub/go.mod
          cache-dependency-path: .tensorhub/go.sum
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/skew-tools
          key: skew-minio-RELEASE.2025-09-07T16-13-09Z
      - name: Publication checks against the isolated Hub
        env:
          SKEW_TOOLS: ${{ runner.temp }}/skew-tools
        run: |
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          read -r -a candidate_args <<< "$CANDIDATES"
          client=() extra=()
          for ((i=0; i<${#candidate_args[@]}; i+=2)); do
            value=${candidate_args[i+1]}
            case ${candidate_args[i]} in
              --tensord)
                if [ -f "$value" ]; then client=(--cozy-bin "$value"); else client=(--client "$value"); fi ;;
              --runtime) extra+=(--runtime "$value") ;;
              --tensorfs) extra+=(--tensorfs "$value") ;;
              --release)
                archive=$(find "$value" -maxdepth 1 -name 'cozy-x86_64-unknown-linux-gnu.tar.gz' -print -quit)
                [ -n "$archive" ] || { echo '::error::no Linux candidate archive'; exit 1; }
                mkdir -p "$RUNNER_TEMP/fixture-client"
                tar -xzf "$archive" -C "$RUNNER_TEMP/fixture-client"
                binary=$(find "$RUNNER_TEMP/fixture-client" -type f -name cozy -print -quit)
                [ -n "$binary" ] || { echo '::error::candidate archive has no cozy'; exit 1; }
                chmod +x "$binary"; client=(--cozy-bin "$binary") ;;
            esac
          done
          [ ${#client[@]} -gt 0 ] || { echo '::error::no candidate CLI was supplied'; exit 1; }
          bash .creator/e2e/skew/run.sh --hub-src .tensorhub "${client[@]}" "${extra[@]}" \
            --checks .creator/e2e/release/synthetic.sh --publication-log "$RUNNER_TEMP/e2e/argv.log" --out "$RUNNER_TEMP/e2e"
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-cli-publication
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # In shards of every Nth package (e2e/imports/run.sh --shard K/N), on the candidate jobs' set: two keep them off the
  # critical path (cli runs).
  imports:
    name: imports ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [affected, candidate]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'imports')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          packages_ref: ${{ needs.affected.outputs.packages }}
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: artifacts
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: imports suite
        env:
          PINS: ${{ inputs.pins }}
          PUBLISHED: ${{ inputs.published && '1' || '' }}
        # The packages: the change's checkout, packages master, or (a release's dispatch) the published ones.
        run: bash .creator/e2e/imports/run.sh --out "$RUNNER_TEMP/e2e" --shard ${{ matrix.shard }}/${{ strategy.job-total }} $CANDIDATES ${PINS:+--pins "$PINS"} ${PUBLISHED:+--published} $(case " $CANDIDATES " in (*" --packages "*) ;; (*) echo ${PACKAGES_MASTER:+--packages "$PACKAGES_MASTER"} ;; esac) 2>&1 | node .creator/e2e/publish/scrub.js
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-imports-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # The free CPU test (e2e/cpu): every package's entry points through the candidate Runtime's real executor with tiny
  # random weights, one and two ranks, outputs against stored references; each package uploaded, locked and its
  # requests bound through the candidate cozy. No GPU, rental or sign-in.
  cpu:
    needs: [affected, candidate]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'cpu')
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          packages_ref: ${{ needs.affected.outputs.packages }}
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: artifacts
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      # The locked wheels every package's environment takes (CPU torch included), by the locks that name them.
      - uses: actions/cache@v4
        with:
          path: .uv-cache
          key: cpu-uv-${{ hashFiles('.pkgs/*/uv.lock', '.src/*/uv.lock') }}
          restore-keys: cpu-uv-
      # The CLI cells' cozy (e2e/cpu/cli.sh): installed as a person installs it, the candidate in its place and Calcifer
      # restarted on it, as the cli suite's candidates step does.
      - name: cpu suite
        run: |
          . .creator/e2e/lib.sh
          parse --out "$RUNNER_TEMP/e2e/cozy" $CANDIDATES
          install_cozy
          user_services
          if [ -f "$CAND_COZY" ]; then
            cozy --json doctor > "$OUT/doctor.json" || true
            grep -q "$("$CAND_COZY" --version)," "$OUT/doctor.json" || fail "Calcifer is not the candidate $("$CAND_COZY" --version)"
          fi
          mkdir -p "$RUNNER_TEMP/project" && (cd "$RUNNER_TEMP/project" && cozy --json new > /dev/null) || fail "cozy new failed"
          code=0
          bash .creator/e2e/cpu/run.sh --out "$RUNNER_TEMP/e2e" --envs "$RUNNER_TEMP/envs" $CANDIDATES \
            $(case " $CANDIDATES " in (*" --packages "*) ;; (*) echo --packages "$PACKAGES_MASTER" ;; esac) \
            --cozy "$COZY" --project "$RUNNER_TEMP/project" 2>&1 | node .creator/e2e/publish/scrub.js || code=$?
          finish cpu
          exit "$code"
      - if: always()
        run: uv cache prune --ci
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-cpu
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  mps:
    needs: [affected, candidate-os]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'mps')
    runs-on: macos-15
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          packages_ref: ${{ needs.affected.outputs.packages }}
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: native-artifact
          native_artifact: native-cozy-macos-15
          stack_ref: ${{ needs.affected.outputs.stack }}
          runtime_ref: ${{ needs.affected.outputs.runtime }}
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: mps suite
        run: bash .creator/e2e/mps/run.sh --out "$RUNNER_TEMP/e2e" $CANDIDATES
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-mps
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # xs-166: the Hub's candidate against released clients, before a Hub deploy. Chosen only explicitly (select=skew);
  # it reports apart from `e2e`: before launch an old client's failures don't block (release-gate README).
  skew:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'skew')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(needs.affected.outputs.skew_clients) }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/tensorhub
          ref: ${{ inputs.hub_ref || 'master' }}
          ssh-key: ${{ secrets.TENSORHUB_READ_KEY }}
          persist-credentials: false
          path: .tensorhub
      - uses: actions/setup-go@v5
        with:
          go-version-file: .tensorhub/go.mod
          cache-dependency-path: .tensorhub/go.sum
      - uses: astral-sh/setup-uv@v7
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/skew-tools
          key: skew-minio-RELEASE.2025-09-07T16-13-09Z
      - name: skew cozy ${{ matrix.client }} × tensorhub ${{ inputs.hub_ref || 'master' }}
        env:
          SKEW_TOOLS: ${{ runner.temp }}/skew-tools
          CLIENT: ${{ matrix.client }}
          MIN: ${{ inputs.cozy_min }}
          RUNTIME: ${{ inputs.runtime }}
          TENSORFS: ${{ inputs.tensorfs }}
        run: |
          # Calcifer and the local machine run as user services, as on a desktop login.
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          sdk=()
          [ -z "$RUNTIME" ] || sdk+=(--runtime "$RUNTIME")
          [ -z "$TENSORFS" ] || sdk+=(--tensorfs "$TENSORFS")
          bash .creator/e2e/skew/run.sh --hub-src .tensorhub --client "$CLIENT" --cozy-min "$MIN" \
            "${sdk[@]}" --out "$RUNNER_TEMP/e2e"
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: e2e-skew-${{ matrix.client }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  e2e:
    if: always()
    needs: [affected, candidate, candidate-os, projectvault-archive, cli, cli-os, cli-release, imports, cpu, mps]
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs sends no signal.
    timeout-minutes: 10
    steps:
      # Coverage (e2e/coverage.py) over every cli shard's calls: each command and flag has a test, and each PR-tier one ran.
      # A dispatch of some shards (`shards`) checks none.
      # A taken TensorD is a release, not the CLI this checkout builds: no coverage.
      - if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == '' && inputs.shards == ''
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == '' && inputs.shards == ''
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-cli-linux-*
          path: ${{ runner.temp }}/cli
      - if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == '' && inputs.shards == ''
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-cozy-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - name: coverage
        if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == '' && inputs.shards == ''
        run: |
          chmod +x "$RUNNER_TEMP/candidates/cozy"
          python3 -I .creator/e2e/coverage.py check "$RUNNER_TEMP/candidates/cozy" .creator/e2e/coverage.toml --tiers pr \
            $(printf -- '--log %s ' "$RUNNER_TEMP"/cli/*/argv.log) --source .creator/crates/cli/src
      - if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
