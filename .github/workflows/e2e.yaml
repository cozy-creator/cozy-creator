name: e2e
# CI v2 (tracker/design/ci-v2.md): cozy as a person runs it, on GitHub's runners, for the suites the change
# selects (ci/affected, ci/suites.toml). `cli`: install, up, the local machine, a weightless request and real
# BiRefNet on the CPU, a second executor, down, uninstall (Linux); on macOS and Windows, when selected, what needs no
# machine and every local verb refused (they run no models themselves yet). `imports`:
# every published first-party package release installs and imports on the candidate set. `mps`: real
# inference on the macOS runner's Apple GPU. The GPU suites run in the release gate, not here. `e2e` always
# reports.
#   Required for merges into master and rc/*: it runs on the merge queue's group (merge_group), on the final
#   PR + branch state; on a pull request `affected` and every suite are skipped and `e2e` passes at once, which
#   lets the PR be queued. Nothing runs on a push. Other repos (their own merge_group) and dispatches call it:
#     uses: cozy-creator/cozy-creator/.github/workflows/e2e.yaml@master
#     with: {repo: cozy-runtime, ref: <head sha>, base: <base sha>}     # or select: "<tokens>" instead of base
# The candidate set (TensorD, TensorFS, the Runtime) is built from the change and the other repos' master
# (stack_ref, runtime_ref) and goes on through `cozy machine update local`; the rest is the release a person
# would get from https://tensorhub.com/install.sh. On Linux each candidate is its own job, once, and the suites
# run in shards that share it: TensorD and TensorFS come from an earlier cozy-creator e2e run that built the same
# sources when one did (master's, for cozy-runtime and packages), so only a change to them builds them.
on:
  pull_request:
  merge_group:
  workflow_call:
    inputs:
      repo:
        description: The repo whose change this is (cozy-creator, cozy-runtime, packages)
        type: string
        required: true
      ref:
        description: Its change's commit
        type: string
        required: true
      base:
        description: What the change is against (the PR's base, the last release tag)
        type: string
        default: ''
      select:
        description: Tokens instead of ci/affected's selection (ci/suites.toml)
        type: string
        default: ''
      creator_ref:
        description: The cozy-creator commit whose ci/ and e2e/ run
        type: string
        default: master
      stack_ref:
        description: The cozy-creator commit the candidate TensorD and TensorFS come from (the change's own, if cozy-creator's)
        type: string
        default: master
      runtime_ref:
        description: The cozy-runtime commit the candidate Runtime comes from (the change's own, if cozy-runtime's)
        type: string
        default: master
      tensord:
        description: TensorD (cozy) to take instead of building it, an exact release version (a prerelease's too) `cozy machine update` fetches
        type: string
        default: ''
      tensorfs:
        description: TensorFS to take instead of building it, an exact release version (a prerelease's too, such as 0.15.1)
        type: string
        default: ''
      runtime:
        description: The Runtime to take instead of building it, an exact release version (a prerelease's too, such as 0.32.0)
        type: string
        default: ''
      mps_cli_ref:
        description: Exact historical Mac CLI source for explicit library qualification only; empty keeps current product behavior
        type: string
        default: ''
      mps_tensorfs_run:
        description: TensorFS platform artifact run for that MPS library cohort; no release is created
        type: string
        default: ''
      pins:
        description: Package releases the imports suite takes instead of the latest unyanked (name@release,...)
        type: string
        default: ''
      published:
        description: The imports suite loads the published releases instead of the packages checkout (a release's question)
        type: boolean
        default: false
      publish_run:
        description: A cozy-publish.yaml run (a dry run's too) whose own installer installs its cozy on every runner, the candidate in place of a build
        type: string
        default: ''
      sku:
        description: What cli-release rents (empty, the catalog's cheapest GPU)
        type: string
        default: ''
      quote:
        description: cli-release stops at the rental's quote and rents nothing (its $0 pre-flight)
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      repo:
        type: string
        default: cozy-creator
      ref:
        type: string
        default: master
      base:
        type: string
        default: ''
      select:
        type: string
        default: cli
      creator_ref:
        type: string
        default: master
      stack_ref:
        type: string
        default: master
      runtime_ref:
        type: string
        default: master
      tensord:
        type: string
        default: ''
      tensorfs:
        type: string
        default: ''
      runtime:
        type: string
        default: ''
      mps_cli_ref:
        description: Exact historical Mac CLI source for explicit library qualification only; empty keeps current product behavior
        type: string
        default: ''
      mps_tensorfs_run:
        description: TensorFS platform artifact run for that MPS library cohort; no release is created
        type: string
        default: ''
      pins:
        type: string
        default: ''
      published:
        type: boolean
        default: false
      publish_run:
        type: string
        default: ''
      sku:
        type: string
        default: ''
      quote:
        type: boolean
        default: false

permissions:
  contents: read
  # e2e/candidates/build.sh finds earlier runs' candidates.
  actions: read

# Each merge group, dispatch and call runs to its end; a pull request's placeholder is superseded by the next push.
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  affected:
    # On a pull request (here or a caller's) nothing runs: the merge queue's group is where e2e runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs sends no signal.
    timeout-minutes: 10
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      linux: ${{ steps.select.outputs.linux }}
      runners: ${{ steps.select.outputs.runners }}
      release_runners: ${{ steps.select.outputs.release_runners }}
      repo: ${{ steps.what.outputs.repo }}
      ref: ${{ steps.what.outputs.ref }}
      creator: ${{ steps.what.outputs.creator }}
    steps:
      - id: what
        env:
          REPO: ${{ inputs.repo }}
          REF: ${{ inputs.ref }}
          BASE: ${{ inputs.base }}
          CREATOR: ${{ inputs.creator_ref }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          # No inputs: this repo's own merge group.
          [ -n "$REPO" ] || { REPO=cozy-creator REF=$HEAD_SHA BASE=$BASE_SHA CREATOR=$HEAD_SHA; }
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"; echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"; echo "creator=$CREATOR" >> "$GITHUB_OUTPUT"
          echo "github=cozy-creator/${REPO/#tensorhub/tensorhub-v2}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ steps.what.outputs.creator }}
          path: .creator
      - uses: actions/checkout@v5
        if: inputs.select == ''
        with:
          repository: ${{ steps.what.outputs.github }}
          ref: ${{ steps.what.outputs.ref }}
          path: src
          fetch-depth: 0
      - id: select
        env:
          PUBLISH_RUN: ${{ inputs.publish_run }}
          TOKENS: ${{ inputs.select }}
          REPO: ${{ steps.what.outputs.repo }}
          REF: ${{ steps.what.outputs.ref }}
          BASE: ${{ steps.what.outputs.base }}
        run: |
          if [ -n "$TOKENS" ]; then s=$(.creator/ci/affected --tokens "$TOKENS" --json)
          else s=$(cd src && ../.creator/ci/affected "$REPO" "$BASE" "$REF" --json); fi
          echo "selection=$s" >> "$GITHUB_OUTPUT"
          # A Linux suite takes the candidate jobs' set.
          echo "linux=$(echo "$s" | jq 'any(.suites[]; . == "cli" or . == "imports" or . == "cli-release")')" >> "$GITHUB_OUTPUT"
          # The cli suite's other runners: macOS arm64 and x64, Windows x64; a release run's installer on Windows arm64 too.
          arm=$([ -z "$PUBLISH_RUN" ] || echo '"windows-11-arm"')
          echo "runners=$(echo "$s" | jq -c "[.os[] | {macos: [\"macos-15\", \"macos-15-intel\"], windows: [\"windows-2025\"${arm:+, $arm}]}[.] // [] | .[]]")" >> "$GITHUB_OUTPUT"
          # cli-release's, each renting one machine: Linux, and one macOS and one Windows runner when selected.
          echo "release_runners=$(echo "$s" | jq -c '[.os[] | {linux: "ubuntu-24.04", macos: "macos-15", windows: "windows-2025"}[.] // empty]')" >> "$GITHUB_OUTPUT"
          { echo "### e2e selection: $REPO ${REF:0:12}"; echo '```'; echo "$s" | jq .; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "$s" | jq .

  # One candidate a job (e2e/candidates/build.sh), each this run's candidate-<what>-<commit> artifact for every Linux
  # suite: TensorD and TensorFS reused from an earlier run when one built the same sources, else built. A taken one
  # (its version) builds nothing.
  candidate:
    name: candidate ${{ matrix.what }}
    needs: affected
    if: needs.affected.outputs.linux == 'true'
    strategy:
      matrix:
        include:
          - { what: cozy, repo: cozy-creator, take: "${{ inputs.tensord || inputs.publish_run }}" }
          - { what: tensorfs, repo: cozy-creator, take: "${{ inputs.tensorfs }}" }
          - { what: runtime, repo: cozy-runtime, take: "${{ inputs.runtime }}" }
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs sends no signal.
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/${{ matrix.repo }}
          ref: ${{ needs.affected.outputs.repo == matrix.repo && needs.affected.outputs.ref || matrix.repo == 'cozy-runtime' && (inputs.runtime_ref || 'master') || (inputs.stack_ref || 'master') }}
          path: .build
          # The first-parent line build.sh walks back for a run that built the same sources.
          fetch-depth: ${{ matrix.what == 'runtime' && 1 || 30 }}
      - uses: astral-sh/setup-uv@v7
      # A dispatch on cozy-creator's master always builds: its Rust caches are the ones merge groups restore.
      - id: reuse
        if: matrix.what != 'runtime' && matrix.take == '' && !(github.repository == 'cozy-creator/cozy-creator' && github.ref == 'refs/heads/master')
        env:
          REUSE: 1
        run: bash .creator/e2e/candidates/build.sh ${{ matrix.what }} .build "$RUNNER_TEMP/candidates"
      - if: matrix.what != 'runtime' && matrix.take == '' && steps.reuse.outputs.name == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build -> target
          key: ${{ matrix.what }}
          # A merge group's cache is its own ref's, which nothing restores.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - id: build
        if: matrix.take == '' && steps.reuse.outputs.name == ''
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
          CARGO_INCREMENTAL: "0"
        run: bash .creator/e2e/candidates/build.sh ${{ matrix.what }} .build "$RUNNER_TEMP/candidates"
      - if: matrix.take == ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reuse.outputs.name || steps.build.outputs.name }}
          path: ${{ runner.temp }}/candidates
          if-no-files-found: error
          retention-days: 14

  # Linux, in shards (e2e/cli/run.sh --shard) on the candidate jobs' set; `e2e` checks coverage over all of them.
  cli:
    name: cli ${{ matrix.shard }}
    needs: [affected, candidate]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'cli')
    strategy:
      fail-fast: false
      matrix:
        shard: [runs, executors, commands, follow]
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: artifacts
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: cli suite
        env:
          PINS: ${{ inputs.pins }}
          GH_TOKEN: ${{ github.token }}
        # BiRefNet: a pin, the change's packages, or packages master (the set's own).
        run: bash .creator/e2e/cli/run.sh --out "$RUNNER_TEMP/e2e" --shard ${{ matrix.shard }} $CANDIDATES ${PINS:+--pins "$PINS"} $(case " $CANDIDATES " in (*" --packages "*) ;; (*) echo ${PACKAGES_MASTER:+--packages "$PACKAGES_MASTER"} ;; esac)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cli-linux-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # macOS (arm64, x64) and Windows, when selected: the whole suite on each runner, its cozy built there. These OSes run
  # no models themselves (platform::Os::local_inference): what needs no machine, and every local verb refused.
  cli-os:
    name: cli ${{ matrix.runner }}
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'cli') && needs.affected.outputs.runners != '[]'
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.affected.outputs.runners) }}
    runs-on: ${{ matrix.runner }}
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          stack_ref: ${{ inputs.stack_ref || 'master' }}
          runtime_ref: ${{ inputs.runtime_ref || 'master' }}
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: cli suite
        env:
          PINS: ${{ inputs.pins }}
          GH_TOKEN: ${{ github.token }}
        run: bash .creator/e2e/cli/run.sh --out "$RUNNER_TEMP/e2e" $CANDIDATES ${PINS:+--pins "$PINS"} $(case " $CANDIDATES " in (*" --packages "*) ;; (*) echo ${PACKAGES_MASTER:+--packages "$PACKAGES_MASTER"} ;; esac)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cli-${{ matrix.runner }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # cozy's signed-in commands, with the CI key: only where the release-gate environment admits the ref (master,
  # release branches), so a release (`--tokens release`) or a dispatch selects it, never a pull request.
  cli-release:
    name: cli-release ${{ matrix.runner }}
    needs: [affected, candidate]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'cli-release')
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(needs.affected.outputs.release_runners) }}
    runs-on: ${{ matrix.runner }}
    environment: release-gate
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          # Linux takes the candidate jobs' set; macOS and Windows build their cozy here.
          from: ${{ matrix.runner == 'ubuntu-24.04' && 'artifacts' || '' }}
          stack_ref: ${{ inputs.stack_ref || 'master' }}
          runtime_ref: ${{ inputs.runtime_ref || 'master' }}
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: cli-release suite
        env:
          KEY: ${{ secrets.COZY_CI_DEVICE_KEY }}
          SKU: ${{ inputs.sku }}
          QUOTE: ${{ inputs.quote && '1' || '' }}
        run: |
          [ -n "$KEY" ] || { echo "::error::the release-gate environment has no COZY_CI_DEVICE_KEY (release-gate/README.md)"; exit 1; }
          umask 077; printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          code=0; bash .creator/e2e/release/run.sh --out "$RUNNER_TEMP/e2e" --key "$RUNNER_TEMP/key.json" ${SKU:+--sku "$SKU"} ${QUOTE:+--quote} $CANDIDATES || code=$?
          rm -f "$RUNNER_TEMP/key.json"; exit $code
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cli-release-${{ matrix.runner }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  # In shards of every Nth package (e2e/imports/run.sh --shard K/N), on the candidate jobs' set.
  imports:
    name: imports ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: [affected, candidate]
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'imports')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - uses: ./.creator/e2e/candidates
        with:
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          from: artifacts
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: imports suite
        env:
          PINS: ${{ inputs.pins }}
          PUBLISHED: ${{ inputs.published && '1' || '' }}
        # The packages: the change's checkout, packages master, or (a release's dispatch) the published ones.
        run: bash .creator/e2e/imports/run.sh --out "$RUNNER_TEMP/e2e" --shard ${{ matrix.shard }}/${{ strategy.job-total }} $CANDIDATES ${PINS:+--pins "$PINS"} ${PUBLISHED:+--published} $(case " $CANDIDATES " in (*" --packages "*) ;; (*) echo ${PACKAGES_MASTER:+--packages "$PACKAGES_MASTER"} ;; esac)
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-imports-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  mps:
    needs: affected
    if: contains(fromJSON(needs.affected.outputs.selection).suites, 'mps')
    runs-on: macos-15
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The suites fail on the
    # CLI's typed errors and exits, never on time.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      BUILD: ${{ join(fromJSON(needs.affected.outputs.selection).build, ' ') }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - if: inputs.mps_cli_ref == '' && inputs.mps_tensorfs_run == ''
        uses: ./.creator/e2e/candidates
        with:
          repo: ${{ needs.affected.outputs.repo }}
          ref: ${{ needs.affected.outputs.ref }}
          build: ${{ env.BUILD }}
          stack_ref: ${{ inputs.stack_ref || 'master' }}
          runtime_ref: ${{ inputs.runtime_ref || 'master' }}
          tensord: ${{ inputs.tensord }}
          tensorfs: ${{ inputs.tensorfs }}
          runtime: ${{ inputs.runtime }}
          release: ${{ inputs.publish_run }}
      - name: mps suite
        if: inputs.mps_cli_ref == '' && inputs.mps_tensorfs_run == ''
        run: bash .creator/e2e/mps/run.sh --out "$RUNNER_TEMP/e2e" $CANDIDATES
      # Library proof only: the historical CLI is explicitly selected and never becomes a shipping default.
      - name: Verify the selected MPS library cohort
        if: inputs.mps_cli_ref != '' || inputs.mps_tensorfs_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CLI_REF: ${{ inputs.mps_cli_ref }}
          TFS_RUN: ${{ inputs.mps_tensorfs_run }}
          RT_REF: ${{ inputs.runtime_ref }}
        run: |
          test "$CLI_REF" = 7b5f6d86ce5c23c9add24b816039489b637f64b3
          test "$RT_REF" = 7d1e7854ca638c5d153c6601f2d2c2b169d0b133
          test "$TFS_RUN" = 40188308767
          mkdir -p "$RUNNER_TEMP/mps-library-inputs"
          gh api "repos/cozy-creator/cozy-creator/actions/runs/$TFS_RUN" > "$RUNNER_TEMP/mps-library-inputs/tensorfs-build.json"
          jq -e '.head_sha == "365bb9c9b831b8f39fecaeccf4bd4af07d275a30" and .path == ".github/workflows/tensorfs-publish.yaml"' "$RUNNER_TEMP/mps-library-inputs/tensorfs-build.json"
          gh api "repos/cozy-creator/cozy-creator/actions/runs/$TFS_RUN/jobs" --jq '.jobs[] | select(.name == "wheel macos-arm64") | .conclusion' | grep -qx success
      - if: inputs.mps_cli_ref != ''
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ inputs.mps_cli_ref }}
          path: .mps-cli
      - if: inputs.mps_cli_ref != ''
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-runtime
          ref: ${{ inputs.runtime_ref }}
          path: .mps-runtime
      - if: inputs.mps_cli_ref != ''
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/packages
          ref: a3755916454acff2e941644776f74c1e371766ca
          path: .mps-packages
      - if: inputs.mps_cli_ref != ''
        uses: astral-sh/setup-uv@v7
      - if: inputs.mps_cli_ref != ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .mps-cli -> target
          save-if: 'false'
      - if: inputs.mps_cli_ref != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: cozy-creator/cozy-creator
          run-id: ${{ inputs.mps_tensorfs_run }}
          name: wheel-macos-arm64
          path: ${{ runner.temp }}/mps-library-inputs/tensorfs
      - name: Build the historical CLI and current pure Runtime; verify the real Mac TensorFS file
        if: inputs.mps_cli_ref != ''
        env:
          CARGO_BUILD_JOBS: '2'
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
          CARGO_INCREMENTAL: '0'
        run: |
          test "$(git -C .mps-cli rev-parse HEAD)" = 7b5f6d86ce5c23c9add24b816039489b637f64b3
          test "$(git -C .mps-runtime rev-parse HEAD)" = 7d1e7854ca638c5d153c6601f2d2c2b169d0b133
          test "$(git -C .mps-packages rev-parse HEAD)" = a3755916454acff2e941644776f74c1e371766ca
          out=$RUNNER_TEMP/mps-library-inputs
          tfs=$out/tensorfs/tensorfs-0.15.8-cp311-abi3-macosx_11_0_arm64.whl
          printf '%s  %s\n' 1e46c7188adb17662278589eee839126e1c5d63986228456b0b65e82c85218df "$tfs" | shasum -a 256 --check
          bash .creator/e2e/candidates/build.sh cozy .mps-cli "$out" > /dev/null
          bash .creator/e2e/candidates/build.sh runtime .mps-runtime "$out" > /dev/null
          uv run --no-project --python 3.12 --with "$tfs" python - <<'PYCODE'
          import tensorfs
          from tensorfs import raw, varena
          assert tensorfs.__version__ == tensorfs._ext.__version__ == "0.15.8"
          assert callable(tensorfs.Writer.quantize) and tensorfs.ConversionControl().progress() == (0, 0, 0)
          assert callable(varena.Region.pin) and callable(varena.LoadSlot.encoded)
          encoded, stats = raw.quantize_measured("int8.convrot", bytes(256 * 4), dtype="F32", shape=(1, 256), strategy="int8-convrot256/1", params={"rotation": "kron_regular_h4", "rotation_size": 256})
          assert encoded.parts["weight"].nbytes == 256 and stats == {"amax": 0.0, "max_abs_error": 0.0, "sse": 0.0, "energy": 0.0, "saturated": 0}
          PYCODE
      - name: Real MPS library qualification through the historical ordinary CLI
        if: inputs.mps_cli_ref != ''
        run: |
          out=$RUNNER_TEMP/mps-library-inputs
          bash .mps-cli/e2e/mps/run.sh --out "$RUNNER_TEMP/e2e" \
            --tensord "$out/cozy" \
            --tensorfs "$out/tensorfs/tensorfs-0.15.8-cp311-abi3-macosx_11_0_arm64.whl" \
            --runtime "$out/cozy_runtime-0.32.3+dev.g7d1e7854-py3-none-any.whl" --packages .mps-packages
          python3 - "$RUNNER_TEMP/e2e" <<'PYCODE'
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          artifacts = json.loads((out / "candidate-artifacts.json").read_text())["artifacts"]
          records = [json.loads(line) for line in (out / "update.json").read_text().splitlines() if line.startswith('{"')]
          updates = [record["run"]["result"]["to"] for record in records if record.get("type") == "run.completed"]
          assert len(updates) == 1
          assert updates[0]["cozy"] == "0.11.17+dev.g7b5f6d86"
          for name in ("runtime", "tensorfs"):
              assert updates[0][name + "_sha256"] == artifacts[name]["sha256"]
          proof = {"scope": "Current libraries through historical Mac-capable CLI; not current CLI local shipping qualification", "cli_source": "7b5f6d86ce5c23c9add24b816039489b637f64b3", "runtime_source": "7d1e7854ca638c5d153c6601f2d2c2b169d0b133", "tensorfs_source": "365bb9c9b831b8f39fecaeccf4bd4af07d275a30", "tensorfs_run": 40188308767, "packages_source": "a3755916454acff2e941644776f74c1e371766ca", "artifacts": artifacts, "installed": updates[0]}
          (out / "library-cohort.json").write_text(json.dumps(proof, indent=2) + "\n")
          PYCODE
      - if: always() && inputs.mps_cli_ref != ''
        uses: actions/upload-artifact@v4
        with:
          name: mps-library-inputs
          path: ${{ runner.temp }}/mps-library-inputs/
          if-no-files-found: error
          retention-days: 14
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mps
          path: ${{ runner.temp }}/e2e
          retention-days: 14

  e2e:
    if: always()
    needs: [affected, candidate, cli, cli-os, cli-release, imports, mps]
    runs-on: ubuntu-24.04
    # Last resort (tracker design/stalls.md): a runner that hangs sends no signal.
    timeout-minutes: 10
    steps:
      # Coverage (e2e/coverage.py) over every cli shard's calls: each command and flag has a test, and each PR-tier one ran.
      # A taken TensorD is a release, not the CLI this checkout builds: no coverage.
      - if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == ''
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ needs.affected.outputs.creator }}
          path: .creator
      - if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-cli-linux-*
          path: ${{ runner.temp }}/cli
      - if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == ''
        uses: actions/download-artifact@v4
        with:
          pattern: candidate-cozy-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates
      - name: coverage
        if: (needs.cli.result == 'success' || needs.cli.result == 'failure') && inputs.tensord == '' && inputs.publish_run == ''
        run: |
          chmod +x "$RUNNER_TEMP/candidates/cozy"
          python3 -I .creator/e2e/coverage.py check "$RUNNER_TEMP/candidates/cozy" .creator/e2e/coverage.toml --tiers pr \
            $(printf -- '--log %s ' "$RUNNER_TEMP"/cli/*/argv.log) --source .creator/crates/cli/src
      - if: always()
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          ! echo "$NEEDS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null
