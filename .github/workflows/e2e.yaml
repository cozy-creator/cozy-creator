name: xs159 Mac scale ownership diagnostic
# Disposable branch only. Never merge this workflow; required e2e remains unchanged on release/default branches.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  mac-scale-diagnostic:
    if: github.ref == 'refs/heads/diag/xs159-mac-scale-memory'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          path: .diag
      - uses: actions/checkout@v5
        with:
          ref: 80077215ac26f2ac9337a7d4871327080d6d232a
          path: .creator
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/setup@v1
        with:
          package-json-file: .creator/web/app/package.json
          install: false
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: .creator/e2e/hubcheck/go.mod
          cache-dependency-path: .creator/e2e/hubcheck/go.sum
      - name: Verify and take the immutable repaired Mac candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidates"
          gh api repos/cozy-creator/cozy-creator/actions/artifacts/13778929547/zip > "$RUNNER_TEMP/candidate.zip"
          echo "68269b24926a7410563d8c4e35a3294854e1badea7e6e4d501e0dace52214bbb  $RUNNER_TEMP/candidate.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/candidate.zip" -d "$RUNNER_TEMP/candidates"
          test -f "$RUNNER_TEMP/candidates/cozy"
          chmod +x "$RUNNER_TEMP/candidates/cozy"
          "$RUNNER_TEMP/candidates/cozy" --version
          node .diag/e2e/diagnostics/prepare-mac-scale.cjs .creator > "$RUNNER_TEMP/diagnostic-provenance.json"
          node .diag/e2e/diagnostics/mac-scale-provenance.cjs "$RUNNER_TEMP/diagnostic-provenance.json"
      - name: Original scale case with summary-only ownership probes
        run: bash .diag/e2e/diagnostics/mac-scale-memory.sh 2>&1 | node .creator/e2e/publish/scrub.js
      - if: always()
        uses: ./.creator/e2e/publish
        with:
          name: xs159-mac-scale-memory-diagnostic
          path: ${{ runner.temp }}/scale-diag
          retention-days: 14
