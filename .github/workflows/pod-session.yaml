name: pod-session
# Rentals driven from a runner, so no laptop has to stay up for them: release-gate/sessions/<script>.sh rents its
# machines on tensorhub.com, does its work there and ends them (sessions/lib.sh; README.md: Sessions).
# The runner must provision an isolated qualification Hub; production credentials are not used. The pod renews its own run
# capability while its runs live (cl-675). A guard ends the pod at `cap` USD, all in. Without `rent`, the $0 pre-flight only:
# install, sign-in, the script's own checks, the quote and the guard. Dispatches never wait on or cancel each other:
# each session rents and ends its own pod. Dispatched from `rc/<x>`, or with `runtime_ref`, a session has that Runtime as a wheel in
# RUNTIME_WHEEL, as e2e builds it, for what no release knows yet.
#   gh workflow run pod-session.yaml -R cozy-creator/cozy-creator -f script=model-ingest -f packages_refs=pk=<sha> \
#     -f sku=a40 -f disk=500 -f cap=6 -f params='{"package": "qwen3.6", "sources": "…", "lanes": "int8", "version": "0.1.0"}'
on:
  workflow_dispatch:
    inputs:
      script:
        description: "A session in release-gate/sessions/, without .sh (its header lists its params)"
        type: string
        required: true
      packages_refs:
        description: "Space-separated name=ref pairs: each cozy-creator/packages commit or branch, checked out at packages/<name>"
        type: string
        default: ''
      sku:
        type: string
        required: true
      disk:
        description: "Disk GB"
        type: string
        required: true
      cap:
        description: "USD, GPU + disk + traffic: the guard ends the pod at it"
        type: string
        required: true
      params:
        description: "The script's own settings, a JSON object"
        type: string
        default: '{}'
      cozy:
        description: "cozy on the runner: released, a release tag or a dev-build run id"
        type: string
        default: released
      runtime_ref:
        description: "A cozy-runtime ref to build RUNTIME_WHEEL from (empty: its branch of this rc/<x>, if it has one)"
        type: string
        default: ''
      rent:
        description: "Rent and run; without it, the $0 pre-flight only"
        type: boolean
        default: false
run-name: pod-session ${{ inputs.script }} ${{ inputs.sku }}${{ inputs.rent && ' rent' || ' pre-flight' }}

jobs:
  session:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read  # a dev-build cozy
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/session
      COZY_HUB_URL: ${{ vars.COZY_TEST_HUB_URL }}
      COZY_TEST_HUB_ORIGIN: ${{ vars.COZY_TEST_HUB_ORIGIN }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            release-gate/sessions
            release-gate/ref
            release-gate/suites/tensord
            release-gate/suites/disk
            e2e/candidates
            e2e/test-hub.sh
            e2e/test_hub.py
            e2e/capabilities
            e2e/publish
            e2e/cli/project/boxed
          path: creator
      - name: Require isolated qualification environment
        run: |
          . creator/e2e/test-hub.sh
          require_ci_test_hub || { echo "::error::pod-session CI needs an isolated Hub and preallocated test machines; production is forbidden"; exit 2; }
      - uses: actions/checkout@v5
        if: inputs.packages_refs != ''
        with:
          repository: cozy-creator/packages
          fetch-depth: 0
          path: packages.git
      - uses: actions/checkout@v5
        if: inputs.script == 'bench'
        with:
          repository: cozy-creator/benchmarks
          ref: ${{ fromJSON(inputs.params).bench_ref || 'master' }}
          ssh-key: ${{ secrets.BENCHMARKS_READ_KEY }}
          path: benchmarks
      - name: Packages
        env:
          REFS: ${{ inputs.packages_refs }}
        run: |
          mkdir -p packages
          for pair in $REFS; do
            name=${pair%%=*} ref=${pair#*=}
            [[ $pair == *=* && $name =~ ^[A-Za-z0-9_-]+$ ]] || { echo "::error::packages_refs: '$pair' is not name=ref"; exit 1; }
            c=$(git -C packages.git rev-parse --verify -q "$ref^{commit}" || git -C packages.git rev-parse --verify -q "origin/$ref^{commit}") ||
              { echo "::error::packages has no $ref"; exit 1; }
            git -C packages.git worktree add -q --detach "$GITHUB_WORKSPACE/packages/$name" "$c"
            echo "packages/$name: $ref = $c"
          done
      - name: Install cozy
        env:
          COZY: ${{ inputs.cozy }}
        run: |
          bin=$HOME/.cozy/bin; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
          if [ "$COZY" = released ]; then
            curl -LsSf https://tensorhub.com/install.sh | sh
          elif [[ $COZY == v* ]]; then
            curl -LsSf "https://github.com/cozy-creator/cozy-creator/releases/download/$COZY/cozy-installer.sh" | sh
          else
            gh run download "$COZY" -R cozy-creator/cozy-creator -p 'cozy-*' -D dev
            install -m 0755 dev/cozy-*/cozy-linux-x86_64 "$bin/cozy"
          fi
          "$bin/cozy" --version
      - id: runtime
        env:
          ASKED: ${{ inputs.runtime_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ref=$ASKED
          if [ -z "$ref" ] && [[ $BRANCH == rc/* ]] && gh api "repos/cozy-creator/cozy-runtime/branches/$BRANCH" -q .name > /dev/null 2>&1; then ref=$BRANCH; fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.runtime.outputs.ref != ''
        with:
          repository: cozy-creator/cozy-runtime
          ref: ${{ steps.runtime.outputs.ref }}
          path: runtime.src
      - uses: astral-sh/setup-uv@v7
        if: steps.runtime.outputs.ref != ''
      - if: steps.runtime.outputs.ref != ''
        run: echo "RUNTIME_WHEEL=$(bash creator/e2e/candidates/build.sh runtime runtime.src "$RUNNER_TEMP/candidates")" >> "$GITHUB_ENV"
      - name: Prepare local service session
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus" >> "$GITHUB_ENV"
      - name: Session
        env:
          SCRIPT: ${{ inputs.script }}
          PACKAGES: ${{ github.workspace }}/packages
          BENCH: ${{ github.workspace }}/benchmarks
          REF: ${{ github.workspace }}/creator/release-gate/ref
          SKU: ${{ inputs.sku }}
          DISK: ${{ inputs.disk }}
          CAP: ${{ inputs.cap }}
          PARAMS: ${{ inputs.params }}
          RENT: ${{ inputs.rent }}
        run: |
          s=creator/release-gate/sessions
          [[ $SCRIPT =~ ^[a-z0-9-]+$ && $SCRIPT != lib && -f $s/$SCRIPT.sh ]] ||
            { echo "::error::no session $SCRIPT: $(ls $s | grep -vx lib.sh | sed 's/\.sh$//' | paste -sd,)"; exit 1; }
          jq -e 'type=="object"' <<<"$PARAMS" >/dev/null || { echo "::error::params is not a JSON object"; exit 1; }
          bash "$s/$SCRIPT.sh" 2>&1 | node creator/e2e/publish/scrub.js
      # The script's trap ends its rentals; a cancelled job can skip it, so end them here too and say so.
      - if: always()
        run: |
          [ -f "$OUT/rental" ] || exit 0
          . creator/e2e/test-hub.sh
          require_ci_test_hub || exit 2
          . creator/release-gate/machines.sh
          left=0
          while read -r rid; do
            for _ in $(seq 1 30); do
              listed "$rid" || { echo "$rid is gone"; continue 2; }
              cozy machine end "$rid" -y < /dev/null || true; sleep 10
            done
            echo "::error::$rid is still listed, or no machine listing answered: end it by hand (cozy machine end $rid)"; left=1
          done < "$OUT/rental"
          exit $left
      - if: always()
        uses: ./creator/e2e/publish
        with:
          name: session-${{ inputs.script }}-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore
          retention-days: 30
