name: release-gate
# CI v2 release gate (tracker design ci-v2 §3): every selected first-party model runs for real on fresh rentals and is
# held against the SKU's last PASS (release-gate/gate.sh, analyze.py). Release testing is manual (Paul 10-24): only the
# release agent dispatches it, with the suites it chose for the candidate set, and its passing run id is what a
# promotion requires (release-gate/promote.sh). No workflow calls it. Packages run from source at `packages_ref`: nothing
# untested is published (Paul 11-13); suite `publish` puts them through the Hub-publish path on a throwaway Hub.
#   gh workflow run release-gate.yml -R cozy-creator/cozy-creator -f hub=prod -f suites=runtime,packages,publish -f cozy=v0.12.0 -f runtime_wheel=https://…#sha256=… -f packages_ref=<packages commit>
# Every dispatch names its Hub (`hub`): `prod`, where real pods rent (Paul, 11-11: two Hubs, production and the laptop's), signed in
# with the CI device key (environment release-gate, which only master, rc/*, tensorfs-v* and release/* may use), or `isolated`,
# a verified test Hub (vars.COZY_TEST_HUB_URL). Synthetic publication always runs on its own disposable Hub (hub-fixture).
on:
  workflow_dispatch:
    inputs:
      suites:
        description: "Comma-separated suites (release-gate/README.md): the release agent picks them; there is no default"
        type: string
        required: true
      hub:
        description: "The Hub the gates rent on: prod (tensorhub.com, the CI device key) or isolated (a verified test Hub)"
        type: choice
        options: [prod, isolated]
        required: true
      cozy:
        description: "cozy on the runner and the machine: released (the Hub's target), a release tag (v0.12.0) or a dev-build run id"
        type: string
        default: released
      hub_ref:
        description: "TensorHub source for isolated publication tests when the hub suite is selected"
        type: string
        default: master
      runtime_wheel:
        description: "Candidate Runtime wheel: https://…/<wheel>#sha256=<hex>, artifact:[<run id>/]<name> of this run or another of this repo's, or a cozy-runtime dev-build run id (empty: the Hub's target)"
        type: string
        default: ''
      tensorfs_wheel:
        description: "Candidate TensorFS wheel, as runtime_wheel"
        type: string
        default: ''
      packages_ref:
        description: "A cozy-creator/packages commit whose packages run from source, with their Triton sets, in place of the published ones"
        type: string
        default: ''
      models:
        description: "Held private model releases the set uses, org/name@version,…: the promotion makes them public"
        type: string
        default: ''
      skus:
        description: "Comma-separated SKUs (empty: by selection)"
        type: string
        default: ''
      gpus:
        description: "Exact GPUs per rental (empty: keep each suite's selection)"
        type: string
        default: ''
      disk:
        description: "Container disk GB per rental (empty: each suite's selection, else gate.sh's 400)"
        type: string
        default: ''
      cap_minutes:
        description: "The job's hard stop in minutes, the cap no computer has to watch (empty: 300)"
        type: string
        default: ''
      only:
        description: "Comma-separated cells or packages (empty: by selection)"
        type: string
        default: ''
      cells:
        description: "Optional existing --cells hook: a .sh or .tsv file under release-gate/ in this checkout"
        type: string
        default: ''
      group:
        description: "Suite bench's group (suites/bench/skus, matrix-skus) when it is not <sku>x<gpus>, e.g. rtx-4090x1.matrixh3"
        type: string
        default: ''
      corpus:
        description: "Suite attention's corpus: the release-gate run id whose attention-corpus gate captured it (empty: synthetic)"
        type: string
        default: ''
      establish:
        description: "Start the baseline of a SKU that has none"
        type: boolean
        default: false
      publish:
        description: "Publish a PASS as the SKU's new baseline"
        type: boolean
        default: true
      seeds:
        description: "Replay: the first seed of a logged gate (its \"seeds from <n>\" line; empty: fresh)"
        type: string
        default: ''
      scenario:
        description: "Replay: the scenario of a logged gate (its \"scenario <name>\"; empty: by time)"
        type: string
        default: ''
      nonce:
        description: "Caller's id, shown in the run name"
        type: string
        default: ''
run-name: release-gate ${{ inputs.hub }} ${{ inputs.cozy }} ${{ inputs.runtime_wheel }} ${{ inputs.tensorfs_wheel }} ${{ inputs.packages_ref }} ${{ inputs.nonce }}

# Only the baseline job writes (contents: write).
jobs:
  select:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      hub_fixture: ${{ steps.select.outputs.hub_fixture }}
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ github.repository == 'cozy-creator/cozy-creator' && github.sha || 'master' }}
          path: creator
      - id: select
        env:
          SUITES: ${{ inputs.suites }}
          SKUS: ${{ inputs.skus }}
          GPUS: ${{ inputs.gpus }}
          DISK: ${{ inputs.disk }}
          CELLS: ${{ inputs.cells }}
          PACKAGES_REF: ${{ inputs.packages_ref }}
        run: |
          # One job per SKU, running every chosen suite whose `skus` (`<sku> [disk GB] [gpus]` per line) names it;
          # `skus` gives every chosen suite those SKUs instead. key names the job's baseline, gate-<sku>-<key>.json.
          d=creator/release-gate/suites
          [ -n "$SUITES" ] || { echo "::error::pick suites: $(ls $d | paste -sd, -) (release-gate/README.md)"; exit 1; }
          [ -z "$GPUS" ] || [[ "$GPUS" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::gpus must be a positive integer or empty"; exit 1; }
          [ -z "$DISK" ] || [[ "$DISK" =~ ^[1-9][0-9]*$ ]] \
            || { echo "::error::disk must be a positive integer (GB) or empty"; exit 1; }
          if [ -n "$CELLS" ]; then
            case "$CELLS" in release-gate/*.sh | release-gate/*.tsv) ;; *) echo "::error::cells must name a release-gate .sh or .tsv file"; exit 1 ;; esac
            hook=$(realpath -e -- "creator/$CELLS") || exit 1
            [[ "$hook" == "$PWD/creator/release-gate/"* && -f "$hook" ]] \
              || { echo "::error::cells must stay inside this checkout's release-gate directory"; exit 1; }
          fi
          rows=()
          for s in ${SUITES//,/ }; do
            [ -f "$d/$s/cells.sh" ] || { echo "::error::no suite $s: $(ls $d | paste -sd, -)"; exit 1; }
            if [ -n "$SKUS" ]; then for k in ${SKUS//,/ }; do rows+=("$k 0 0 $s"); done; continue; fi
            while read -r k disk gpus; do [ -z "$k" ] || rows+=("$k ${disk:-0} ${gpus:-0} $s"); done < <(sed 's/#.*//' "$d/$s/skus")
          done
          matrix=$(printf '%s\n' "${rows[@]}" | jq -Rsc '[split("\n")[] | select(. != "") | split(" ") | map(select(. != ""))]
            | group_by(.[0]) | map((reduce map(.[3])[] as $s ([]; if index([$s]) then . else . + [$s] end)) as $suites
              | {sku: .[0][0], disk: (map(.[1] | tonumber) | max), gpus: (map(.[2] | tonumber) | max),
                 suite: ($suites | join(",")), key: ($suites | join("-"))})')
          [ -z "$GPUS" ] || matrix=$(jq -c --argjson gpus "$GPUS" 'map(.gpus = $gpus)' <<< "$matrix")
          [ -z "$DISK" ] || matrix=$(jq -c --argjson disk "$DISK" 'map(.disk = $disk)' <<< "$matrix")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if jq -e 'any(.[]; (.suite | split(",") | index("hub")) != null)' <<< "$matrix" > /dev/null; then echo "hub_fixture=true" >> "$GITHUB_OUTPUT"; else echo "hub_fixture=false" >> "$GITHUB_OUTPUT"; fi
          if [[ ,$SUITES, == *,publish,* ]]; then
            [ -n "$PACKAGES_REF" ] || { echo "::error::suite publish publishes packages_ref's candidates: give packages_ref"; exit 1; }
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else echo "publish=false" >> "$GITHUB_OUTPUT"; fi
          echo "gates: $(jq -r 'map(.sku + " (" + .suite + ")") | join(", ")' <<< "$matrix")"

  # Publication tests have their own database, object store and development account.
  # This job receives no production device key and creates no production repositories.
  # Suite publish (xs-194): packages_ref's candidates published to a throwaway Hub as the promotion publishes them, then
  # installed and one function run from it (release-gate/suites/publish/run.sh).
  hub-fixture:
    needs: select
    if: needs.select.outputs.hub_fixture == 'true' || needs.select.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ github.repository == 'cozy-creator/cozy-creator' && github.sha || 'master' }}
          path: creator
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/tensorhub
          ref: ${{ inputs.hub_ref }}
          ssh-key: ${{ secrets.TENSORHUB_READ_KEY }}
          persist-credentials: false
          path: tensorhub
      - uses: actions/setup-go@v5
        with:
          go-version-file: tensorhub/go.mod
          cache-dependency-path: tensorhub/go.sum
      - uses: astral-sh/setup-uv@v7
      - if: needs.select.outputs.publish == 'true'
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/packages
          ref: ${{ inputs.packages_ref }}
          path: packages
      - if: needs.select.outputs.publish == 'true'
        uses: arduino/setup-task@v2
        with:
          repo-token: ${{ github.token }}
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/skew-tools
          key: skew-minio-RELEASE.2025-09-07T16-13-09Z
      - name: Prepare candidate CLI
        env:
          GH_TOKEN: ${{ github.token }}
          COZY: ${{ inputs.cozy }}
          RUNTIME_WHEEL: ${{ inputs.runtime_wheel }}
          TENSORFS_WHEEL: ${{ inputs.tensorfs_wheel }}
        run: |
          set -euo pipefail
          if [ "$COZY" = released ]; then
            curl -LsSf https://tensorhub.com/install.sh | sh
            cp "$HOME/.cozy/bin/cozy" "$RUNNER_TEMP/cozy-candidate"
          elif [[ "$COZY" == v* ]]; then
            curl -LsSf "https://github.com/cozy-creator/cozy-creator/releases/download/$COZY/cozy-installer.sh" | sh
            cp "$HOME/.cozy/bin/cozy" "$RUNNER_TEMP/cozy-candidate"
          else
            gh run download "$COZY" -R cozy-creator/cozy-creator -p 'cozy-*' -D dev
            install -m 0755 dev/cozy-*/cozy-linux-x86_64 "$RUNNER_TEMP/cozy-candidate"
          fi
          : > "$RUNNER_TEMP/hub-fixture-args.txt"
          for item in "runtime|$RUNTIME_WHEEL|cozy_runtime" "tensorfs|$TENSORFS_WHEEL|tensorfs"; do
            IFS='|' read -r flag value distribution <<< "$item"
            [ -n "$value" ] || continue
            if [ "$flag" = runtime ] && [[ "$value" =~ ^[0-9]+$ ]]; then  # a cozy-runtime dev-build run: its x86_64 wheel
              gh run download "$value" -R cozy-creator/cozy-runtime -p 'cozy-runtime-*' -D "wheel-$flag"
              value=$(find "$PWD/wheel-$flag" -type f -name "$distribution-*manylinux*x86_64*.whl" -print -quit)
              [ -n "$value" ] || { echo "::error::cozy-runtime dev-build $RUNTIME_WHEEL has no x86_64 wheel"; exit 1; }
            elif [[ "$value" == artifact:* ]]; then
              artifact=${value#artifact:}; run=$GITHUB_RUN_ID
              if [[ "$artifact" == */* ]]; then run=${artifact%%/*}; artifact=${artifact#*/}; fi
              gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$artifact" -D "wheel-$flag"
              value=$(find "$PWD/wheel-$flag" -type f -name "$distribution-*.whl" -print -quit)
              [ -n "$value" ] || { echo "::error::candidate $distribution wheel is missing"; exit 1; }
            fi
            printf '%s\n' "--$flag" "$value" >> "$RUNNER_TEMP/hub-fixture-args.txt"
          done
      - name: Isolated Hub publication checks
        if: needs.select.outputs.hub_fixture == 'true'
        env:
          SKEW_TOOLS: ${{ runner.temp }}/skew-tools
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          mapfile -t args < "$RUNNER_TEMP/hub-fixture-args.txt"
          bash creator/e2e/skew/run.sh --hub-src tensorhub --cozy-bin "$RUNNER_TEMP/cozy-candidate" --out "$RUNNER_TEMP/hub-fixture" "${args[@]}"
      - name: Candidate packages through a throwaway Hub
        if: ${{ !cancelled() && needs.select.outputs.publish == 'true' }}
        env:
          SKEW_TOOLS: ${{ runner.temp }}/skew-tools
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          mapfile -t args < "$RUNNER_TEMP/hub-fixture-args.txt"
          bash creator/e2e/skew/run.sh --hub-src tensorhub --cozy-bin "$RUNNER_TEMP/cozy-candidate" --admin --out "$RUNNER_TEMP/publish" "${args[@]}" \
            --command creator/release-gate/suites/publish/run.sh -- "$GITHUB_WORKSPACE/packages" "$ONLY"
      - if: always()
        uses: ./creator/e2e/publish
        with:
          name: hub-fixture
          path: ${{ runner.temp }}/hub-fixture
          retention-days: 14
      - if: always() && needs.select.outputs.publish == 'true'
        uses: ./creator/e2e/publish
        with:
          name: publish
          path: ${{ runner.temp }}/publish
          retention-days: 14

  # Suite checkpoints (xs-183): every published checkpoint's headers against what its tool reads. No rental, signed out.
  checkpoints:
    needs: select
    if: ${{ contains(format(',{0},', inputs.suites), ',checkpoints,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # a dev-build cozy
    env:
      GH_TOKEN: ${{ github.token }}
      COZY_HUB_URL: ${{ inputs.hub == 'isolated' && vars.COZY_TEST_HUB_URL || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ github.repository == 'cozy-creator/cozy-creator' && github.sha || 'master' }}
          path: creator
      - env:
          COZY: ${{ inputs.cozy }}
        run: |
          set -euo pipefail
          if [ "$COZY" = released ]; then
            curl -LsSf https://tensorhub.com/install.sh | sh
          elif [[ "$COZY" == v* ]]; then
            curl -LsSf "https://github.com/cozy-creator/cozy-creator/releases/download/$COZY/cozy-installer.sh" | sh
          else
            gh run download "$COZY" -R cozy-creator/cozy-creator -p 'cozy-*' -D dev
            mkdir -p "$HOME/.cozy/bin" && install -m 0755 dev/cozy-*/cozy-linux-x86_64 "$HOME/.cozy/bin/cozy"
          fi
          mkdir -p "$RUNNER_TEMP/checkpoints"
          python3 -I creator/release-gate/suites/checkpoints/walk.py --cli "$HOME/.cozy/bin/cozy" --out "$RUNNER_TEMP/checkpoints" \
            | tee "$RUNNER_TEMP/checkpoints/walk.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoints
          path: ${{ runner.temp }}/checkpoints
          if-no-files-found: ignore
          retention-days: 30

  gate:
    needs: select
    if: ${{ needs.select.outputs.matrix != '[]' }}
    name: gate ${{ matrix.sku }} ${{ matrix.suite }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-24.04
    environment: release-gate
    permissions:
      contents: read
      actions: read  # a dev-build cozy, a wheel artifact of this run
      statuses: write  # gate.sh's heartbeat
    # A publishing gate waits for the SKU and suite's other publishing gate (their baseline). Every other gate rents its
    # own pod and runs on its own, so a newer dispatch never cancels another's queued gate.
    concurrency:
      group: release-gate-${{ matrix.sku }}-${{ matrix.key }}${{ !inputs.publish && format('-{0}', github.run_id) || '' }}
      cancel-in-progress: false
    # Last resort (tracker design/stalls.md): a runner that hangs or dies sends no signal. The gate fails on the CLI's
    # typed errors and exits, and on a run that stops moving (gate.sh `hold`), never on time; H3 at the product shape on a
    # cold machine is the long cell.
    timeout-minutes: ${{ fromJSON(inputs.cap_minutes || '300') }}
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      OUT: ${{ github.workspace }}/gate
      HUB: ${{ inputs.hub }}
      COZY_HUB_URL: ${{ inputs.hub == 'isolated' && vars.COZY_TEST_HUB_URL || '' }}
      COZY_TEST_HUB_ORIGIN: ${{ inputs.hub == 'isolated' && vars.COZY_TEST_HUB_ORIGIN || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-creator
          ref: ${{ github.repository == 'cozy-creator/cozy-creator' && github.sha || 'master' }}
          path: creator
      - name: The Hub this gate rents on
        run: |
          . creator/e2e/test-hub.sh
          require_ci_rental_hub "$HUB" || exit 2
          echo "### Hub: $HUB (${COZY_HUB_URL:-https://tensorhub.com})" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ inputs.packages_ref != '' }}
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/packages
          ref: ${{ inputs.packages_ref }}
          path: packages
      - uses: astral-sh/setup-uv@v7
      # e2e/hubcheck, which the hub suite sends its contract calls through.
      - uses: actions/setup-go@v5
        with:
          go-version-file: creator/e2e/hubcheck/go.mod
          cache-dependency-path: creator/e2e/hubcheck/go.sum
      # ffmpeg and ffprobe for the H3 and SeedVR2 cells, from the tool cache (apt took 34 min).
      - uses: AnimMouse/setup-ffmpeg@v1
      - id: candidate
        env:
          COZY: ${{ inputs.cozy }}
          RUNTIME_WHEEL: ${{ inputs.runtime_wheel }}
          TENSORFS_WHEEL: ${{ inputs.tensorfs_wheel }}
        run: |
          bin=$HOME/.cozy/bin; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"
          args=()
          if [ "$COZY" = released ]; then
            curl -LsSf https://tensorhub.com/install.sh | sh
          elif [[ $COZY == v* ]]; then
            # A release tag, a prerelease candidate's too: its binary is this runner's cozy and the pod's TensorD.
            curl -LsSf "https://github.com/cozy-creator/cozy-creator/releases/download/$COZY/cozy-installer.sh" | sh
            args+=(--tensord "$bin/cozy")
          else
            gh run download "$COZY" -R cozy-creator/cozy-creator -p 'cozy-*' -D dev
            install -m 0755 dev/cozy-*/cozy-linux-x86_64 "$bin/cozy"; args+=(--tensord "$bin/cozy")
          fi
          # A wheel is a URL#sha256 the gate fetches and checks, an artifact of this run or of another run of this repo
          # (e2e's candidate-runtime-*, dev-build's tensorfs-wheel-*): artifact:<run id>/<name>, or for the Runtime a
          # cozy-runtime dev-build run id (its release files, kernels built: cozy-runtime-<sha>).
          for w in "runtime-wheel|$RUNTIME_WHEEL|cozy_runtime" "tensorfs-wheel|$TENSORFS_WHEEL|tensorfs"; do
            IFS="|" read -r flag value dist <<< "$w"
            [[ $flag != runtime-wheel || ! $value =~ ^[0-9]+$ ]] || value=dev-build:$value
            case $value in
              '') ;;
              dev-build:*)
                gh run download "${value#dev-build:}" -R cozy-creator/cozy-runtime -p 'cozy-runtime-*' -D "wheels-$flag"
                f=$(find "wheels-$flag" -type f -name "$dist-*manylinux*x86_64*.whl" -print -quit)
                [ -n "$f" ] || { echo "::error::cozy-runtime dev-build ${value#dev-build:} has no x86_64 wheel"; exit 1; }
                args+=("--$flag" "$PWD/$f") ;;
              artifact:*)
                name=${value#artifact:} run=$GITHUB_RUN_ID
                [[ $name != */* ]] || { run=${name%%/*}; name=${name#*/}; }
                gh run download "$run" -R "$GITHUB_REPOSITORY" -n "$name" -D "wheels-$flag"
                # One of the two globs matches: ls exits 2 for the other, which pipefail would make the step's.
                f=$(ls "wheels-$flag/$dist"-*manylinux*x86_64*.whl "wheels-$flag/$dist"-*-py3-none-any.whl 2>/dev/null | head -1 || true)
                [ -n "$f" ] || { echo "::error::no $dist x86_64 wheel in artifact $value"; exit 1; }
                args+=("--$flag" "$PWD/$f") ;;
              *) args+=("--$flag" "$value") ;;
            esac
          done
          "$bin/cozy" --version
          echo "args=${args[*]}" >> "$GITHUB_OUTPUT"
      - name: Prepare local service session
        env:
          KEY: ${{ inputs.hub == 'prod' && secrets.COZY_CI_DEVICE_KEY || '' }}
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus" >> "$GITHUB_ENV"
          [ "$HUB" = prod ] || exit 0
          # Production: the CI account, by its device key (release-gate/README.md, CI sign-in).
          export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          [ -n "$KEY" ] || { echo "::error::the release-gate environment has no COZY_CI_DEVICE_KEY"; exit 1; }
          umask 077; printf '%s' "$KEY" > "$RUNNER_TEMP/key.json"
          cozy login --key "$RUNNER_TEMP/key.json"; code=$?
          rm -f "$RUNNER_TEMP/key.json"
          exit $code
      # Suite bench's ComfyUI column: the private benchmarks runner at the commit comfyui.sh pins, by its deploy key.
      - id: benchmarks
        if: ${{ contains(inputs.cells, 'comfyui.sh') }}
        run: echo "at=$(sed -n 's/.*BENCHMARKS_AT=\([0-9a-f]\{40\}\).*/\1/p' creator/release-gate/suites/bench/comfyui.sh)" >> "$GITHUB_OUTPUT"
      - if: ${{ contains(inputs.cells, 'comfyui.sh') }}
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/benchmarks
          ref: ${{ steps.benchmarks.outputs.at }}
          ssh-key: ${{ secrets.BENCHMARKS_READ_KEY }}
          path: benchmarks
      - name: Gate ${{ matrix.sku }} (${{ matrix.suite }})
        env:
          ARGS: ${{ steps.candidate.outputs.args }}
          ONLY: ${{ inputs.only }}
          CELLS: ${{ inputs.cells }}
          GROUP: ${{ inputs.group }}
          CORPUS: ${{ inputs.corpus }}
          BENCHMARKS_DIR: ${{ github.workspace }}/benchmarks
          ESTABLISH: ${{ inputs.establish }}
          PACKAGES: ${{ inputs.packages_ref != '' && 'packages' || '' }}
          MODELS: ${{ inputs.models }}
          DISK: ${{ matrix.disk }}
          GPUS: ${{ matrix.gpus }}
          SEEDS: ${{ inputs.seeds }}
          SCENARIO: ${{ inputs.scenario }}
          CAP: ${{ inputs.cap_minutes || '300' }}
        run: |
          read -ra args <<< "$ARGS"
          [ -z "$ONLY" ] || args+=(--only "$ONLY")
          [ -z "$CELLS" ] || args+=(--cells "$PWD/creator/$CELLS")
          [ -z "$GROUP" ] || args+=(--group "$GROUP")
          [ -z "$CORPUS" ] || args+=(--corpus "$CORPUS")
          [ -z "$MODELS" ] || args+=(--models "$MODELS")
          [ -z "$PACKAGES" ] || args+=(--packages "$PACKAGES")
          [ "$ESTABLISH" != true ] || args+=(--establish)
          [ "$DISK" = 0 ] || args+=(--disk "$DISK")
          [ "$GPUS" = 0 ] || args+=(--gpus "$GPUS")
          [ -z "$SEEDS" ] || args+=(--seeds "$SEEDS")
          [ -z "$SCENARIO" ] || args+=(--scenario "$SCENARIO")
          if [[ ",${{ matrix.suite }}," == *,cli,* ]]; then  # every call logged, for the gate tier's coverage check below
            args+=(--cli "$PWD/creator/e2e/bin/cozy")
            export COZY_E2E_LOG=$OUT/argv.log COZY_E2E_BIN=$HOME/.cozy/bin/cozy
          fi
          creator/release-gate/gate.sh "${{ matrix.sku }}" --suite "${{ matrix.suite }}" --hub "$HUB" --out "$OUT" --cap "$CAP" "${args[@]}"
      # Suite bench's ComfyUI column against Cozy's, then sealed for the owner with every file holding ComfyUI's numbers
      # (seal.sh: a public repo's artifacts are public, Paul 11-10).
      - if: ${{ always() && contains(inputs.cells, 'comfyui.sh') }}
        run: |
          [ -d "$OUT" ] || exit 0
          [ ! -f "$OUT/comfyui-rows.json" ] || uv run -q --no-project --with numpy python -I creator/release-gate/bench.py versus "$OUT" > "$OUT/comfyui.md" 2>&1 || true
          bash creator/release-gate/suites/bench/seal.sh "$OUT"
      # Every gate-tier command and flag ran (e2e/coverage.py), in the gate that ran the cli suite.
      - if: ${{ !cancelled() && contains(format(',{0},', matrix.suite), ',cli,') }}
        run: uv run -q --no-project python -I creator/e2e/coverage.py check "$HOME/.cozy/bin/cozy" creator/e2e/coverage.toml --tiers gate --log "$OUT/argv.log" --source creator/crates/cli/src
      # gate.sh ends its rental in a trap; a cancelled job can skip it, so end it here too and say so. gate.sh writes
      # the rental id to $OUT/rental as soon as the order names it, booting or not.
      - if: always()
        run: |
          r=$(cat "$OUT/rental" 2>/dev/null) || exit 0
          . creator/e2e/test-hub.sh
          require_ci_rental_hub "$HUB" || exit 2
          . creator/release-gate/machines.sh
          # A cap ends the job with its cell still running, and the pod's logs leave with the pod.
          if listed "$r"; then
            for log in memory tensord; do
              if timeout 60 cozy machine logs "$r" "$log" -n 0 > "$OUT/machine-$log.log.new" 2>&1; then mv -f "$OUT/machine-$log.log.new" "$OUT/machine-$log.log"; else rm -f "$OUT/machine-$log.log.new"; fi
            done
          fi
          for _ in $(seq 1 30); do
            listed "$r" || { echo "$r is gone"; exit 0; }
            cozy machine end "$r" -y || true; sleep 10
          done
          echo "::error::$r is still listed, or no machine listing answered: end it by hand (cozy machine end $r)"; exit 1
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.sku }}-${{ matrix.key }}
          path: ${{ env.OUT }}
          if-no-files-found: ignore
          retention-days: 30

  # A passed SKU's numbers and references become its baseline.
  baseline:
    needs: [gate, hub-fixture]
    if: ${{ always() && inputs.publish && github.repository == 'cozy-creator/cozy-creator' && needs.gate.result != 'skipped' && (needs['hub-fixture'].result == 'success' || needs['hub-fixture'].result == 'skipped') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: gate-*
          path: gates
      - run: |
          # One artifact lands in gates/ itself, several each in gates/gate-<key>/: every gate dir names its key.
          for v in $(find gates -name verdict.txt); do
            d=$(dirname "$v") sku=$(cat "$(dirname "$v")/baseline-key" 2>/dev/null)
            [ -n "$sku" ] || { echo "$d: no baseline-key"; continue; }
            grep -s '^VERDICT' "$v" || { echo "$sku: no verdict"; continue; }
            release-gate/publish.sh "$d" "$sku" || true
          done
