name: dev-build
# Builds dev artifacts for any ref, off the dev box:
#   gh workflow run dev-build.yaml -R cozy-creator/cozy-creator -f ref=<sha> -f build=cozy,tensord,tensorfs
# Artifacts: cozy-<sha> (the runner arch's dev `cozy`, <version>+dev.g<sha8>, which `cozy machine update --tensord <path>`
# runs on any machine: `ghbuild.sh cozy <ref> cozy`, `-r ubuntu-24.04-arm` for arm64), tensord-<sha> (the runner arch's
# `tensord`, the machine role TensorD's and Calcifer's tests run, from the same build and stamp), tensorfs-kernels-<sha>
# and tensorfs-wheel-<sha> (the manylinux x86_64 wheel). The jobs run side by side. The cozy binary's release archives
# are dist's (cozy-publish.yaml).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
      build:
        description: "cozy: dev binary; tensord: manylinux binary; tensorfs: wheel; kernels: CUDA AOT; check: native Rust compilation only; vault-provider: real encrypted filesystem/media/crash proof (comma-separate several)"
        type: string
        default: cozy
      features:
        description: "Cargo features of the cozy and tensord builds"
        type: string
        default: ''
      runner:
        description: A standard runner, free on this public repo
        type: choice
        options: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-26]
        default: ubuntu-latest
      billed_runner:
        description: "A larger runner, named on purpose in place of runner. Never free (linux-x64-16core: $0.042/min, $2.52 a 60-min job) and the budget is about $10/day per org"
        type: string
        default: ''
      nonce:
        description: Caller's id, shown in the run name so the caller can find its run
        type: string
        default: ''
run-name: dev-build ${{ inputs.ref }} ${{ inputs.build }} ${{ inputs.nonce }}

permissions:
  contents: read

jobs:
  # cozy and tensord: one manylinux_2_28 build, dist's, so both run on every pod.
  rust:
    if: contains(inputs.build, 'cozy') || contains(inputs.build, 'tensord')
    runs-on: ${{ inputs.billed_runner || inputs.runner }}
    defaults:
      run:
        shell: bash
    # Hang bound, not a work budget.
    timeout-minutes: 60
    steps:
      - if: ${{ inputs.billed_runner != '' }}
        env:
          RUNNER: ${{ inputs.billed_runner }}
        run: echo "::warning::billed runner $RUNNER, never free; the budget is about \$10/day per org, and October passed it on 10-17 and 10-22 with these runs"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Saved by a build with cozy, so it holds every dependency. The container keeps its toolchain under
      # target/manylinux/rustup, which never goes to the cache.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target/manylinux
          save-if: ${{ contains(inputs.build, 'cozy') }}
      # The page the dev cozy's Calcifer embeds, built here: the container below mounts the checkout read-only. A ref
      # from before web/app has none.
      - uses: actions/setup-node@v4
        if: contains(inputs.build, 'cozy') && hashFiles('web/app/package.json') != ''
        with:
          node-version: 24
      - uses: pnpm/setup@v1
        if: contains(inputs.build, 'cozy') && hashFiles('web/app/package.json') != ''
        with:
          package-json-file: web/app/package.json
          install: false
      - name: Build the page
        if: contains(inputs.build, 'cozy') && hashFiles('web/app/package.json') != ''
        run: web/build.sh
      # Both stamped <version>+dev.g<sha8> with their commit. Both packages are selected whichever binaries are asked
      # for, so every build resolves cozy's features and the cache holds one set of dependencies.
      - name: Build cozy and tensord
        env:
          BUILD: ${{ inputs.build }}
          FEATURES: ${{ inputs.features }}
        run: |
          sha=$(git rev-parse HEAD) arch=$(uname -m) target=$PWD/target/manylinux bins=()
          [[ $BUILD != *cozy* ]] || bins+=(--bin cozy)
          [[ $BUILD != *tensord* ]] || bins+=(--bin tensord)
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          cargo fetch --locked
          sed -i "0,/^version = \"$version\"$/s//version = \"$version+dev.g${sha:0:8}\"/" Cargo.toml
          cargo update -w --offline
          rm -rf "$target/rustup" && mkdir -p "$target" dist/cozy dist/tensord
          docker run --rm -e CARGO_BUILD_JOBS="$(nproc)" --user "$(id -u):$(id -g)" -e HOME=/tmp -e RUSTUP_HOME=/target/rustup -e COZY_COMMIT="$sha" -e FEATURES \
            -v "$HOME/.cargo/registry:/cargo/registry" -v "$HOME/.cargo/git:/cargo/git" -v "$PWD:/src:ro" -v "$target:/target" -w /src \
            "quay.io/pypa/manylinux_2_28_$arch:2026.10.03-1" \
            sh -c 'curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain 1.99.1 >&2 && PATH=/tmp/.cargo/bin:$PATH CARGO_HOME=/cargo cargo build --release --locked --offline --target-dir /target -p cozy -p tensord --features "$FEATURES" "$@"' sh "${bins[@]}"
          rm -rf "$target/rustup" && git checkout -- Cargo.toml Cargo.lock
          if [[ $BUILD == *cozy* ]]; then
            install -m 0755 "$target/release/cozy" "dist/cozy/cozy-linux-$arch"
            (cd dist/cozy && sha256sum "cozy-linux-$arch" > "cozy-linux-$arch.sha256")
            said=$("dist/cozy/cozy-linux-$arch" --version)
            case $said in *"+dev.g${sha:0:8}") echo "$said" ;; *) echo "::error::the dev cozy says $said"; exit 1 ;; esac
          fi
          if [[ $BUILD == *tensord* ]]; then
            install -m 0755 "$target/release/tensord" "dist/tensord/tensord-linux-$arch"
            "dist/tensord/tensord-linux-$arch" version --json
          fi
      - if: contains(inputs.build, 'cozy')
        uses: actions/upload-artifact@v4
        with:
          name: cozy-${{ steps.sha.outputs.sha }}
          path: dist/cozy/
          if-no-files-found: error
          retention-days: 7
      - if: contains(inputs.build, 'tensord')
        uses: actions/upload-artifact@v4
        with:
          name: tensord-${{ steps.sha.outputs.sha }}
          path: dist/tensord/tensord-linux-*
          if-no-files-found: error
          retention-days: 7

  # TensorFS's release wheel: the extension and the `tfs` it carries, both built in the manylinux container so their
  # glibc floor is the wheel's tag, with the CUDA decode kernels it embeds.
  tensorfs:
    if: contains(inputs.build, 'tensorfs') || contains(inputs.build, 'kernels')
    runs-on: ${{ inputs.billed_runner || inputs.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    env:
      TRITON: triton==3.8.0
    steps:
      - if: ${{ inputs.billed_runner != '' }}
        env:
          RUNNER: ${{ inputs.billed_runner }}
        run: echo "::warning::billed runner $RUNNER, never free; the budget is about \$10/day per org, and October passed it on 10-17 and 10-22 with these runs"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      # The kernels are a function of their sources and Triton; TensorFS's build.rs refuses a catalog whose sources differ.
      - id: kernels
        uses: actions/cache@v4
        with:
          path: crates/tensorfs/kernels/aot
          key: tensorfs-kernels-${{ env.TRITON }}-${{ hashFiles('crates/tensorfs-py/kernels/*.py') }}
      - name: Compile prebuilt TensorFS CUDA decode kernels
        if: steps.kernels.outputs.cache-hit != 'true'
        run: uv run --no-project --python 3.12 --with "$TRITON" python crates/tensorfs-py/kernels/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tensorfs-kernels-${{ steps.sha.outputs.sha }}
          path: crates/tensorfs/kernels/aot/
          if-no-files-found: error
          retention-days: 7
      - uses: Swatinem/rust-cache@v2
        if: contains(inputs.build, 'tensorfs')
        with:
          cache-on-failure: true
          workspaces: . -> target/manylinux2_28
      - name: Build the TensorFS wheel
        if: contains(inputs.build, 'tensorfs')
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          target: x86_64
          manylinux: 2_28
          working-directory: crates/tensorfs-py
          args: --release --locked --target-dir ../../target/manylinux2_28 --out dist -i python3.11
          docker-options: -e TENSORFS_REQUIRE_AOT=1
          before-script-linux: |
            export PATH="/opt/python/cp312-cp312/bin:$PATH"
            /opt/python/cp312-cp312/bin/python -m pip install 'uv==0.12.7'
            # Match maturin's target, interpreter and feature graph through the canonical helper.
            /opt/python/cp311-cp311/bin/python backend/stage_cli.py --release \
              --target x86_64-unknown-linux-gnu --target-dir ../../target/manylinux2_28 \
              -i /opt/python/cp311-cp311/bin/python
      # The container leaves root-owned files the verify and cache post-steps write.
      - if: always() && contains(inputs.build, 'tensorfs')
        run: sudo chown -R "$(id -u):$(id -g)" target crates/tensorfs-py
      - name: Verify and tag the complete Linux wheel
        if: contains(inputs.build, 'tensorfs')
        run: uv run --no-project --with auditwheel --with patchelf python crates/tensorfs-py/backend/portable_wheels.py crates/tensorfs-py/dist --platform manylinux_2_28_x86_64
      - name: Import the complete TensorFS wheel
        if: contains(inputs.build, 'tensorfs')
        run: |
          wheels=(crates/tensorfs-py/dist/*.whl)
          test "${#wheels[@]}" = 1
          uv run --no-project --python 3.12 --with "${wheels[0]}" python - <<'PY'
          import base64
          import hashlib
          import importlib.metadata
          import json
          import subprocess
          from pathlib import Path

          import tensorfs
          from tensorfs import raw, varena
          # The same one-version contract as scripts/build-wheel.sh, on the installed wheel.
          installed = importlib.metadata.distribution("tensorfs")
          scripts = [entry for entry in installed.files or () if entry.name == "tfs" and entry.parent.name in ("bin", "scripts")]
          assert len(scripts) == 1, scripts
          entry = scripts[0]
          tfs = Path(installed.locate_file(entry)).resolve()
          assert entry.hash is not None and entry.hash.mode == "sha256"
          digest = hashlib.sha256(tfs.read_bytes()).digest()
          assert base64.urlsafe_b64encode(digest).rstrip(b"=").decode() == entry.hash.value
          cli = json.loads(subprocess.check_output([str(tfs), "--json", "version"], text=True))
          assert cli["version"] == installed.version == tensorfs.__version__ == tensorfs._ext.__version__, cli
          assert cli["sha256"] == digest.hex()
          assert callable(raw.quantize) and callable(tensorfs.Writer.quantize)
          encoded, measured = raw.quantize_measured(
              "int8.convrot", bytes(256 * 4), dtype="F32", shape=(1, 256),
              strategy="int8-convrot256/1",
              params={"rotation": "kron_regular_h4", "rotation_size": 256},
          )
          assert encoded.parts["weight"].nbytes == 256
          assert measured == {"amax": 0.0, "max_abs_error": 0.0, "sse": 0.0, "energy": 0.0, "saturated": 0}
          assert tensorfs.ConversionControl().progress() == (0, 0, 0)
          from tensorfs.varena import _runtime
          assert hasattr(_runtime, "Source") and hasattr(_runtime, "Pages")
          assert hasattr(tensorfs._ext._VarenaRegion, "pin")
          print("TensorFS full-package import and native capabilities:", tensorfs.__version__)
          PY
      - if: contains(inputs.build, 'tensorfs')
        uses: actions/upload-artifact@v4
        with:
          name: tensorfs-wheel-${{ steps.sha.outputs.sha }}
          path: crates/tensorfs-py/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  check:
    if: contains(inputs.build, 'check')
    runs-on: ${{ inputs.billed_runner || inputs.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - if: ${{ inputs.billed_runner != '' }}
        env:
          RUNNER: ${{ inputs.billed_runner }}
        run: echo "::warning::billed runner $RUNNER, never free; the budget is about \$10/day per org, and October passed it on 10-17 and 10-22 with these runs"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check native memory and TensorFS compilation
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          cargo check --locked -p varena -p tensorfs -p tensorfs-py
          cargo check --locked -p tensorfs --no-default-features

  # Manual platform proof of the actual encrypted filesystem, no account/rental/daemon.
  vault-provider:
    if: contains(inputs.build, 'vault-provider')
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          key: vault-provider-${{ runner.os }}-${{ runner.arch }}
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Install Linux filesystem driver and media tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fuse libfuse2t64 ffmpeg
          sudo modprobe fuse || test -e /dev/fuse
      - name: Install macOS media tool (native encrypted APFS needs no driver)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install pinned Windows filesystem driver and media tool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP winfsp.msi
          Invoke-WebRequest https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi -OutFile $msi
          if ((Get-FileHash $msi -Algorithm SHA256).Hash.ToLower() -ne '073a70e00f77423e34bed98b86e600def93393ba5822204fac57a29324db9f7a') { throw 'WinFsp checksum mismatch' }
          $installed = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart', 'ADDLOCAL=ALL') -Wait -PassThru
          if ($installed.ExitCode -notin @(0, 3010)) { throw "WinFsp install failed: $($installed.ExitCode)" }
          choco install ffmpeg --no-progress -y
      - name: Embed the pinned provider and build its real fixture
        run: |
          target=$(rustc +1.99.1 -vV | sed -n 's/^host: //p')
          python scripts/prepare-securefs.py --target "$target" --out-dir "$RUNNER_TEMP/vault-helper" --github-env "$GITHUB_ENV"
          echo "VAULT_TARGET=$target" >> "$GITHUB_ENV"
      - name: Run encrypted filesystem and controller-death proof
        run: |
          cargo +1.99.1 build -p project-mount --example vault-provider --locked
          probe=target/debug/examples/vault-provider
          if [[ "$RUNNER_OS" == macOS ]]; then
            helper=/usr/bin/hdiutil
          else
            name=securefs
            if [[ "$RUNNER_OS" == Windows ]]; then name=securefs.exe; probe=$probe.exe; fi
            python -c 'import os, pathlib, zipfile; z=zipfile.ZipFile(os.environ["COZY_SECUREFS_ARCHIVE"]); p=pathlib.Path(os.environ["RUNNER_TEMP"])/"vault-provider-bin"; p.mkdir(); z.extractall(p); [f.chmod(0o755) for f in p.iterdir() if f.is_file()]'
            helper="$RUNNER_TEMP/vault-provider-bin/$name"
          fi
          python e2e/vault-provider/run.py --probe "$probe" --securefs "$helper" --artifacts "provider-proof"
      - name: Keep native macOS provider diagnostics
        if: always() && runner.os == 'macOS'
        run: |
          mkdir -p provider-proof
          /sbin/mount > provider-proof/macos-mounts.log
          hdiutil info -plist > provider-proof/macos-images.plist
          hdiutil help create > provider-proof/hdiutil-create.log 2>&1 || true
          sudo /usr/bin/log show --style compact --last 3m --predicate 'process == "diskimages-helper" OR process == "diskimagesiod" OR subsystem BEGINSWITH "com.apple.DiskImages"' > provider-proof/macos-diskimages.log 2>&1 || true
      - name: Collect only proof records
        if: always()
        run: |
          python - <<'PY_EVIDENCE'
          from pathlib import Path
          import shutil
          source, target = Path('provider-proof'), Path('provider-evidence')
          target.mkdir(exist_ok=True)
          for name in ['results.json', 'normal.log', 'crash.log', 'provider.log', 'crash/ready.json', 'macos-mounts.log', 'macos-images.plist', 'macos-diskimages.log', 'hdiutil-create.log']:
              item = source / name
              if item.is_file():
                  shutil.copy2(item, target / name.replace('/', '-'))
          for name in ['fskit-setup.json', 'fskit-restore.json']:
              item = Path(name)
              if item.is_file():
                  shutil.copy2(item, target / name)
          PY_EVIDENCE
      - name: Keep platform proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vault-provider-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          path: provider-evidence
          if-no-files-found: warn
          retention-days: 14
