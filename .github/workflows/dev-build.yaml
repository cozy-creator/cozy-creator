name: dev-build
# Builds release artifacts for any ref, off the dev box:
#   gh workflow run dev-build.yaml -R cozy-creator/cozy-creator -f ref=<sha> -f build=cozy,tensord,tensorfs
# Artifacts: tensord-<sha> (the runner arch's manylinux tensord that Runtime's wheel bundles),
# cozy-<sha> (the runner arch's dev `cozy`, <version>+dev.g<sha8>, which `cozy machine update --tensord <path>`
# runs on any machine: `ghbuild.sh cozy <ref> cozy`, `-r ubuntu-24.04-arm` for arm64) and
# tensorfs-wheel-<sha> (the manylinux x86_64 wheel). The cozy binary's release archives are dist's
# (cozy-publish.yaml).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
      build:
        description: "cozy: dev binary; tensord: manylinux binary; tensorfs: wheel; kernels: CUDA AOT; check: native Rust compilation only (comma-separate several)"
        type: string
        default: cozy
      features:
        description: "Cargo features of the cozy and tensord builds"
        type: string
        default: ''
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
      nonce:
        description: Caller's id, shown in the run name so the caller can find its run
        type: string
        default: ''
run-name: dev-build ${{ inputs.ref }} ${{ inputs.build }} ${{ inputs.nonce }}

permissions:
  contents: read

jobs:
  dev:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    # Hang bound, not a work budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: contains(inputs.build, 'tensorfs') || contains(inputs.build, 'kernels') || contains(inputs.build, 'cozy') || contains(inputs.build, 'tensord')
      # The Rust workspace: rust-toolchain.toml's toolchain installs on first use. target/manylinux
      # holds the manylinux_2_28 builds (tensord, the dev cozy); target/manylinux2014 the TensorFS
      # wheel's, whose older glibc cannot run build scripts the 2_28 container compiled.
      - uses: Swatinem/rust-cache@v2
        if: contains(inputs.build, 'tensor') || contains(inputs.build, 'cozy') || contains(inputs.build, 'check')
        with:
          cache-on-failure: true
          workspaces: |
            . -> target
            . -> target/manylinux
            . -> target/manylinux2014
      - uses: actions/setup-python@v6
        if: contains(inputs.build, 'check')
        with:
          python-version: '3.12'
      - name: Check native memory and TensorFS compilation
        if: contains(inputs.build, 'check')
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          cargo check --locked -p varena -p tensorfs -p tensorfs-py
          cargo check --locked -p tensorfs --no-default-features
      - uses: arduino/setup-task@v2
        if: contains(inputs.build, 'tensord')
        with:
          repo-token: ${{ github.token }}
      # crates/tensord's Taskfile `release`, as Runtime's `task machine` runs it. Its container keeps
      # its toolchain under target/manylinux/rustup, which never goes to the cache.
      - name: Build tensord
        if: contains(inputs.build, 'tensord')
        run: |
          rm -rf target/manylinux/rustup
          CARGO_BUILD_JOBS=$(nproc) task -d crates/tensord release OUT="$PWD/dist/tensord" FEATURES="${{ inputs.features }}"
          rm -rf target/manylinux/rustup
      - if: contains(inputs.build, 'tensord')
        uses: actions/upload-artifact@v4
        with:
          name: tensord-${{ steps.sha.outputs.sha }}
          path: dist/tensord/
          if-no-files-found: error
          retention-days: 7
      # The dev `cozy` a machine runs (`cozy machine update --tensord <path>`): dist's manylinux_2_28 build, so
      # it runs on every pod, stamped <version>+dev.g<sha8> with its commit.
      - name: Build the dev cozy
        if: contains(inputs.build, 'cozy')
        run: |
          sha=$(git rev-parse HEAD) arch=$(uname -m) target=$PWD/target/manylinux
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          cargo fetch --locked
          sed -i "0,/^version = \"$version\"$/s//version = \"$version+dev.g${sha:0:8}\"/" Cargo.toml
          cargo update -w --offline
          rm -rf "$target/rustup" && mkdir -p "$target" dist/cozy
          docker run --rm -e CARGO_BUILD_JOBS="$(nproc)" --user "$(id -u):$(id -g)" -e HOME=/tmp -e RUSTUP_HOME=/target/rustup -e COZY_COMMIT="$sha" -e FEATURES="${{ inputs.features }}" \
            -v "$HOME/.cargo/registry:/cargo/registry" -v "$HOME/.cargo/git:/cargo/git" -v "$PWD:/src:ro" -v "$target:/target" -w /src \
            "quay.io/pypa/manylinux_2_28_$arch:2026.10.03-1" \
            sh -c 'curl -sSf https://sh.rustup.rs | sh -s -- -y -q --profile minimal --default-toolchain 1.99.1 >&2 && PATH=/tmp/.cargo/bin:$PATH CARGO_HOME=/cargo cargo build --release --locked --offline --target-dir /target -p cozy --bin cozy --features "$FEATURES" && cp /target/rustup/toolchains/*/lib/rustlib/*/lib/libstd-*.so /target/release/deps/'
          rm -rf "$target/rustup" && git checkout -- Cargo.toml Cargo.lock
          uv run --no-project --with patchelf python scripts/bundle-native.py --binary "$target/release/cozy" --target "$target/release" --runtime-dir "$target/release/deps" --out "dist/cozy" --archive "dist/cozy/cozy-linux-$arch.tar.gz"
          mv dist/cozy/cozy "dist/cozy/cozy-linux-$arch"
          (cd dist/cozy && sha256sum "cozy-linux-$arch.tar.gz" > "cozy-linux-$arch.tar.gz.sha256")
          said=$("dist/cozy/cozy-linux-$arch" --version)
          case $said in *"+dev.g${sha:0:8}") echo "$said" ;; *) echo "::error::the dev cozy says $said"; exit 1 ;; esac
      - if: contains(inputs.build, 'cozy')
        uses: actions/upload-artifact@v4
        with:
          name: cozy-${{ steps.sha.outputs.sha }}
          path: dist/cozy/
          if-no-files-found: error
          retention-days: 7
      # TensorFS's release wheel: the extension and the `tfs` it carries, both built in the
      # manylinux container so their glibc floor is the wheel's tag.
      - name: Compile prebuilt TensorFS CUDA decode kernels
        if: contains(inputs.build, 'tensorfs') || contains(inputs.build, 'kernels')
        run: |
          uv run --no-project --python 3.12 --with triton==3.8.0 python crates/tensorfs-py/kernels/build.py
      - if: contains(inputs.build, 'tensorfs') || contains(inputs.build, 'kernels')
        uses: actions/upload-artifact@v4
        with:
          name: tensorfs-kernels-${{ steps.sha.outputs.sha }}
          path: crates/tensorfs/kernels/aot/
          if-no-files-found: error
          retention-days: 7
      - name: Build the TensorFS wheel
        if: contains(inputs.build, 'tensorfs')
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          target: x86_64
          manylinux: auto
          working-directory: crates/tensorfs-py
          args: --release --locked --target-dir ../../target/manylinux2014 --out dist -i python3.11
          docker-options: -e TENSORFS_REQUIRE_AOT=1
          before-script-linux: |
            # Match maturin's explicit target so the CLI and extension share dependency builds.
            cargo build --release --locked --target x86_64-unknown-linux-gnu --target-dir ../../target/manylinux2014 -p tensorfs -p tensorfs-py --lib --bin tfs --features extension-module,store,pyo3/abi3-py311
            install -D -m 755 ../../target/manylinux2014/x86_64-unknown-linux-gnu/release/tfs wheel-data/scripts/tfs
      - name: Verify and tag the complete Linux wheel
        if: contains(inputs.build, 'tensorfs')
        run: uv run --no-project --with auditwheel --with patchelf python crates/tensorfs-py/backend/portable_wheels.py crates/tensorfs-py/dist --platform manylinux_2_17_x86_64
      # The container leaves root-owned files the cache post-step writes.
      - name: Import the complete TensorFS wheel
        if: contains(inputs.build, 'tensorfs')
        run: |
          wheels=(crates/tensorfs-py/dist/*.whl)
          test "${#wheels[@]}" = 1
          uv run --no-project --python 3.12 --with "${wheels[0]}" python - <<'PY'
          import base64
          import hashlib
          import importlib.metadata
          import json
          import subprocess
          from pathlib import Path

          import tensorfs
          from tensorfs import raw, varena
          # The same one-version contract as scripts/build-wheel.sh, on the installed wheel.
          installed = importlib.metadata.distribution("tensorfs")
          scripts = [entry for entry in installed.files or () if entry.name == "tfs" and entry.parent.name in ("bin", "scripts")]
          assert len(scripts) == 1, scripts
          entry = scripts[0]
          tfs = Path(installed.locate_file(entry)).resolve()
          assert entry.hash is not None and entry.hash.mode == "sha256"
          digest = hashlib.sha256(tfs.read_bytes()).digest()
          assert base64.urlsafe_b64encode(digest).rstrip(b"=").decode() == entry.hash.value
          cli = json.loads(subprocess.check_output([str(tfs), "--json", "version"], text=True))
          assert cli["version"] == installed.version == tensorfs.__version__ == tensorfs._ext.__version__, cli
          assert cli["sha256"] == digest.hex()
          assert callable(raw.quantize) and callable(tensorfs.Writer.quantize)
          encoded, measured = raw.quantize_measured(
              "int8.convrot", bytes(256 * 4), dtype="F32", shape=(1, 256),
              strategy="int8-convrot256/1",
              params={"rotation": "kron_regular_h4", "rotation_size": 256},
          )
          assert encoded.parts["weight"].nbytes == 256
          assert measured == {"amax": 0.0, "max_abs_error": 0.0, "sse": 0.0, "energy": 0.0, "saturated": 0}
          assert tensorfs.ConversionControl().progress() == (0, 0, 0)
          assert varena.supports_load_execution()
          assert hasattr(tensorfs._ext._VarenaLoadSlot, "encoded")
          assert hasattr(tensorfs._ext._VarenaRegion, "pin")
          print("TensorFS full-package import and native capabilities:", tensorfs.__version__)
          PY
      - if: always() && contains(inputs.build, 'tensorfs')
        run: sudo chown -R "$(id -u):$(id -g)" target crates/tensorfs-py
      - if: contains(inputs.build, 'tensorfs')
        uses: actions/upload-artifact@v4
        with:
          name: tensorfs-wheel-${{ steps.sha.outputs.sha }}
          path: crates/tensorfs-py/dist/*.whl
          if-no-files-found: error
          retention-days: 7
