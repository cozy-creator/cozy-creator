name: tensorfs-publish
# TensorFS's Python package (design §2): wheels for every platform cozy ships, each built on a runner of its
# own platform, and the sdist. A release is its tensorfs-vX.Y.Z tag, and nothing reaches PyPI before its gate
# passed (tracker design ci-v2, pre-release and promotion):
#   gh workflow run tensorfs-publish.yaml -R cozy-creator/cozy-creator --ref <branch>                           # build
#   gh workflow run tensorfs-publish.yaml -R cozy-creator/cozy-creator --ref tensorfs-vX.Y.Z -f candidate=true  # prerelease
#   gh workflow run tensorfs-publish.yaml -R cozy-creator/cozy-creator --ref tensorfs-vX.Y.Z -f gate_run=<id>   # PyPI
#   gh workflow run tensorfs-publish.yaml -R cozy-creator/cozy-creator --ref <branch> -f dev=true               # <version>+dev.g<sha>
# The candidate is the tag's GitHub prerelease (never latest: `cozy update` follows latest): the wheels, the sdist and
# SHA256SUMS. The release agent tests it by hand (release-gate.yml takes its Linux x86_64 wheel by URL#sha256);
# gate_run (that passing release-gate run's id, or the URL of a recorded hand gate) uploads that prerelease's exact
# files to PyPI, nothing rebuilt. PyPI's trusted publisher names this file.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Put this tag's wheels and sdist on its GitHub prerelease, the gate's candidate (no PyPI)
        type: boolean
        default: false
      gate_run:
        description: "Publish the tag's prerelease to PyPI: the passing release-gate run id, or a recorded hand gate's URL"
        type: string
        default: ''
      dev:
        description: Build <version>+dev.g<sha>, a development wheel PyPI never accepts (artifacts only)
        type: boolean
        default: false

concurrency:
  group: tensorfs-publish-${{ github.ref }}

permissions:
  contents: read

jobs:
  kernels:
    if: inputs.gate_run == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --no-project --python 3.12 --with triton==3.8.0 python crates/tensorfs-py/kernels/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: tensorfs-kernels-${{ github.sha }}
          path: crates/tensorfs/kernels/aot/
          if-no-files-found: error
          retention-days: 7

  # A candidate or a publish runs on its version's tag.
  tag:
    if: inputs.candidate || inputs.gate_run != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/tensorfs-py/pyproject.toml", "rb"))["project"]["version"])')
          [ "$GITHUB_REF" = "refs/tags/tensorfs-v$version" ] || { echo "::error::publish runs on tensorfs-v$version, not $GITHUB_REF"; exit 1; }
          # Varena ships inside the TensorFS wheel, so its crate version is TensorFS's.
          for crate in tensorfs tensorfs-py varena; do
            crate_version=$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["package"]["version"])' "crates/$crate/Cargo.toml")
            [ "$crate_version" = "$version" ] || { echo "::error::crates/$crate is $crate_version, not $version"; exit 1; }
          done

  # Per platform, one cp311-abi3 wheel (CPython 3.11 and later) and one cp310 wheel. The CUDA kernels
  # ship where CUDA exists; the other wheels read on the CPU. Windows on Arm has no CPython 3.10.
  wheel:
    needs: kernels
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    # Hang bound, not a work budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64, cuda: true }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64, cuda: true }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin, cuda: false }
          - { name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc, cuda: true }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc, cuda: false, no310: true }
    env:
      CARGO_BUILD_JOBS: "4"
      TENSORFS_REQUIRE_AOT: ${{ matrix.cuda && '1' || '0' }}
    defaults:
      run:
        shell: bash
        working-directory: crates/tensorfs-py
    steps:
      - uses: actions/checkout@v5
      - if: matrix.cuda
        uses: actions/download-artifact@v4
        with:
          name: tensorfs-kernels-${{ github.sha }}
          path: crates/tensorfs/kernels/aot/
      - if: runner.os != 'Linux' && !matrix.no310
        id: py310
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - id: py311
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - if: inputs.dev
        run: scripts/dev-version.sh
      # `tfs` ships in the wheel's data scripts beside the module. On Linux it is built INSIDE the
      # manylinux container, so its glibc floor matches the extension's (tfs-051). The container is
      # manylinux_2_28, Torch's own: each Torch allocator shim links that Torch (backend/stage_shim.py).
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: crates/tensorfs-py
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.10 python3.11
          manylinux: 2_28
          docker-options: -e TENSORFS_REQUIRE_AOT=1
          before-script-linux: |
            triple=$(rustc -vV | sed -n "s/^host: //p")
            export PATH="/opt/python/cp312-cp312/bin:$PATH"
            /opt/python/cp312-cp312/bin/python -m pip install 'uv==0.12.7'
            /opt/python/cp310-cp310/bin/python backend/stage_cli.py --release --target "$triple" \
              -i /opt/python/cp310-cp310/bin/python /opt/python/cp311-cp311/bin/python
      - if: runner.os != 'Linux'
        env:
          PY310: ${{ steps.py310.outputs.python-path }}
          PY311: ${{ steps.py311.outputs.python-path }}
        run: |
          interpreters=()
          if [ -n "$PY310" ]; then interpreters+=("$PY310"); fi
          interpreters+=("$PY311")
          python backend/stage_cli.py --release --target "${{ matrix.target }}" -i "${interpreters[@]}"
      - if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: crates/tensorfs-py
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i ${{ steps.py310.outputs.python-path }} ${{ steps.py311.outputs.python-path }}
      - uses: astral-sh/setup-uv@v6
      # The container leaves dist root-owned, and the verify step writes beside its wheels.
      - if: runner.os == 'Linux'
        run: sudo chown -R "$(id -u):$(id -g)" dist
      - name: Verify and tag the complete Linux wheel
        if: runner.os == 'Linux'
        run: uv run --no-project --with auditwheel --with patchelf python backend/portable_wheels.py dist --platform "manylinux_2_28_$(uname -m)"
      # The stubs against the extension they describe: a name, parameter or class they get wrong fails.
      - name: Stubs match the extension
        if: matrix.name == 'linux-x86_64'
        run: |
          wheel=$(ls dist/*-cp311-abi3-*.whl)
          uv run --no-project --python 3.12 --with "$wheel" --with mypy==2.4.1 \
            --with 'torch @ https://download.pytorch.org/whl/cpu/torch-2.15.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl' \
            python -m mypy.stubtest --allowlist stubtest-allowlist.txt tensorfs._ext tensorfs.api tensorfs.executor tensorfs.raw
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: crates/tensorfs-py/dist/*-abi3-*.whl
          if-no-files-found: error
          retention-days: 7
      - if: '!matrix.no310'
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}-cp310
          path: crates/tensorfs-py/dist/*-cp310-cp310-*.whl
          if-no-files-found: error
          retention-days: 7
      # Images bake only this wheel, so it's on the tag's prerelease as soon as it's built: they
      # don't wait for the other platforms (cl-740). `candidate` adds the rest.
      - if: inputs.candidate && !inputs.dev && matrix.name == 'linux-x86_64'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title "TensorFS ${GITHUB_REF_NAME#tensorfs-v} (candidate)" --notes "Gate, then publish: release-gate/README.md" -- dist/*-cp311-abi3-*.whl

  # The sdist builds with Rust (it carries the module, not the `tfs` binary the wheels do).
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: inputs.dev
        run: crates/tensorfs-py/scripts/dev-version.sh
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.16.0
          working-directory: crates/tensorfs-py
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: crates/tensorfs-py/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The candidate: every platform and the sdist on the tag's prerelease, SHA256SUMS last, which marks it whole.
  candidate:
    if: inputs.candidate && !inputs.dev
    needs: [tag, wheel, sdist]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: |
          cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
          have=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null) \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "TensorFS ${GITHUB_REF_NAME#tensorfs-v} (candidate)" --notes "Gate, then publish: release-gate/README.md"
          ! grep -qx SHA256SUMS <<< "$have" || { echo "::error::$GITHUB_REF_NAME is whole already: a candidate's files never change"; exit 1; }
          # `wheel` may have put the Linux x86_64 wheel there: it must be this file.
          while read -r sum name; do
            if grep -qxF "$name" <<< "$have"; then
              gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p "$name" -O - | sha256sum | grep -q "^$sum " || { echo "::error::$name differs from the one on the release"; exit 1; }
            else
              gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -- "$name"
            fi
          done < SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -- SHA256SUMS
          w=$(grep -E 'cp311-abi3-manylinux[^ ]*x86_64\.whl$' SHA256SUMS | head -1)
          echo "gate with: tensorfs_wheel=https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/${w##* }#sha256=${w%% *}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # The prerelease's exact files, once their gate passed.
  publish:
    if: inputs.gate_run != '' && !inputs.dev
    needs: tag
    runs-on: ubuntu-24.04
    environment: pypi
    # Hang bound, not a work budget.
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write  # PyPI trusted publishing (OIDC)
    env:
      GH_TOKEN: ${{ github.token }}
      GATE: ${{ inputs.gate_run }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: creator
      - run: |
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -D dist
          cd dist && sha256sum --check --strict SHA256SUMS && rm SHA256SUMS && ls -l
          case $GATE in
            https://*) echo "gated by hand, recorded at $GATE" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            *[!0-9]* | '') echo "::error::gate_run is a release-gate run id or a record URL, not '$GATE'"; exit 1 ;;
          esac
          set_=$(../creator/release-gate/verify.sh "$GATE")
          sha=$(jq -r .tensorfs_sha256 <<< "$set_")
          [ -n "$sha" ] && sha256sum -- * | grep -q "^$sha " || { echo "::error::gate $GATE ran no wheel of $GITHUB_REF_NAME"; exit 1; }
      - uses: pypa/gh-action-pypi-publish@release/v1
