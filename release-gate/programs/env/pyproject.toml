[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "programs-env"
version = "0.1.0"
description = "The environment the release gate's library programs run in (release-gate/programs.sh)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.45", "msgspec>=0.19", "numpy>=1.26", "torch>=2.14"]

[project.entry-points."cozy.application"]
default = "programs_env:app"

[tool.uv.build-backend]
module-name = "programs_env"
module-root = ""
