[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-gpu-plan"
version = "0.1.0"
description = "Real resident GPU-driven repeat and lifecycle proof"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.30", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_gpu_plan:app"

[tool.uv.build-backend]
module-name = "ci_gpu_plan"
module-root = ""
