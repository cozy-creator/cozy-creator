[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-capture-refusal"
version = "0.1.0"
description = "A denoise_loop step no capture can record: the loop refuses its recording and runs on eagerly"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.35,<0.37", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_capture_refusal:app"

[tool.uv.build-backend]
module-name = "ci_capture_refusal"
module-root = ""
