[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-capture-refusal"
version = "0.1.0"
description = "A plain step loop that reads the host or synchronizes the device: every step runs, values exact"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.35", "msgspec>=0.19", "torch>=2.14"]

[project.entry-points."cozy.application"]
default = "ci_capture_refusal:app"

[tool.uv.build-backend]
module-name = "ci_capture_refusal"
module-root = ""
