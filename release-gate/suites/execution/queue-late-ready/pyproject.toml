[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-queue-late-ready"
version = "0.1.0"
description = "Actual queued request preparation and GPU invocation handoff"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.34,<0.35", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_queue_lookahead:app"

[tool.uv.build-backend]
module-name = "ci_queue_lookahead"
module-root = ""
