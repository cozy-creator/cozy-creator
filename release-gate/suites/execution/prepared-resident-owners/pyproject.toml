[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-prepared-resident-owners"
version = "0.1.0"
description = "Real CUDA qualification for prepared resident component ownership"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32.2,<0.33", "tensorfs>=0.15.2,<0.16", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_prepared_resident_owners:app"

[tool.uv.build-backend]
module-name = "ci_prepared_resident_owners"
module-root = ""
