[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-native-load-execute"
version = "0.1.0"
description = "Real native source-load and prepared GPU continuation qualification"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32,<0.33", "tensorfs>=0.15.7,<0.16", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_native_load_execute:app"

[tool.uv.build-backend]
module-name = "ci_native_load_execute"
module-root = ""
