[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-sdxl-prepared"
version = "0.1.0"
description = "Actual placed Diffusers UNet and SDXL native Euler parity"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32.2,<0.33", "tensorfs>=0.15.2,<0.16", "diffusers>=0.40,<0.41", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_sdxl_prepared:app"

[tool.uv.build-backend]
module-name = "ci_sdxl_prepared"
module-root = ""
