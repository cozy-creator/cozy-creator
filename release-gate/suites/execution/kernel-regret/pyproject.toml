[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-kernel-regret"
version = "0.1.0"
description = "Every prebuilt GEMM tile and dense attention candidate against the rule's pick, at product shapes"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.34,<0.35", "diffusers>=0.40", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_kernel_regret:app"

[tool.uv.build-backend]
module-name = "ci_kernel_regret"
module-root = ""
