[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-native-refill"
version = "0.1.0"
description = "Real final-weight cache, ownership and refill qualification"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32.3,<0.33", "tensorfs>=0.15.8,<0.16", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_native_refill:app"

[tool.uv.build-backend]
module-name = "ci_native_refill"
module-root = ""
