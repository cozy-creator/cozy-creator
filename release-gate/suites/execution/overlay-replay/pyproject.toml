[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-overlay-replay"
version = "0.1.0"
description = "A LoRA overlay armed before a plain step loop: armed latents equal eager, byte for byte"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.40.4", "diffusers>=0.41,<0.42", "msgspec>=0.19", "torch>=2.14"]

[project.entry-points."cozy.application"]
default = "ci_overlay_replay:app"

[tool.uv.build-backend]
module-name = "ci_overlay_replay"
module-root = ""
