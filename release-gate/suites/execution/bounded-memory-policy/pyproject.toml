[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-bounded-memory-policy"
version = "0.1.0"
description = "Real CUDA qualification for prepared resident component ownership"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.34,<0.35", "tensorfs>=0.17,<0.18", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_bounded_memory_policy:app"

[tool.uv.build-backend]
module-name = "ci_bounded_memory_policy"
module-root = ""
