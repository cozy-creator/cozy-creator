[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-child-lora-stacks"
version = "0.1.0"
description = "A child call's own LoRA stack per slot, over the request's --lora (cl-687)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.48.0.dev0,<0.49", "msgspec>=0.19"]

[project.optional-dependencies]
cozy-calls = ["sdxl[cozy-calls]>=0.11.0rc2"]

[project.entry-points."cozy.application"]
default = "ci_child_lora_stacks:app"

[tool.uv.build-backend]
module-name = "ci_child_lora_stacks"
module-root = ""

# sdxl from the Hub: the root's index, as the signed-in account publishes no sdxl. cozy locks it at the run (cl-871).
[tool.uv.sources]
sdxl = { index = "tensorhub" }
