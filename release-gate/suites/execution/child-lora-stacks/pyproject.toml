[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-child-lora-stacks"
version = "0.1.0"
description = "A child call's own LoRA stack per slot, over the request's --lora (cl-687)"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[adapters,media]>=0.36.16", "msgspec>=0.19", "sdxl==0.1.5",
    # sdxl 0.1.5 imports as its own lock has it: hidiffusion needs this Diffusers.
    "diffusers==0.40.0", "transformers==5.16.1", "huggingface-hub==1.29.0", "torch==2.14.0",
]

[project.entry-points."cozy.application"]
default = "ci_child_lora_stacks:app"

[tool.uv.build-backend]
module-name = "ci_child_lora_stacks"
module-root = ""

[tool.uv.sources]
sdxl = { index = "tensorhub" }
