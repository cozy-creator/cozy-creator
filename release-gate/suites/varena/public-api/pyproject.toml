[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-varena-public"
version = "0.1.0"
description = "C, Rust and Python clients on one varena core, on a real GPU"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.37", "tensorfs>=0.19", "msgspec>=0.19", "torch==2.15.0"]

[project.entry-points."cozy.application"]
default = "ci_varena_public:app"

[tool.uv.build-backend]
module-name = "ci_varena_public"
module-root = ""

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pypi" }
