[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-varena-p0"
version = "0.1.0"
description = "Bounded real CUDA allocator and graph lifetime proof through Cozy"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.36.11,<0.37", "tensorfs>=0.17,<0.18", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_varena_p0:app"

[tool.uv.build-backend]
module-name = "ci_varena_p0"
module-root = ""
