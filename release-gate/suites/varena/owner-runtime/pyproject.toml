[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-varena-owner"
version = "0.1.0"
description = "Actual Runtime automatic native donor service through Cozy"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.36.11,<0.37", "tensorfs>=0.17,<0.18", "msgspec>=0.19", "torch==2.14.0"]

[project.entry-points."cozy.application"]
default = "ci_varena_owner:app"

[tool.uv.build-backend]
module-name = "ci_varena_owner"
module-root = ""

# Match SDXL's Linux PyPI wheel; its runtime version is 2.14.0+cu130.
[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pypi" }
