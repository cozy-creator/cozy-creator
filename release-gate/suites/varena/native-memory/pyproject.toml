[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-varena-native"
version = "0.1.0"
description = "The varena suite's native-memory cell: typed refusal, standalone recovery, region swap, a device fault"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.30", "msgspec>=0.19", "tensorfs>=0.13"]

[project.entry-points."cozy.application"]
default = "ci_varena_native:app"

[tool.uv.build-backend]
module-name = "ci_varena_native"
module-root = ""
