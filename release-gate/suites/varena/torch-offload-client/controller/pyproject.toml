[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-varena-offload"
version = "0.1.0"
description = "Actual Varena offload intent, adapter and stock SDXL clients"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.37,<0.38", "tensorfs>=0.17,<0.18", "msgspec>=0.19", "torch==2.14.0", "torchvision==0.29.2", "diffusers==0.41.0", "transformers==5.22.1", "numpy==2.5.4", "safetensors==0.8.0", "huggingface-hub==1.33.0", "pillow==13.0.0"]

[project.entry-points."cozy.application"]
default = "ci_varena_offload:app"

[tool.uv.build-backend]
module-name = "ci_varena_offload"
module-root = ""

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pypi" }
