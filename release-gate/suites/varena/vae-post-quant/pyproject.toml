[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-varena-post-quant"
version = "0.1.0"
description = "Actual H3 post-quant Conv3d comparison for the prepared GEMM alternative"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.37,<0.38", "tensorfs>=0.17,<0.18", "msgspec>=0.19", "torch==2.14.0", "torchvision>=0.29", "diffusers>=0.41,<0.42", "transformers>=5.16.1"]

[project.entry-points."cozy.application"]
default = "ci_varena_post_quant:app"

[tool.hatch.build.targets.wheel]
packages = ["ci_varena_post_quant"]
