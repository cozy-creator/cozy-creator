[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-varena-diffusers"
version = "0.1.0"
description = "Public full SDXL Diffusers allocator adoption under Compute Sanitizer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cozy-runtime==0.36.13", "tensorfs>=0.17,<0.18", "msgspec>=0.19",
    "torch==2.14.0", "diffusers==0.41.0", "transformers==5.17.0",
    "accelerate==1.15.0", "huggingface-hub==1.33.0", "safetensors==0.8.0", "numpy==2.5.3",
]

[project.entry-points."cozy.application"]
default = "ci_varena_diffusers:app"

[tool.uv.build-backend]
module-name = "ci_varena_diffusers"
module-root = ""

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pypi" }
