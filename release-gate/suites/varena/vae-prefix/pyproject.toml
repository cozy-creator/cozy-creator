[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-varena-prefix"
version = "0.1.0"
description = "Actual H3 input projection alternative, token packing and rotary prefix"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.37.7,<0.38", "tensorfs>=0.17,<0.18", "msgspec>=0.19", "torch==2.15.0", "torchvision>=0.29", "diffusers>=0.41,<0.42", "transformers>=5.16.1"]

[project.entry-points."cozy.application"]
default = "ci_varena_prefix:app"

[tool.hatch.build.targets.wheel]
packages = ["ci_varena_prefix"]
