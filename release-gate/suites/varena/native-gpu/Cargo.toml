[package]
name = "varena-native-gpu-proof"
version = "0.0.0"
edition.workspace = true
publish = false

# Build these genuine native fixtures in the extension's dependency cohort. Building
# varena as a separate primary crate can select a different private Rust linkage mode.
[[bin]]
name = "varena-raw-source"
path = "../../../../crates/tensorfs/examples/raw_source.rs"

[dependencies]
varena.workspace = true
libloading.workspace = true
libc.workspace = true
serde_json.workspace = true
tensorfs = { workspace = true, features = ["store"] }
tokio.workspace = true
