[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-stock-memory"
version = "0.1.0"
description = "Real TensorFS and Torch residency lifecycle through Cozy"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.30", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_stock_memory:app"

[tool.uv.build-backend]
module-name = "ci_stock_memory"
module-root = ""
