[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ci-varena-cache-pages"
version = "0.1.0"
description = "Real owner-addressed native Cache page proof through Cozy"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.36.18,<0.37", "msgspec>=0.19", "torch==2.14.0"]

[project.entry-points."cozy.application"]
default = "ci_varena_cache_pages:app"

[tool.hatch.build.targets.wheel]
packages = ["ci_varena_cache_pages"]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pypi" }
