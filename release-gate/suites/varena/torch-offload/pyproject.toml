[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-torch-offload"
version = "0.1.0"
description = "Stock Diffusers SDXL beside vt.offload, one fresh process per mode"
requires-python = ">=3.12,<3.15"
dependencies = ["cozy-runtime>=0.37", "tensorfs>=0.18", "msgspec>=0.19", "torch==2.15.0", "diffusers==0.41.0", "transformers==5.22.1", "accelerate>=1.0", "safetensors>=0.8", "huggingface-hub>=1.0", "nvidia-ml-py>=13", "pillow>=12"]

[project.entry-points."cozy.application"]
default = "ci_torch_offload:app"

[tool.uv.build-backend]
module-name = "ci_torch_offload"
module-root = ""

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pypi" }
