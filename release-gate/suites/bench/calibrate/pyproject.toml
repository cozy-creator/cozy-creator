[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-bench-calibrate"
version = "0.1.0"
description = "Suite bench's reference workload: fixed kernels, the host-to-device copy, a cold disk read, and the pod's facts"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.43", "msgspec>=0.19", "torch>=2.6"]

[project.entry-points."cozy.application"]
default = "bench_calibrate:app"

[tool.uv.build-backend]
module-name = "bench_calibrate"
module-root = ""
