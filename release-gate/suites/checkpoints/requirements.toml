reads = "minimax-h3 turbo_lora"
models = ["alibaba-pai/minimax-h3-turbo-lora"]
[checkpoint.components]
fl2va_turbo = { files = ["timestep-plan.json"] }
ref2va_turbo = { files = ["timestep-plan.json"] }

