# What each tool reads from a published checkpoint (tracker xs-170's standard, xs-183's audit tables). walk.py holds every
# published lane to each entry that matches it; a package owner extends the entries for its tools.
#
# [[checkpoint]] matches a lane by `models` (org/name), else by `families` (what its header verifies as, or its owner's
# label) and `kind` (weights, component or lora), else by `kind` alone. An entry naming the model replaces family entries.
# `reads` says what reads it. [checkpoint.components.<name>]: the component exists, with
#   config = true   a config (the default; false: none is read)    keys = [...]   config keys the tool reads
#   files = [...]   run data under the component's folder, its config file included: "a|b" either, "a+b" both
#   tensors = true  weights of its own
# lora = true: each LoRA component is named in the header's `adapter` record, and every module states its α (`.alpha`, or
# the component config's `lora_alpha`).

[[checkpoint]]
reads = "every LoRA (TensorD adapter.rs)"
kind = "lora"
lora = true

[[checkpoint]]
reads = "minimax-h3 base_model (generate, edit, upscale)"
families = ["minimax-h3"]
kind = "weights"
[checkpoint.components]
transformer = { keys = ["cozy_h3"], files = ["timestep-plan.json"] }
transformer_ref = { keys = ["cozy_h3"], files = ["timestep-plan.json"] }
vae = {}
audio_vae = {}
text_encoder = { files = [
  "processor/tokenizer_config.json",
  "processor/vocab.json+processor/merges.txt|processor/tokenizer.json",
  "processor/preprocessor_config.json",
  "processor/video_preprocessor_config.json",
] }

