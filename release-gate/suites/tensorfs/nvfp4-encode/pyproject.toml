[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-nvfp4-encode"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32,<0.33", "tensorfs>=0.15.3,<0.16", "msgspec>=0.19", "numpy>=2,<3"]

[project.entry-points."cozy.application"]
default = "ci_nvfp4_encode:app"

[tool.uv.build-backend]
module-name = "ci_nvfp4_encode"
module-root = ""
