[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-svdq-calibration"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32.3,<0.34", "tensorfs>=0.15.6,<0.17", "msgspec>=0.19", "numpy>=1.26", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_svdq_calibration:app"

[tool.uv.build-backend]
module-name = "ci_svdq_calibration"
module-root = ""
