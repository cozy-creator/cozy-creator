[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-runtime-nvfp4"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32.2,<0.33", "tensorfs>=0.15.2,<0.16", "msgspec>=0.19", "torch>=2.14,<2.15"]

[project.entry-points."cozy.application"]
default = "ci_runtime_nvfp4:app"

[tool.uv.build-backend]
module-name = "ci_runtime_nvfp4"
module-root = ""
