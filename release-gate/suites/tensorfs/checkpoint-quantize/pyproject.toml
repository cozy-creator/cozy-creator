[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-checkpoint-quantize"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.32,<0.33", "tensorfs>=0.15.4,<0.16", "msgspec>=0.19", "numpy>=1.26"]

[project.entry-points."cozy.application"]
default = "ci_checkpoint_quantize:app"

[tool.uv.build-backend]
module-name = "ci_checkpoint_quantize"
module-root = ""
