[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-kernels"
version = "0.1.0"
description = "Every kernel this Runtime ships, once, through its real launch path, against a slow reference"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.39", "diffusers>=0.41,<0.42", "msgspec>=0.19", "torch>=2.14", "triton>=3"]

[project.entry-points."cozy.application"]
default = "ci_kernels:app"

[tool.uv.build-backend]
module-name = "ci_kernels"
module-root = ""
