[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-hub-outage"
version = "0.1.0"
description = "A deviceless root calling one child per model with a pause between, for a Hub outage mid-run (cl-708)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.36.16", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "ci_hub_outage:app"

[tool.uv.build-backend]
module-name = "ci_hub_outage"
module-root = ""
