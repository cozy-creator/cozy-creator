[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ggml-logits"
version = "0.1.0"
description = "ggml-decode's drives: logits agreement between lanes, and a lane's timed decode with and without MTP drafting"
requires-python = ">=3.12"
# As qwen3's: the drives load the same VisionLM, a Transformers model. TensorFS as qwen3's lock holds it (0.26.0): a
# machine's candidate TensorFS (0.26.0+dev.g…) stands in only for its lock's version or an earlier patch, so a lock on
# PyPI's 0.26.1 would run 0.26.1 beside the candidate Runtime (Device.region's TypeError, 44283198366).
dependencies = [
    "cozy-runtime[media]>=0.48.0.dev0,<0.49",
    "tensorfs>=0.26.0,<0.26.1",
    "msgspec>=0.19",
    "numpy>=1.26",
    "pillow>=12",
    "tokenizers>=0.23",
    "torch>=2.6",
    "torchvision>=0.21",
    "transformers>=5.17",
]

[project.entry-points."cozy.application"]
default = "ggml_logits:app"

[tool.uv.build-backend]
module-name = "ggml_logits"
module-root = ""
