[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-pause-twice"
version = "0.1.0"
description = "A deviceless root calling SDXL twice with a pause, beside idle models (xs-088 review R1)"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime[adapters,media]>=0.36.16", "msgspec>=0.19", "sdxl==0.1.7",
    "diffusers==0.40.0", "transformers==5.16.1", "huggingface-hub==1.29.0", "torch==2.14.0",
]

[project.entry-points."cozy.application"]
default = "ci_pause_twice:app"

[tool.uv.build-backend]
module-name = "ci_pause_twice"
module-root = ""

[tool.uv.sources]
sdxl = { index = "tensorhub" }
