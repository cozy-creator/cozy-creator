[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-hang"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.43.1", "msgspec>=0.19", "torch>=2.6"]

[project.entry-points."cozy.application"]
default = "hang:app"

[tool.uv.build-backend]
module-name = "hang"
module-root = ""
