[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "kernel-ready-drive"
version = "0.1.0"
description = "kernel-ready-cpu's calls of the Runtime's kernel-readiness exerciser (cozy_runtime.bench.kernel_ready)"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.49.0.dev0,<0.50", "msgspec>=0.19", "torch>=2.14"]

[project.entry-points."cozy.application"]
default = "kernel_ready_drive:app"

[tool.uv.build-backend]
module-name = "kernel_ready_drive"
module-root = ""
