[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ggml-drive"
version = "0.1.0"
description = "ggml-kernels' calls of the Runtime's GEMM bench (cozy_runtime.bench): llama.cpp's matmuls in our engine"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.49.0.dev0,<0.50", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "ggml_drive:app"

[tool.uv.build-backend]
module-name = "ggml_drive"
module-root = ""
