# The strictly typed release-gate modules: cd release-gate && uv run --no-project --with mypy --with numpy mypy
# suites/bench/calibrate is checked on its own, beside torch, msgspec and the Runtime wheel: mypy --strict bench_calibrate
[mypy]
strict = True
mypy_path = $MYPY_CONFIG_FILE_DIR:$MYPY_CONFIG_FILE_DIR/suites/bench
files = runs.py, frames.py, bench.py, suites/bench/media.py, suites/bench/hog.py, suites/bench/comfy.py, suites/bench/vram.py
