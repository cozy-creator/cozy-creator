# What a change must run (CI v2: tracker/design/ci-v2.md). `ci/affected` reads this.
#
# Each changed path takes the first rule it matches; a path no rule matches takes its repo's
# `unmapped` (everything). `also` rules add their tokens to whatever else a path takes. Globs: `*` stays
# inside one directory, `**` spans directories.
# Tokens:
#   cli, imports, mps, gpu, gpu-datacenter   suites
#   cpu                                     every package through the candidate Runtime's executor on the CPU, tiny
#                                           random weights, and uploaded, locked and bound through the candidate cozy
#                                           (e2e/cpu): what the Runtime, TensorFS, varena, TensorD's frames, Calcifer's
#                                           describe, lock and binder, or a package decide
#   cli-release                             cozy's signed-in commands (e2e/release/run.sh): a release only, with the CI key
#   model                                   the cli suite's real inference on the CPU (BiRefNet's forward pass): what the
#                                           Runtime, TensorD, TensorFS, varena or the package decides. Every cli run
#                                           still resolves, downloads, imports and warms BiRefNet
#   varena                                  the memory manager's own suite (release-gate/suites/varena)
#   pkg:<name>                              a package's cells; pkg:* every package
#   os:macos, os:windows                    the cli suite on that OS too (Linux always). A PR takes them only from its
#                                           OS-specific paths (`also` below); a release takes all
#   build:<artifact>                        the change is in cozy, tensorfs, runtime or package: the candidate set
#                                           (TensorD, TensorFS, Runtime) is built, the change at its commit and the rest at master
#   everything                              every suite and package, on Linux
#   release                                 everything on every OS (the release's `--tokens release`)
#
# `mps` is chosen only explicitly (a dispatch's or the release gate's `select`) until it can pass: macOS runs no
# models itself yet (platform::Os::local_inference, cl-665), cozy reports no Apple GPU before cr-021 (`gpus: []` on
# Apple silicon) and every package's uv.lock is Linux-only. It joins `everything`, `platform` and the BiRefNet/SDXL
# extras when all land.

everything = ["cli", "imports", "cpu", "model", "gpu", "gpu-datacenter", "varena", "pkg:*"]
release = ["everything", "os:macos", "os:windows", "cli-release"]

[cozy-creator]
unmapped = ["everything", "build:cozy", "build:tensorfs"]
rules = [
  { paths = ["**/*.md", "docs/**", "LICENSE", ".gitignore"], select = [] },
  # The page cozy embeds; web/app imports web/player, which pages.yaml also deploys.
  { paths = ["web/**"], select = ["cli", "build:cozy"] },
  # The cli suite's own parts and coverage map: a PR's cells. The imports suite cannot break by them.
  { paths = ["e2e/cli/run.sh"], select = ["cli", "model", "build:cozy"] },
  { paths = ["e2e/cli/**", "e2e/coverage.*"], select = ["cli", "build:cozy"] },
  { paths = ["e2e/cpu/**"], select = ["cpu", "build:cozy"] },
  { paths = ["ci/**", "e2e/**", ".github/workflows/e2e.yaml"], select = ["cli", "imports", "model", "build:cozy"] },
  { paths = ["release-gate/**", ".github/workflows/release-gate.yml"], select = ["gpu", "gpu-datacenter", "varena", "pkg:*"] },
  # Installers and release archives: the cli suite installs them on every OS at release.
  { paths = [".github/workflows/cozy-publish.yaml", ".github/workflows/cozy-attestations.yaml", ".github/workflows/cozy-promote.yaml", "dist-workspace.toml", "scripts/patch-installers.sh"], select = ["cli", "os:macos", "os:windows"] },
  { paths = [".github/**"], select = [] },
  # build's memory-safety and route steps alone read these.
  { paths = ["deny.toml", "unsafe-boundaries.txt", "scripts/memory-safety.sh", "scripts/web-routes.sh"], select = [] },
]

# The macOS and Windows cli legs (a cold cozy build there is 6 and 13 min) run for what is OS-specific: the
# platform crate, installers, updating and replacing the binary, starting and restarting Calcifer, completions,
# the suite itself, and files named for an OS. A release runs them always.
[[cozy-creator.also]]
paths = [
  "crates/platform/**", "crates/cli/src/update.rs", "crates/cli/src/daemon.rs", "crates/cli/src/doctor.rs",
  "crates/cli/src/calcifer_client.rs", "crates/cli/src/completion.rs", "crates/calcifer/src/serve.rs",
  "crates/tensord/src/machine/binary.rs", "crates/tensord/src/machine/update.rs",
  "dist-workspace.toml", "scripts/patch-installers.sh", ".github/workflows/cozy-*.yaml",
  "e2e/lib.sh", "e2e/cli/**", "e2e/candidates/**",
  "**/*windows*", "**/*macos*", "**/*darwin*",
]
select = ["os:macos", "os:windows"]

# Whether every published package still installs and imports, and a real model's forward pass, are the Runtime's and
# the packages' questions, and of the crates that install, load and run them; a crate TensorD only depends on
# (api, platform) is not.
[[cozy-creator.also]]
paths = ["crates/tensord/**", "crates/executor-api/**", "crates/tensorfs/**", "crates/tensorfs-py/**", "crates/varena/**", "crates/varena-ledger/**"]
select = ["imports", "model", "cpu"]

# A crate's own change selects its tokens here, and also the tokens of every crate that depends on
# it (Cargo.toml dependency tables, transitively): changing `platform` selects what `tensord` does.
[cozy-creator.crates]
cozy = ["cli", "build:cozy"]
cli = ["cli", "cpu", "gpu", "pkg:sdxl", "build:cozy"]
calcifer = ["cli", "cpu", "gpu", "pkg:sdxl", "build:cozy"]
api = ["cli", "gpu", "pkg:sdxl", "build:cozy"]
platform = ["cli", "os:macos", "os:windows", "build:cozy"]
executor-api = ["cli", "build:cozy"]
tensord = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:cozy"]
tensorfs = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:cozy"]
varena = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:cozy"]
tensorfs-py = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:tensorfs"]

[cozy-runtime]
unmapped = ["everything", "build:runtime"]
rules = [
  { paths = ["**/*.md", "docs/**", "changelog.d/**", "research/**", "examples/**", "LICENSE"], select = [] },
  { paths = ["scripts/build-benchmark-site.py"], select = [] },
  { paths = [".github/workflows/e2e.yaml"], select = ["cli", "imports", "model", "build:runtime"] },
  { paths = [".github/**"], select = [] },
  # build's memory-safety step alone reads these.
  { paths = ["deny.toml", "unsafe-boundaries.txt", "scripts/memory-safety.sh"], select = [] },
  # Device detection and OS-specific code: every suite, and the cli suite on macOS and Windows.
  { paths = ["src/cozy_runtime/internal/accel.py", "**/*mps*", "**/*windows*", "**/*darwin*", "**/*macos*"], select = ["everything", "os:macos", "os:windows", "build:runtime"] },
  # `cozy-runtime describe` and `cozy new`: the author CLI.
  { paths = ["src/cozy_runtime/cli/**"], select = ["cli", "build:runtime"] },
]

[packages]
unmapped = ["everything"]
rules = [
  { paths = ["**/*.md", "docs/**", "research/**", "examples/**", "LICENSE", "NOTICE"], select = [] },
  # Linting config and publish tasks: no package's behaviour.
  { paths = ["pyproject.toml", "Taskfile.yaml"], select = [] },
  { paths = [".github/workflows/e2e.yaml"], select = ["cli", "imports", "model", "pkg:birefnet", "build:package"] },
  { paths = [".github/**"], select = [] },
  # build's memory-safety step alone reads these.
  { paths = ["deny.toml", "unsafe-boundaries.txt", "scripts/memory-safety.sh"], select = [] },
  { paths = ["scripts/h3*"], select = ["gpu", "pkg:minimax-h3"] },
]

# A directory whose pyproject.toml declares a cozy.application entry point is a package; `{dir}` is its name. SDXL rides along as the
# shared-environment canary. `extra` adds the suites that run a package's own cells (cli: BiRefNet on the CPU).
[packages.package]
select = ["imports", "cpu", "gpu", "pkg:{dir}", "pkg:sdxl", "build:package"]
extra = { birefnet = ["cli", "model"] }

[tensorhub]
unmapped = []
rules = [
  # No suite drives a candidate Hub yet: every suite rents and runs through tensorhub.com (CI v2 P4).
  { paths = ["**"], select = [] },
]
