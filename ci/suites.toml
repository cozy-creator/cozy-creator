  "crates/calcifer/src/machines.rs", "crates/tensord/src/estimate.rs", "e2e/cli/plan.sh", "e2e/cli/plan.py", "e2e/cli/machineset.sh"]
queue = ["crates/calcifer/src/placement.rs", "crates/calcifer/src/machines.rs", "crates/tensord/src/estimate.rs", "e2e/cli/plan.sh",
