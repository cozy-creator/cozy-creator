# What a change must run (CI v2: tracker/design/ci-v2.md). `ci/affected` reads this.
#
# Each changed path takes the first rule it matches; a path no rule matches takes its repo's
# `unmapped` (everything). `also` rules add their tokens to whatever else a path takes. Globs: `*` stays
# inside one directory, `**` spans directories.
# Tokens:
#   cli, imports, gpu, gpu-datacenter        suites
#   cpu                                     every package run as a person runs it on the CPU (cozy run --on local, real
#                                           TensorD), tiny random weights mirrored on the owned Hub, and uploaded and
#                                           locked through the candidate cozy (e2e/cpu): what the Runtime, TensorFS,
#                                           varena, TensorD, Calcifer's describe, lock and binder, or a package decide
#   skew-candidate                          the candidate cozy against a Hub of tensorhub master, production's line (the
#                                           Hub suite's cells, e2e/skew/run.sh), while the suites' Hub is tensorhub's RC
#   cli-release                             cozy's signed-in commands (e2e/release/run.sh): a release only, with the CI key
#   model                                   the cli suite's real inference on the CPU (BiRefNet's forward pass): what the
#                                           Runtime, TensorD, TensorFS, varena or the package decides. Every cli run
#                                           still resolves, downloads, imports and warms BiRefNet
#   varena                                  the memory manager's own suite (release-gate/suites/varena)
#   pkg:<name>                              a package's cells; pkg:* every package
#   os:macos, os:windows                    the cli suite on that OS too (Linux always). A PR takes them only from its
#                                           OS-specific paths (`also` below); a release takes all
#   build:<artifact>                        the change is in cozy, tensorfs, runtime or package: the candidate set
#                                           (TensorD, TensorFS, Runtime) is built, the change at its commit and the rest at master
#   everything                              every suite and package, on Linux
#   release                                 everything on every OS (the release's `--tokens release`)
#
# No suite runs models on a Mac's GPU: MPS returns as a varena backend, and its suite with it (cl-870).

everything = ["cli", "imports", "cpu", "model", "gpu", "gpu-datacenter", "varena", "pkg:*"]
release = ["everything", "os:macos", "os:windows", "cli-release"]

[cozy-creator]
unmapped = ["everything", "build:cozy", "build:tensorfs"]
rules = [
  { paths = ["**/*.md", "docs/**", "LICENSE", ".gitignore"], select = [] },
  # The page cozy embeds; web/app imports web/player, which pages.yaml also deploys.
  { paths = ["web/**"], select = ["cli", "build:cozy"] },
  # The cli suite's own parts and coverage map: a PR's cells. The imports suite cannot break by them.
  { paths = ["e2e/cli/run.sh"], select = ["cli", "model", "build:cozy"] },
  { paths = ["e2e/cli/**", "e2e/coverage.*"], select = ["cli", "build:cozy"] },
  { paths = ["e2e/cpu/**"], select = ["cpu", "build:cozy"] },
  { paths = ["ci/**", "e2e/**", ".github/workflows/e2e.yaml"], select = ["cli", "imports", "model", "build:cozy"] },
  { paths = ["release-gate/**", ".github/workflows/release-gate.yml"], select = ["gpu", "gpu-datacenter", "varena", "pkg:*"] },
  # Installers and release archives: the cli suite installs them on every OS at release.
  { paths = [".github/workflows/cozy-publish.yaml", ".github/workflows/cozy-attestations.yaml", ".github/workflows/cozy-promote.yaml", "dist-workspace.toml", "scripts/patch-installers.sh"], select = ["cli", "os:macos", "os:windows"] },
  { paths = [".github/**"], select = [] },
  # build's memory-safety, route and removed-features steps alone read these.
  { paths = ["deny.toml", "unsafe-boundaries.txt", "scripts/memory-safety.sh", "scripts/web-routes.sh", "scripts/removed-features.py"], select = [] },
]

# The macOS and Windows cli legs (a cold cozy build there is 6 and 13 min) run for what is OS-specific: the
# platform crate, installers, updating and replacing the binary, starting and restarting Calcifer, completions,
# the suite itself, and files named for an OS. A release runs them always.
[[cozy-creator.also]]
paths = [
  "crates/platform/**", "crates/cli/src/update.rs", "crates/cli/src/daemon.rs", "crates/cli/src/doctor.rs",
  "crates/cli/src/calcifer_client.rs", "crates/cli/src/completion.rs", "crates/calcifer/src/serve.rs",
  "crates/tensord/src/machine/binary.rs", "crates/tensord/src/machine/update.rs",
  "dist-workspace.toml", "scripts/patch-installers.sh", ".github/workflows/cozy-*.yaml",
  "e2e/lib.sh", "e2e/cli/**", "e2e/candidates/**",
  "**/*windows*", "**/*macos*", "**/*darwin*",
]
select = ["os:macos", "os:windows"]

# Whether every published package still installs and imports, and a real model's forward pass, are the Runtime's and
# the packages' questions, and of the crates that install, load and run them; a crate TensorD only depends on
# (api, platform) is not.
[[cozy-creator.also]]
paths = ["crates/tensord/**", "crates/executor-api/**", "crates/tensorfs/**", "crates/tensorfs-py/**", "crates/varena/**", "crates/varena-ledger/**"]
select = ["imports", "model", "cpu"]

# Model-execution checks follow the controller paths that describe, bind and dispatch models.
# Canvas, thumbnails and other CLI/Calcifer changes keep their functional CLI coverage.
[[cozy-creator.also]]
paths = ["crates/cli/src/run/**", "crates/calcifer/src/local_code.rs", "crates/calcifer/src/runs/bind.rs", "crates/calcifer/src/runs/spec.rs", "crates/calcifer/src/runs/target.rs", "crates/calcifer/src/runs/mod.rs", "crates/calcifer/src/project/jobs.rs", "crates/calcifer/src/project/mod.rs", "crates/calcifer/src/toolbox.rs", "crates/calcifer/src/tools.rs"]
select = ["cpu"]

# A crate's own change selects its tokens here, and also the tokens of every crate that depends on
# it (Cargo.toml dependency tables, transitively): changing `platform` selects what `tensord` does.
[cozy-creator.crates]
cozy = ["cli", "build:cozy"]
cli = ["cli", "gpu", "pkg:sdxl", "build:cozy"]
calcifer = ["cli", "gpu", "pkg:sdxl", "build:cozy"]
api = ["cli", "cpu", "gpu", "pkg:sdxl", "build:cozy"]
platform = ["cli", "os:macos", "os:windows", "build:cozy"]
executor-api = ["cli", "build:cozy"]
tensord = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:cozy"]
tensorfs = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:cozy"]
varena = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:cozy"]
tensorfs-py = ["cli", "gpu", "gpu-datacenter", "varena", "pkg:*", "build:tensorfs"]

[cozy-runtime]
unmapped = ["everything", "build:runtime"]
rules = [
  { paths = ["**/*.md", "docs/**", "changelog.d/**", "research/**", "examples/**", "LICENSE"], select = [] },
  { paths = ["scripts/build-benchmark-site.py"], select = [] },
  { paths = [".github/workflows/e2e.yaml"], select = ["cli", "imports", "model", "build:runtime"] },
  { paths = [".github/**"], select = [] },
  # build's memory-safety step alone reads these.
  { paths = ["deny.toml", "unsafe-boundaries.txt", "scripts/memory-safety.sh"], select = [] },
  # Device detection and OS-specific code: every suite, and the cli suite on macOS and Windows.
  { paths = ["src/cozy_runtime/internal/accel.py", "**/*mps*", "**/*windows*", "**/*darwin*", "**/*macos*"], select = ["everything", "os:macos", "os:windows", "build:runtime"] },
  # `cozy-runtime describe` and `cozy new`: the author CLI.
  { paths = ["src/cozy_runtime/cli/**"], select = ["cli", "build:runtime"] },
]

[packages]
unmapped = ["everything"]
rules = [
  { paths = ["**/*.md", "docs/**", "research/**", "examples/**", "LICENSE", "NOTICE"], select = [] },
  # Linting config and publish tasks: no package's behaviour.
  { paths = ["pyproject.toml", "Taskfile.yaml"], select = [] },
  { paths = [".github/workflows/e2e.yaml"], select = ["cli", "imports", "model", "pkg:birefnet", "build:package"] },
  { paths = [".github/**"], select = [] },
  # build's memory-safety step alone reads these.
  { paths = ["deny.toml", "unsafe-boundaries.txt", "scripts/memory-safety.sh"], select = [] },
  { paths = ["scripts/h3*"], select = ["gpu", "pkg:minimax-h3"] },
]

# A directory whose pyproject.toml declares a cozy.application entry point is a package; `{dir}` is its name. SDXL rides along as the
# shared-environment canary. `extra` adds the suites that run a package's own cells (cli: BiRefNet on the CPU).
[packages.package]
select = ["imports", "cpu", "gpu", "pkg:{dir}", "pkg:sdxl", "build:package"]
extra = { birefnet = ["cli", "model"] }

[tensorhub]
unmapped = []
rules = [
  # Hub verification uses an isolated fixture; hardware suites require isolated worker infrastructure.
  { paths = ["**"], select = [] },
]

# cl-1128 (Paul, 11-17: "test the hardest cases first, the most likely spots to break; test only so far as you need to"): the cli
# suite's Linux shards on an RC push. `edge` runs on every push, first. Each other shard runs when a path it names changed since it
# last went green on the RC (rc-e2e's `affected` reads that from the RC's earlier runs), its own cells included
# (e2e/cli/<its files>); a product path no shard names runs every shard. A release (`--tokens release`) runs every shard.
[cozy-creator.shards]
# Hardest first: what broke most often, then data and privacy, then the rest.
edge = ["web-solo", "stuck", "projectdb", "projectvault", "follow", "disk", "web-2d-solo", "selfupdate", "commands"]
# Every shard's harness.
all = ["e2e/lib.sh", "e2e/run.sh", "e2e/isolated.sh", "e2e/skew/**", "e2e/candidates/**", "e2e/hubcheck/**", "e2e/cli/run.sh",
  "e2e/cli/project/**", "e2e/cli/script/**", "e2e/cli/weightless/**", ".github/workflows/e2e.yaml", "ci/**", "Cargo.lock",
  "Cargo.toml", "rust-toolchain.toml", "crates/api/**", "crates/platform/**", "crates/cozy/**"]
[cozy-creator.shards.paths]
# What plays on screen (cl-1208): the players, their slots across tabs, Focus's frame and the files they read; its cell runs once on the
# built page and once from Vite as `dev = true` serves it, which only its own shard installs.
web-playback = ["web/app/src/api/events.ts", "web/app/src/api/transport.ts", "web/app/src/canvas/Media.tsx", "web/app/src/canvas/Orbit.tsx",
  "web/app/src/canvas/FocusFrame.tsx", "web/app/src/canvas/FocusedViewport.css", "web/app/src/canvas/FullScreen.ts", "web/app/src/canvas/Card.tsx",
  "web/app/src/canvas/CanvasHost.tsx", "web/app/src/canvas/board/**", "web/app/src/canvas/timeline/**", "web/app/src/main.tsx",
  "web/app/package.json", "web/app/pnpm-lock.yaml", "web/app/vite.config.*", "crates/calcifer/src/files.rs", "e2e/cli/web/playback.spec.js"]
# What a player asks of Calcifer, and how browsers read it ahead (cl-1220): twelve videos at once in three windows, in Chrome and Firefox.
web-media = ["web/app/src/api/transport.ts", "web/app/src/canvas/Media.tsx", "web/app/src/canvas/Orbit.tsx",
  "web/app/src/canvas/TakeProgress.tsx", "web/app/src/canvas/board/Media.ts", "web/app/src/canvas/timeline/Preview.ts", "crates/calcifer/src/files.rs",
  "crates/calcifer/src/outputs.rs", "crates/calcifer/src/project/thumbs.rs", "e2e/cli/web.sh", "e2e/cli/web/pieces.spec.js"]
runs = ["crates/cli/src/run/**", "crates/calcifer/src/runs/**", "crates/calcifer/src/stages.rs", "crates/calcifer/src/previews.rs",
  "crates/calcifer/src/reports.rs", "crates/calcifer/src/play.rs", "crates/tensord/src/gpu_service.rs", "crates/tensord/src/execution.rs",
  "crates/tensord/src/seam.rs", "crates/tensord/src/access.rs", "crates/executor-api/**", "crates/tensorfs/**", "crates/varena*/**",
  "web/app/src/panels/runs/stages.json", "e2e/cli/previews.sh", "e2e/cli/reports.sh", "e2e/cli/llm.sh", "e2e/cli/control.sh",
  "e2e/cli/stages.py", "e2e/cli/sampler/**"]
executors = ["crates/tensord/src/machine/**", "crates/tensord/src/gpu_service.rs", "crates/tensord/src/process.rs",
  "crates/tensord/src/stop.rs", "crates/calcifer/src/machines.rs", "crates/calcifer/src/machine_client.rs",
  "crates/calcifer/src/update.rs", "crates/cli/src/update.rs", "e2e/cli/lifetime.sh", "e2e/cli/released.sh", "e2e/cli/installed.sh"]
local-code = ["crates/calcifer/src/local_code*", "crates/calcifer/src/local_code/**", "crates/calcifer/src/checkout.rs",
  "crates/calcifer/src/rc.rs", "crates/calcifer/src/floor*", "crates/tensord/src/local_source.rs", "crates/tensord/src/trees.rs",
  "crates/tensord/src/published*", "crates/tensord/src/calls.rs", "crates/tensord/src/child_launcher.rs",
  "crates/calcifer/src/rentals.rs", "e2e/cli/source.sh", "e2e/cli/rental.sh", "e2e/cli/relay/**", "e2e/cli/returned-media/**"]
ondemand = ["crates/tensord/src/ahead.rs", "crates/tensord/src/runs*", "crates/tensord/src/runs/**", "crates/tensord/src/line.rs",
