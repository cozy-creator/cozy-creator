# The type check (scripts/typecheck.sh): mypy --strict, once per import root, against the pinned real libraries.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
disallow_any_generics = True
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True
implicit_reexport = False
enable_error_code = ignore-without-code,possibly-undefined,truthy-bool
# Each root reports its own files; what it imports from another root is checked in that root's run.
follow_imports = silent
follow_imports_for_stubs = True
# torch leaves torch.cuda.Stream(), Event() and _sleep() unannotated.
untyped_calls_exclude = torch

# Untyped libraries (no py.typed): Triton, cuda-python, OpenTimelineIO, maturin (nvidia-ml-py: typings/pynvml.pyi); and SeedVR's `models`
# and RelayVSR's `refvsr_inference`, which crates/tensorfs-py/scripts/converters.py imports from checkouts it downloads.
[mypy-triton,triton.*,cuda,cuda.*,opentimelineio,opentimelineio.*,maturin,maturin.*,models,models.*,refvsr_inference,refvsr_inference.*]
ignore_missing_imports = True

# A @triton.jit kernel's def line and body are its Triton cache key (and crates/tensorfs-py/kernels/*.py are the AOT
# catalog's source receipts): annotating them would miss every prebuilt kernel, so these modules keep untyped kernels.
# `build` is kernels/build.py's name, and crates/tensorfs-py/shim/build.py's too.
[mypy-kernels,abi,build,ci_conditional_body]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_calls = False
disallow_untyped_decorators = False
disallow_any_decorated = False
disallow_any_unimported = False
warn_unused_ignores = False

# The TensorFS conversion oracles are frozen: each ORACLE.md pins its file's SHA-256, so they are never edited. Most are the
# TensorFS programs' (suites/tensorfs/programs, xs-174); derive-adapters' is offline_producers_oracle's bytes.
[mypy-bf16_normalize_oracle,checkpoint_quantize_oracle,convrot_encode_oracle,nvfp4_encode_oracle,offline_producers_oracle,rowwise_quantize_oracle,ci_derive_adapters.oracle,ci_svdq_calibration.oracle]
ignore_errors = True
