# The type check (scripts/typecheck.sh): mypy --strict, once per import root, against the pinned real libraries.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
disallow_any_generics = True
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True
implicit_reexport = False
enable_error_code = ignore-without-code,possibly-undefined,redundant-expr,truthy-bool
# Each root reports its own files; what it imports from another root is checked in that root's run.
follow_imports = silent
# torch leaves torch.cuda.Stream(), Event() and _sleep() unannotated.
untyped_calls_exclude = torch

# Untyped libraries (no py.typed): Triton, cuda-python, nvidia-ml-py, OpenTimelineIO, maturin; and SeedVR's `models`,
# which crates/tensorfs-py/scripts/converters.py imports from a checkout it downloads.
[mypy-triton,triton.*,cuda,cuda.*,pynvml,opentimelineio,opentimelineio.*,maturin,maturin.*,models,models.*]
ignore_missing_imports = True

# A @triton.jit kernel's def line and body are its Triton cache key (and crates/tensorfs-py/kernels/*.py are the AOT
# catalog's source receipts): annotating them would miss every prebuilt kernel, so these modules keep untyped kernels.
[mypy-kernels,abi,ci_kernels.static_check,ci_conditional_body,writes]
disallow_untyped_defs = False
disallow_incomplete_defs = False
disallow_untyped_decorators = False
disallow_any_decorated = False
disallow_any_unimported = False

# The TensorFS conversion oracles are frozen: each ORACLE.md pins its file's SHA-256, so they are never edited.
[mypy-ci_bf16_normalize.oracle,ci_checkpoint_quantize.oracle,ci_convrot_encode.oracle,ci_nvfp4_encode.oracle,ci_offline_producers.oracle,ci_rowwise_quantize.oracle,ci_svdq_calibration.oracle]
ignore_errors = True
